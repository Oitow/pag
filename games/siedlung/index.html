<script type="module">
let THREE=null;
for(const u of['https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js','https://unpkg.com/three@0.160.0/build/three.module.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js']){
  try{THREE=await import(u);break;}catch(e){console.warn('three load failed',u,e);}
}
if(!THREE)throw new Error('three.js konnte nicht geladen werden (CDN blockiert?)');

/*LOGIC_START*/
// ---------- Reine Logik (ohne THREE): Noise, Weltgenerierung, Abnutzung, A* ----------
const N=128, HALF=64, VS=0.5, VN=2*N+1;
const T_FREE=0,T_TREE=1,T_ROCK=2,T_BUSH=3,T_BUILD=4,T_ROAD=5,T_FIELD=6;
// Reine Hilfen fürs Spiel
function seasonOf(yearT,len){return Math.floor(Math.max(0,yearT)/len)%4;}
function happinessOf(f){let v=35+f.variety*7+f.well*15+f.market*12+f.deco*10-f.homeless*20+(f.bread?4:0)-(f.cold||0)*20-(f.sick||0)*20;if(f.noFood)v-=35;return Math.max(0,Math.min(100,Math.round(v)));}
function numOr(v,d){v=+v;return Number.isFinite(v)?v:d;}
function sstep(a,b,x){let t=(x-a)/(b-a);t=t<0?0:t>1?1:t;return t*t*(3-2*t);}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function makeNoise(seed){
  function hash(x,z){let h=(Math.imul(x|0,374761393)+Math.imul(z|0,668265263)+Math.imul(seed|0,1442695041))|0;h=Math.imul(h^(h>>>13),1274126177);h=h^(h>>>16);return (h>>>0)/4294967295;}
  function vnoise(x,z){const xi=Math.floor(x),zi=Math.floor(z);let xf=x-xi,zf=z-zi;xf=xf*xf*(3-2*xf);zf=zf*zf*(3-2*zf);
    const a=hash(xi,zi),b=hash(xi+1,zi),c=hash(xi,zi+1),d=hash(xi+1,zi+1);return a+(b-a)*xf+(c-a)*zf+(a-b-c+d)*xf*zf;}
  function fbm(x,z,o){let s=0,a=1,f=1,n=0;for(let i=0;i<o;i++){s+=vnoise(x*f+i*17.3,z*f-i*9.1)*a;n+=a;a*=.5;f*=2.03;}return s/n;}
  return {hash,vnoise,fbm};
}
// Biome: 0 Strand,1 Wiese,2 Wald,3 Birkenhain,4 Heide,5 Sumpf,6 Fels,7 Schnee
const B_BEACH=0,B_MEADOW=1,B_FOREST=2,B_BIRCH=3,B_HEATH=4,B_MARSH=5,B_ROCK=6,B_SNOW=7;
// Baumarten: 0 Tanne,1 Eiche,2 Birke,3 Kiefer
function createWorld(seed,force){
  const {hash,fbm}=makeNoise(seed);
  const rng=mulberry(seed^0x9e3779b9);
  const o1=hash(1,2)*100,o2=hash(3,4)*100;
  function rawH(x,z){
    const wx=fbm(x*.016+11.3+o1,z*.016+3.7,3)-.5, wz=fbm(x*.016-7.1,z*.016+19.2+o2,3)-.5;
    const px=x+wx*34, pz=z+wz*34;
    const r=Math.hypot(px,pz),th=Math.atan2(pz,px);
    // Küstenradius variiert mit dem Winkel -> Buchten & Halbinseln
    const cr=.74+.62*(fbm(Math.cos(th)*1.5+40+o1,Math.sin(th)*1.5-20,3)-.5)+.22*(fbm(Math.cos(th)*4+9,Math.sin(th)*4+o2,2)-.5);
    const d=r/(HALF*cr);
    const e=fbm(px*.03+5,pz*.03-9,5);
    let h=(1-d*d)*1.55+(e-.5)*2.0-.2;
    if(h<0)return h*2.4;
    const rn=fbm(px*.05+77,pz*.05-31,4),ridge=1-Math.abs(rn*2-1);
    const mm=sstep(.42,.62,fbm(px*.017+200,pz*.017-120,3));
    h=h*1.35+sstep(.2,1.1,h)*(ridge*ridge*ridge*2.2+mm*ridge*ridge*3.6)+sstep(.9,1.6,h)*(h-.9)*2;
    return h;
  }
  const H=new Float32Array(VN*VN);
  for(let vz=0;vz<VN;vz++)for(let vx=0;vx<VN;vx++)H[vz*VN+vx]=rawH(-HALF+vx*VS,-HALF+vz*VS);
  const edgeSink=()=>{for(let vz=0;vz<VN;vz++)for(let vx=0;vx<VN;vx++){const e=Math.min(vx,vz,VN-1-vx,VN-1-vz);if(e<14){const i=vz*VN+vx;H[i]=Math.min(H[i],-1.6+e*0.11);}}};
  edgeSink();
  // ---- Hydraulische Erosion (Tropfen) ----
  {
    const DROPS=9000,MAXS=36;
    for(let d=0;d<DROPS;d++){
      let x=1+rng()*(VN-3),z=1+rng()*(VN-3),dx=0,dz=0,sp=1,w=1,sed=0;
      for(let s=0;s<MAXS;s++){
        const ix=x|0,iz=z|0,fx=x-ix,fz=z-iz,i=iz*VN+ix;
        const a=H[i],b=H[i+1],c=H[i+VN],e=H[i+VN+1];
        if(a<-0.3)break;
        const gx=(b-a)*(1-fz)+(e-c)*fz,gz=(c-a)*(1-fx)+(e-b)*fx;
        const hOld=a+(b-a)*fx+(c-a)*fz+(a-b-c+e)*fx*fz;
        dx=dx*.1-gx*.9;dz=dz*.1-gz*.9;const l=Math.hypot(dx,dz);if(l<1e-6)break;dx/=l;dz/=l;
        const nx=x+dx,nz=z+dz;if(nx<1||nz<1||nx>=VN-2||nz>=VN-2)break;
        const jx=nx|0,jz=nz|0,kx=nx-jx,kz=nz-jz,j=jz*VN+jx;
        const hNew=H[j]+(H[j+1]-H[j])*kx+(H[j+VN]-H[j])*kz+(H[j]-H[j+1]-H[j+VN]+H[j+VN+1])*kx*kz;
        const dh=hNew-hOld;
        const cap=Math.max(-dh*sp*w*3,.01);
        let amt;
        if(sed>cap||dh>0){amt=dh>0?Math.min(dh,sed):(sed-cap)*.3;sed-=amt;}
        else{amt=-Math.min((cap-sed)*.25,-dh);sed-=amt;}
        // amt>0 ablagern, amt<0 abtragen (bilinear auf 4 Ecken)
        H[i]+=amt*(1-fx)*(1-fz);H[i+1]+=amt*fx*(1-fz);H[i+VN]+=amt*(1-fx)*fz;H[i+VN+1]+=amt*fx*fz;
        sp=Math.sqrt(Math.max(0,sp*sp-dh*4));if(!(sp>0))sp=.05;w*=.97;x=nx;z=nz;
      }
    }
    // leichte Glättung, stärker an steilen Hängen
    const T=new Float32Array(H);
    for(let vz=1;vz<VN-1;vz++)for(let vx=1;vx<VN-1;vx++){const i=vz*VN+vx;const av=(T[i-1]+T[i+1]+T[i-VN]+T[i+VN])*.25;
      const sl=Math.abs(T[i+1]-T[i-1])+Math.abs(T[i+VN]-T[i-VN]);H[i]=T[i]+(av-T[i])*(.25+.35*sstep(.4,1.4,sl));}
  }
  // ---- Fluss: vom Berg zum Meer ----
  const river=new Uint8Array(VN*VN),riverPath=[];
  {
    const cands=[];
    for(let k=0;k<600;k++){const vx=20+(rng()*(VN-40))|0,vz=20+(rng()*(VN-40))|0,i=vz*VN+vx,h=H[i];
      if(h<2.2||h>5.5)continue;cands.push([-Math.abs(h-3.2)*.5-Math.hypot(vx-VN/2,vz-VN/2)*.03+rng()*.6,i]);}
    cands.sort((a,b)=>b[0]-a[0]);
    for(let ci=0;ci<Math.min(8,cands.length)&&!riverPath.length;ci++){const src=cands[ci][1];
      const seen=new Set();let cur=src,ok=false;const pts=[];const c0=(VN-1)/2;
      for(let s=0;s<900;s++){
        pts.push(cur);seen.add(cur);
        if(H[cur]<-0.25){ok=true;break;}
        const cx=cur%VN,cz=(cur/VN)|0;if(cx<2||cz<2||cx>VN-3||cz>VN-3){ok=true;break;}
        const rc=Math.hypot(cx-c0,cz-c0);let bn=-1,bc=1e9;
        for(let dz=-1;dz<=1;dz++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dz)continue;const n=cur+dz*VN+dx;if(seen.has(n))continue;
          const c=H[n]-(Math.hypot(cx+dx-c0,cz+dz-c0)-rc)*.12+hash(n,77)*.04;if(c<bc){bc=c;bn=n;}}
        if(bn<0)break;cur=bn;
      }
      if(ok&&pts.length>40){
        const h0=new Float32Array(pts.length);for(let k=0;k<pts.length;k++)h0[k]=Math.max(0,H[pts[k]]);
        for(let k=0;k<pts.length;k++){
          const cx=pts[k]%VN,cz=(pts[k]/VN)|0,t=k/pts.length;
          const core=1.6+t*1.6,bank=2.5+h0[k]*2.2,R=Math.ceil(core+bank);
          for(let dz=-R;dz<=R;dz++)for(let dx=-R;dx<=R;dx++){const x=cx+dx,z=cz+dz;if(x<1||z<1||x>VN-2||z>VN-2)continue;
            const dd=Math.hypot(dx,dz);if(dd>R)continue;const i=z*VN+x;
            const bed=-0.38-t*.15,k2=sstep(core,core+bank,dd);const tgt=bed*(1-k2)+H[i]*k2;
            if(tgt<H[i])H[i]=tgt;if(dd<core+.6)river[i]=1;}
          if(k%2===0)riverPath.push([-HALF+cx*VS,-HALF+cz*VS]);
        }
      }
    }
  }
  // ---- Seen ----
  const lakeC=[];
  for(let k=0,n=1+((rng()*3)|0);k<300&&lakeC.length<n;k++){
    const vx=24+(rng()*(VN-48))|0,vz=24+(rng()*(VN-48))|0,i=vz*VN+vx;if(H[i]<.6||H[i]>2.6||river[i])continue;
    const R=6+rng()*7;let bad=false;for(const l of lakeC)if(Math.hypot(l[0]-vx,l[1]-vz)<l[2]+R+8)bad=true;
    if(Math.hypot(vx-VN/2,vz-VN/2)<14)bad=true;if(bad)continue;lakeC.push([vx,vz,R]);
    const RR=Math.ceil(R*1.9);
    for(let dz=-RR;dz<=RR;dz++)for(let dx=-RR;dx<=RR;dx++){const x=vx+dx,z=vz+dz;if(x<1||z<1||x>VN-2||z>VN-2)continue;
      const a=Math.atan2(dz,dx),rr=R*(.75+.5*fbm(Math.cos(a)*1.3+k*7,Math.sin(a)*1.3,2));const dd=Math.hypot(dx,dz);
      const j=z*VN+x,k2=sstep(rr*.7,rr*1.5,dd),tgt=(-0.45-0.25*sstep(rr*.7,0,dd))*(1-k2)+H[j]*k2;if(tgt<H[j])H[j]=tgt;}
  }
  edgeSink();
  function heightAt(x,z){
    let fx=(x+HALF)/VS,fz=(z+HALF)/VS;
    if(!(fx>=0))fx=0;if(!(fz>=0))fz=0;if(fx>VN-1.001)fx=VN-1.001;if(fz>VN-1.001)fz=VN-1.001;
    const ix=fx|0,iz=fz|0,ax=fx-ix,az=fz-iz,i=iz*VN+ix;
    const a=H[i],b=H[i+1],c=H[i+VN],d=H[i+VN+1];
    return a+(b-a)*ax+(c-a)*az+(a-b-c+d)*ax*az;
  }
  const NN=N*N;
  const tH=new Float32Array(NN),tMin=new Float32Array(NN),tSlope=new Float32Array(NN),tWater=new Uint8Array(NN),occ=new Uint8Array(NN);
  const tBiome=new Uint8Array(NN),tMoist=new Float32Array(NN),tOcean=new Uint8Array(NN),tWD=new Uint8Array(NN);
  function computeTiles(){
    for(let tz=0;tz<N;tz++)for(let tx=0;tx<N;tx++){
      let mn=1e9,mx=-1e9;
      for(let dz=0;dz<3;dz++)for(let dx=0;dx<3;dx++){const h=H[(2*tz+dz)*VN+2*tx+dx];if(h<mn)mn=h;if(h>mx)mx=h;}
      const i=tz*N+tx,c=H[(2*tz+1)*VN+2*tx+1];
      tH[i]=c;tMin[i]=mn;tSlope[i]=mx-mn;tWater[i]=c<0.03?1:0;
    }
    // Ozean (vom Rand geflutet) vs. Binnengewässer; Abstand zum Wasser (BFS)
    tOcean.fill(0);tWD.fill(255);const q=new Int32Array(NN);let qh=0,qt=0;

function canPlace(t,tx,tz){const s=fsz(t);for(let dz=0;dz<s;dz++)for(let dx=0;dx<s;dx++)if(!W.buildable(tx+dx,tz+dz))return false;
  if(DEF[t].water){let m=255;for(let dz=0;dz<s;dz++)for(let dx=0;dx<s;dx++)m=Math.min(m,W.tWD[(tz+dz)*N+tx+dx]);if(m>4||!fishSpots({tx,tz,x:tcen(tx),z:tcen(tz)}).length)return false;}

function inFoot(b,tx,tz){return tx>=b.tx&&tz>=b.tz&&tx<b.tx+b.s&&tz<b.tz+b.s;}
function placeBuilding(type,tx,tz,instant,force){
  const s=fsz(type);

function goTo(n,x,z,direct){n.goal=true;n.gx=x;n.gz=z;n.path=null;n.pi=0;n.pending=!direct;}

function computePath(n){
  const sx=Math.floor(n.x+HALF),sz=Math.floor(n.z+HALF),gx=Math.floor(n.gx+HALF),gz=Math.floor(n.gz+HALF);
  const key=(sz*N+sx)*65536+(gz*N+gx),now=simT;

  if(c&&now-c.t<20){n.path=c.p;}
  else{n.path=PF.find(sx,sz,gx,gz,7000);if(pathCache.size>400)pathCache.clear();pathCache.set(key,{p:n.path,t:now});}
  n.pi=0;n.pending=false;

function walkableXZ(x,z){if(heightAt(x,z)<0.08)return false;const tx=Math.floor(x+HALF),tz=Math.floor(z+HALF);if(tx<0||tz<0||tx>=N||tz>=N)return false;return W.occ[tz*N+tx]!==T_BUILD;}
function nearestFree(list,cx,cz,r2){let best=null,bd=r2;for(const o of list){if(o.res)continue;const amt=o.wood!==undefined?o.wood:o.stone!==undefined?o.stone:o.food;if(!(amt>0))continue;const d=(o.x-cx)**2+(o.z-cz)**2;if(d<bd){bd=d;best=o;}}return best;}
function nearestStore(x,z){let best=null,bd=1e9;for(const b of buildings){if(b.type!=='store'||!b.done)continue;const d=(b.x-x)**2+(b.z-z)**2;if(d<bd){bd=d;best=b;}}return best;}

function wake(n){n.hidden=false;n.goal=null;if(n.job){if(n.carry>0)sendToStore(n);else n.state='seek';}else if(n.carry>0)sendToStore(n);else n.state='idle';n.timer=Math.random()*2;}
function fishSpots(b){const out=[],r=DEF.fisher.radius;
  for(let dz=-r;dz<=r;dz++)for(let dx=-r;dx<=r;dx++){const tx=b.tx+dx,tz=b.tz+dz;if(!W.inMap(tx,tz)||dx*dx+dz*dz>r*r)continue;const i=tz*N+tx;
    if(W.tWater[i]||W.tWD[i]!==1||W.occ[i]===T_BUILD||W.tSlope[i]>2.8||W.tH[i]<0.03)continue;
    let wx=0,wz=0;for(let k=0;k<4;k++){const nx=tx+(k===0)-(k===1),nz=tz+(k===2)-(k===3);if(W.tWater[nz*N+nx]){wx+=nx-tx;wz+=nz-tz;}}
    out.push({x:tcen(tx),z:tcen(tz),wx,wz});}
  out.sort((a,c)=>((a.x-b.x)**2+(a.z-b.z)**2)-((c.x-b.x)**2+(c.z-b.z)**2));return out.slice(0,30);}
function doSeek(n){
  const b=n.job,d=DEF[b.type];n.wk=d.work;n.tgt=null;
  if(econFull(b)){n.state='wait';n.timer=5;const dd=door(b);goTo(n,dd.x,dd.z);return;}
  if(d.work==='tree'||d.work==='rock'||d.work==='bush'){const r=nearestFree(RLIST[d.work],b.x,b.z,d.radius*d.radius);if(r){r.res=n;n.res=r;n.state='toRes';goTo(n,r.x+.3,r.z+.3);return;}}
  else if(d.work==='field'&&b.plots){let p=null;for(const q of b.plots)if(q.st===2&&!q.res){p=q;break;}
    if(!p&&growSeason())for(const q of b.plots)if(q.st===0&&!q.res){p=q;break;}
    if(p){p.res=n;n.res=p;n.wk=p.st===2?'harvest':'sow';n.state='toRes';goTo(n,p.x+.2,p.z+.2);return;}}
  else if(d.work==='fish'){if(!b.spots)b.spots=fishSpots(b);if(b.spots.length){const s=b.spots[(Math.random()*Math.min(10,b.spots.length))|0];n.tgt=s;n.state='toRes';goTo(n,s.x,s.z);return;}}
  else if(d.work==='hunt'){let best=null,bd=d.radius*d.radius;for(const a of deer){if(a.dead||a.res)continue;const dd=(a.x-b.x)**2+(a.z-b.z)**2;if(dd<bd){bd=dd;best=a;}}
    if(best){best.res=n;n.res=best;n.state='toRes';goTo(n,best.x-.5,best.z-.5);return;}}
  else if(d.work==='site'){n.wk=d.wk;n.state='toRes';const dd=door(b);goTo(n,dd.x+(Math.random()-.5)*.4,dd.z+(Math.random()-.5)*.4);return;}
  else if(d.work==='sheep'){let best=null,bd=1e9;for(const a of sheep){if(a.b!==b||a.dead||a.res||a.wool<1)continue;const q=(a.x-n.x)**2+(a.z-n.z)**2;if(q<bd){bd=q;best=a;}}
    if(best){best.res=n;n.res=best;n.wk='sheep';n.state='toRes';goTo(n,best.x-.35,best.z-.35);return;}}
  else if(d.work==='prod'){if(has(d.in)&&!(d.lim&&res[Object.keys(d.out)[0]]>=d.lim())){const s=nearestStore(n.x,n.z);if(s){n.state='toFetch';const dd=door(s);goTo(n,dd.x,dd.z);return;}}}
  n.state='wait';n.timer=4+Math.random()*2;const dd=door(b);goTo(n,dd.x,dd.z);
}

let night=false;
const WEAR_RATE=0.13,WEAR_DECAY=0.0011;
function updateNpc(n,dt){
  if(night||restT){if(n.state!=='toHome'&&n.state!=='sleep'){releaseRes(n);if(n.site){n.site.builder=null;n.site=null;}n.state='toHome';const d=door(n.home);goTo(n,d.x,d.z);}}
  else if(n.state==='toHome'||n.state==='sleep')wake(n);
  if(n.state==='sleep')return;
  n.timer-=dt;
  switch(n.state){
    case 'idle':
      if(!n.job&&!n.site&&n.carry<=0&&popCanWork(n)){
        let site=null,bd=1e9;for(const b of buildings){if(b.done||b.builder)continue;const d=(b.x-n.x)**2+(b.z-n.z)**2;if(d<bd){bd=d;site=b;}}
        if(site){site.builder=n;n.site=site;n.state='toSite';const dd=door(site);goTo(n,dd.x,dd.z);break;}
      }
      if(n.job){n.state='seek';break;}
      if(n.timer<=0&&!n.goal){const h=door(n.home);for(let k=0;k<6;k++){const x=h.x+(Math.random()-.5)*7,z=h.z+(Math.random()-.5)*7;if(walkableXZ(x,z)){goTo(n,x,z,true);break;}}n.timer=3+Math.random()*4;}
      break;
    case 'seek':if(n.job)doSeek(n);else n.state='idle';break;
    case 'wait':if(n.timer<=0)n.state=n.job?'seek':'idle';break;
    case 'work':if(n.timer<=0)finishWork(n);break;
    case 'craft':if(!n.job){n.state='idle';break;}if(n.timer<=0)finishCraft(n);n.phase+=dt*4;break;
    case 'build':if(!n.site||n.site.done){n.site=null;n.state='idle';}break;
  }
  let moving=false;
  if(n.goal&&n.pending&&pathBudget>0){pathBudget--;computePath(n);}
  if(n.goal&&!n.pending){
    let wx=n.gx,wz=n.gz,last=true;
    if(n.path&&n.pi<n.path.length-1){const t=n.path[n.pi];wx=(t%N)-HALF+.5+n.ox;wz=((t/N)|0)-HALF+.5+n.oz;last=false;}
    const dx=wx-n.x,dz=wz-n.z,d=Math.hypot(dx,dz);
    if(d<(last?.06:.2)){if(last){n.goal=null;arrive(n);}else n.pi++;}
    else{
      const tx=Math.floor(n.x+HALF),tz=Math.floor(n.z+HALF),ti=tz*N+tx,inb=tx>=0&&tz>=0&&tx<N&&tz<N;
      const rf=inb&&W.occ[ti]===T_ROAD?2.1:1+.75*(inb?W.tileWear(ti):0);
      const sp=(n.state==='idle'?.55:1.2)*rf*dt;
      const st=Math.min(sp,d),nx=n.x+dx/d*st,nz=n.z+dz/d*st;
      if(n.state==='idle'&&heightAt(nx,nz)<0.08){n.goal=null;}
      else{n.x=nx;n.z=nz;moving=true;W.addWear(n.x,n.z,WEAR_RATE*dt*(n.state==='idle'?.5:1));}
      let a=Math.atan2(dx,dz)-n.rot;a=Math.atan2(Math.sin(a),Math.cos(a));n.rot+=a*Math.min(1,dt*10);
    }
  }
  if(n.state==='build'&&n.site&&!n.site.done){n.site.progress+=dt/(BUILD_T*(n.site.s>1?1.6:1));n.phase+=dt*8;}
  n.phase+=dt*(moving?11:2);
  n.moving=moving;
}
const WORK_T={tree:2.0,rock:3.0,bush:1.8,sow:1.4,harvest:2.0,hunt:1.2};
function arrive(n){
  switch(n.state){
    case 'toRes':{
      if(SITE_WK[n.wk]){if(!n.job){n.state='idle';break;}n.state='work';n.timer=(DEF[n.job.type].wt||5)*useTools();break;}
      if(n.wk==='fish'){n.state='work';n.timer=5+Math.random()*2;if(n.tgt&&(n.tgt.wx||n.tgt.wz))n.rot=Math.atan2(n.tgt.wx,n.tgt.wz);break;}
      const r=n.res;if(!r){n.state='seek';break;}n.state='work';n.timer=(WORK_T[n.wk]||2)*useTools();n.rot=Math.atan2(r.x-n.x,r.z-n.z);break;}
    case 'toFetch':{const d=n.job&&DEF[n.job.type];if(!d||!d.in){n.state='idle';break;}
      if(has(d.in)){addRes(d.in,-1);n.carryIn=Object.assign({},d.in);n.carry=sumC(d.in);n.carryType=Object.keys(d.in)[0];n.state='toShop';const dd=door(n.job);goTo(n,dd.x,dd.z);}
      else{n.state='wait';n.timer=4;}break;}
    case 'toShop':{if(!n.job){sendToStore(n);break;}n.state='craft';n.timer=DEF[n.job.type].t*useTools()*(n.job.up?.75:1);n.carry=0;n.carryIn=null;n.rot=Math.atan2(n.job.x-n.x,n.job.z-n.z);break;}
    case 'toStore':{if(n.carry>0){if(n.carryIn){addRes(n.carryIn,1);n.carryIn=null;}else{res[n.carryType]+=capAdd(n.carryType,n.carry);stats.got[n.carryType]=(stats.got[n.carryType]||0)+n.carry;}
        popText('+'+n.carry+' '+RES_ICON[n.carryType],n.x,n.z);n.carry=0;}n.state=n.job?'seek':'idle';break;}
    case 'toSite':if(n.site&&!n.site.done){n.state='build';n.rot=Math.atan2(n.site.x-n.x,n.site.z-n.z);}else{n.site=null;n.state='idle';}break;
    case 'toHome':n.state='sleep';n.hidden=true;break;
  }
}
function finishWork(n){
  const wk=n.wk,r=n.res;n.res=null;if(r)r.res=null;
  if(wk==='fish'){n.carry=3;n.carryType='fish';sendToStore(n);return;}
  if(SITE_WK[wk]){if(!n.job){n.state='idle';return;}const y=DEF[n.job.type].yield,k=Object.keys(y)[0];n.carry=y[k];n.carryType=k;sendToStore(n);return;}
  if(!r){n.state='seek';return;}
  if(wk==='tree'){const i=treeIdx.get(r);r.wood--;n.carry=3;n.carryType='wood';
    if(r.wood<=0){W.occ[r.tz*N+r.tx]=T_FREE;r.regrow=70+Math.random()*60;pathCache.clear();}else r.s*=.88;setTree(r,i);flushTrees();}
  else if(wk==='rock'){r.stone-=2;n.carry=2;n.carryType='stone';
    if(r.stone<=0){r.stone=0;W.occ[r.tz*N+r.tx]=T_FREE;r.regrow=240;pathCache.clear();}setRock(r);flushRocks();}
  else if(wk==='bush'){const i=bushes.indexOf(r);n.carry=r.food;r.food=0;n.carryType='berry';r.regrow=45+Math.random()*20;setBush(r,i);berryIM.instanceMatrix.needsUpdate=true;if(n.carry<=0){n.state='seek';return;}}
  else if(wk==='sow'){if(r.st===0&&r.slot>=0){r.st=1;r.g=0;setCrop(r);}n.state='seek';return;}
  else if(wk==='harvest'){if(r.st===2&&r.slot>=0){r.st=0;r.g=0;setCrop(r);n.carry=badHarvest?2:4;n.carryType='wheat';}else{n.state='seek';return;}}
  else if(wk==='hunt'){if(!r.dead){killDeer(r);n.carry=4;n.carryType='meat';}else{n.state='seek';return;}}
  else if(wk==='sheep'){if(!r.dead&&r.wool>=1){r.wool=0;n.carry=2;n.carryType='wool';}else{n.state='seek';return;}}
  sendToStore(n);
}
function finishCraft(n){const d=DEF[n.job.type],k=Object.keys(d.out)[0];n.carry=d.out[k];n.carryType=k;n.carryIn=null;sendToStore(n);}
function limb(im,i,ox,oy,oz,a){m4b.makeRotationX(a);m4b.setPosition(ox,oy,oz);m4c.multiplyMatrices(m4,m4b);im.setMatrixAt(i,m4c);}
function drawNpcs(){
  for(let i=0;i<npcs.length;i++){const n=npcs[i];
    if(n.hidden){if(!n.wasHidden){for(const im of BODY_IMS)im.setMatrixAt(i,ZERO);if(n.ck){carryIM[n.ck].setMatrixAt(i,ZERO);n.ck=null;}n.wasHidden=true;}continue;}
    n.wasHidden=false;
    const y=Math.max(heightAt(n.x,n.z),-0.12)+(n.moving?Math.abs(Math.sin(n.phase))*.04:0);
    const working=n.state==='work'||n.state==='build'||n.state==='craft';

    eu.set(tilt,n.rot,0,'YXZ');qt.setFromEuler(eu);eu.order='XYZ';const zs=npcScale(n);m4.compose(v3.set(n.x,y,n.z),qt,sc.set(zs,zs,zs));

    if(ck){m4b.makeTranslation(0,.25,.16);m4c.multiplyMatrices(m4,m4b);carryIM[ck].setMatrixAt(i,m4c);}

}

// Ausbau
function upgOf(b){if(!b.done)return null;const u=UPG[b.type];if(u)return {to:u.to,c:u.c,lvl:u.lvl,name:DEF[u.to].name};
  if(DEF[b.type].work&&!b.up){const k=b.s>1?1.5:1,c={};for(const r in UPG_WORK.c)c[r]=Math.ceil(UPG_WORK.c[r]*k);return {c,lvl:UPG_WORK.lvl,name:'Werkstatt-Ausbau'};}return null;}
function upgEffect(b,u){const d=DEF[b.type];if(u.to)return 'Wohnraum '+d.cap+' → '+DEF[u.to].cap;return '+1 Arbeitsplatz'+(d.work==='prod'?' · 25 % schneller':'');}
function upgText(b){const u=upgOf(b);if(!u)return b.up?'<br>⭐ Ausgebaut':'';return '<br>⬆ <b>'+u.name+'</b>: '+upgEffect(b,u)+'<br><small>Kosten: '+cTxt(u.c)+(level<u.lvl?' · 🔒 ab '+lvlAt(u.lvl).n:'')+'</small>';}
function addUpMark(b){if(b.upMesh)return;const m=UPMARK.clone(),o=b.s/2-.18;m.position.set(o,0,-o);b.mesh.add(m);b.upMesh=m;}
function doUpgrade(b){const u=upgOf(b);if(!u||!buildings.includes(b))return false;
  if(level<u.lvl){toast('🔒 Ausbau ab „'+lvlAt(u.lvl).n+'“');return false;}if(!has(u.c)){toast('Zu wenig Rohstoffe: '+cTxt(u.c));return false;}
  addRes(u.c,-1);
  if(u.to){b.type=u.to;b.mesh.remove(b.body);b.body=TEMPL[u.to].clone();b.mesh.add(b.body);}else{b.up=1;addUpMark(b);}
  popText('⬆',b.x,b.z);toast('⬆ '+DEF[b.type].icon+' '+(u.to?DEF[u.to].name+' fertig!':DEF[b.type].name+' ausgebaut!'));return true;}
function infoBtns(b){const d=DEF[b.type],out=[];
  if(b.done&&d.work){const w=wantOf(b),s=slotsOf(b);out.push({t:'− 👷',dis:w<=0,f:()=>{setWant(b,w-1);openInfo(b);}},{t:'👷 +',dis:w>=s,f:()=>{setWant(b,w+1);openInfo(b);}});}
  const u=upgOf(b);if(u)out.push({t:'⬆ Ausbau',c:'go',dis:!(level>=u.lvl&&has(u.c)),f:()=>{doUpgrade(b);openInfo(b);}});
  out.push({t:'🧨 Abriss',c:'red',f:()=>demolish(b)},{t:'✕',f:closePanel});return out;}
function serializePg(){const b=[];buildings.forEach((o,i)=>{if(o.up||o.wmax!=null)b.push([i,o.up?1:0,o.wmax==null?-1:o.wmax]);});return {b};}
function applyPg(pg,map){if(!pg||!Array.isArray(pg.b))return;for(const e of pg.b){if(!Array.isArray(e))continue;const b=map[e[0]|0];if(!b)continue;
  if(e[1]&&DEF[b.type].work){b.up=1;addUpMark(b);}const w=numOr(e[2],-1);if(w>=0)b.wmax=Math.min(slotsOf(b),w|0);}}
// Zusätzliche Aufgaben (angehängt)
for(const x of[
  {t:'Baue ein Haus zum Fachwerkhaus aus 🏘️',ok:()=>cnt('house_fw')>=1,r:{wood:15}},
  {t:'Baue eine Werkstatt aus ⭐',ok:()=>buildings.some(b=>b.up),r:{planks:8}},
  {t:'Werde ein Marktflecken ⚖️',ok:()=>level>=3,r:{stone:20,planks:10}},
  {t:'Baue eine Kirche ⛪',ok:()=>cnt('church')>=1,r:{wood:20}},
  {t:'Werde eine Stadt 🏙️',ok:()=>level>=4,r:{planks:20,stone:20}},
]){TASKS.push(x);taskDone.push(false);}
// Statistik: Verlauf (alle 5 s Spielzeit, 6 min), Trends, Zufriedenheits-Aufschlüsselung
const HIST=[],HIST_N=72;let histT=-99;
const HAP_LBL={variety:'🍽 Nahrungsvielfalt',well:'⛲ Brunnen',market:'🎪 Markt',deco:'🌷 Deko/schöne Häuser',homeless:'⚠️ Obdachlosigkeit',bread:'🍞 Brot',noFood:'⚠️ Hunger'};
function histSample(){HIST.push({t:simT,r:Object.assign({},res),p:npcs.length,f:foodTotal(),h:hap});if(HIST.length>HIST_N)HIST.shift();}
function histVal(e,k){return k==='food'?e.f:k==='pop'?e.p:k==='hap'?e.h:(e.r[k]||0);}
function rateOf(k){if(HIST.length<2)return 0;const a=HIST[HIST.length-1];let o=HIST[0];for(const e of HIST)if(a.t-e.t<=60){o=e;break;}const dt=a.t-o.t;return dt>=10?(histVal(a,k)-histVal(o,k))*60/dt:0;}
function spark(k,w,h){w=w||64;h=h||16;if(HIST.length<2)return '';const v=HIST.map(e=>histVal(e,k));let mn=Math.min(...v),mx=Math.max(...v);if(mx-mn<1){mx+=.5;mn-=.5;}
  const pts=v.map((y,i)=>(i*w/(HIST_N-1)).toFixed(1)+','+(h-1-(y-mn)/(mx-mn)*(h-2)).toFixed(1)).join(' ');
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" style="vertical-align:middle"><polyline points="'+pts+'" fill="none" stroke="#6b5636" stroke-width="1.5"/></svg>';}
function hapParts(){const neutral=f=>{const o={};for(const k in f)o[k]=typeof f[k]==='boolean'?false:0;return o;};
  const base=happinessOf(neutral(hapF)),cur=happinessOf(hapF),out=[];
  for(const k in hapF){const f=Object.assign({},hapF);f[k]=typeof f[k]==='boolean'?false:0;const c=cur-happinessOf(f);if(c)out.push({k,c});}
  out.sort((a,b)=>Math.abs(b.c)-Math.abs(a.c));return {base,cur,out};}
function rateTxt(r){if(Math.abs(r)<.5)return '<span>±0</span>';return '<span class="'+(r>0?'up':'dn')+'">'+(r>0?'+':'')+Math.round(r)+'</span>';}
function statsText(){
  let cap=0,wk=0,bd=0,idle=0,hl=0;for(const b of buildings)if(b.done&&DEF[b.type].cap)cap+=DEF[b.type].cap;
  for(const n of npcs){if(n.job)wk++;else if(n.site)bd++;else idle++;if(!DEF[n.home.type].cap)hl++;}
  let t='<b>👤 Bevölkerung: '+npcs.length+'</b> '+rateTxt(rateOf('pop'))+'<small>/min</small> '+spark('pop')+'<br><small>Wohnraum '+cap+' · Arbeiter '+wk+' · Bauarbeiter '+bd+' · ohne Arbeit '+idle+(hl?' · ⚠️ obdachlos '+hl:'')+'</small>';
  const hp=hapParts();t+='<hr style="border:0;border-top:1px solid #c9b88f;margin:5px 0"><b>'+hapIcon(hap)+' Zufriedenheit '+Math.round(hap)+' %</b> <small>(Ziel '+Math.round(hapT)+' %)</small> '+spark('hap')+'<br>';
  const bar=(l,c)=>'<div class="hb"><span>'+l+'</span><b class="'+(c>=0?'up':'dn')+'">'+(c>0?'+':'')+c+'</b><i style="width:'+Math.min(140,Math.abs(c)*2.5)+'px;background:'+(c>=0?'#8cc456':'#e58a6e')+'"></i></div>';
  t+=bar('Grundwert',hp.base);for(const p of hp.out)t+=bar(HAP_LBL[p.k]||p.k,p.c);
  if(!hp.out.some(p=>p.k==='well'))t+='<small>💡 Brunnen nahe Häusern bringen viel Zufriedenheit.</small><br>';
  t+='<hr style="border:0;border-top:1px solid #c9b88f;margin:5px 0"><b>📦 Vorräte</b> <small>(Änderung pro Minute)</small><table class="stt">';
  const keys=Object.keys(res).filter(k=>res[k]>0||HIST.some(e=>e.r[k]>0));
  for(const k of keys)t+='<tr><td>'+(RES_ICON[k]||'')+' '+(RES_NAME[k]||k)+'</td><td class="n"><b>'+res[k]+'</b></td><td class="n">'+rateTxt(rateOf(k))+'</td><td>'+spark(k)+'</td></tr>';
  t+='<tr><td>🍽 Nahrung gesamt</td><td class="n"><b>'+foodTotal()+'</b></td><td class="n">'+rateTxt(rateOf('food'))+'</td><td>'+spark('food')+'</td></tr></table>';
  return t;}
function openStats(){closePanel();infoKind='stats';openPanel('📊 Statistik',statsText(),[{t:'📦 Vorräte',f:openStock},{t:'Schließen',f:closePanel}]);}
document.getElementById('bStats').addEventListener('click',()=>{if(infoKind==='stats')closePanel();else openStats();});
// Tutorial (einmalig, abschaltbar, in localStorage)
const TUT_KEY='siedlungTut',tutEl=document.getElementById('tut');
const TUT=[
  {t:'Deine Siedler brauchen Holz. Öffne <b>🪵 Rohstoffe</b> und baue einen <b>Holzfäller 🪓</b> nahe am Wald.',ok:()=>buildings.some(b=>b.type==='cutter'),c:'roh'},
  {t:'Ohne Nahrung kein Zuzug: baue unter <b>🍞 Nahrung</b> einen <b>Beerensammler 🫐</b> bei Beerensträuchern.',ok:()=>buildings.some(b=>b.type==='gather'),c:'nahrung'},
  {t:'Mehr Wohnraum = mehr Bewohner. Baue unter <b>🏠 Wohnen</b> ein weiteres <b>Haus</b>.',ok:()=>buildings.filter(b=>b.type==='house'||DEF[b.type].base==='house').length>=2,c:'wohnen'},
  {t:'Tippe <b>🛤 Weg</b> und ziehe mit einem Finger Wege (1 🪨 pro Feld) – darauf laufen Bewohner doppelt so schnell.',ok:()=>paveList.length>=3,c:'path'},
  {t:'Super! <b>📜</b> zeigt Aufgaben &amp; nächste Stufe, <b>📊</b> die Statistik. Tippe Gebäude an, um Arbeiter (±) zu ändern oder sie auszubauen ⬆.',c:null},
];
let tutI=0,tutShown=-2;try{const v=localStorage.getItem(TUT_KEY);if(v!==null)tutI=numOr(v,0)|0;}catch(e){}
function tutSet(i){tutI=i;try{localStorage.setItem(TUT_KEY,String(i));}catch(e){}tutShown=-2;tutTick();}
function tutTick(){
  while(tutI<TUT.length&&TUT[tutI].ok&&TUT[tutI].ok()){tutI++;try{localStorage.setItem(TUT_KEY,String(tutI));}catch(e){}}
  const st=TUT[tutI],vis=!!st&&panel.style.display!=='block'&&!openCat;
  catBtns.forEach(x=>x.classList.toggle('hint',!!(vis&&st.c&&x.dataset.c===st.c)));
  if(!vis){tutEl.style.display='none';return;}
  if(tutShown!==tutI){tutShown=tutI;tutEl.innerHTML='<div class="tt">💡 '+st.t+' <small>('+(tutI+1)+'/'+TUT.length+')</small></div>';
    const b=document.createElement('button');if(st.ok){b.className='sk';b.textContent='✕';b.addEventListener('click',()=>{tutSet(99);toast('Tipps aus – in ☰ ⚙️ Optionen wieder einschaltbar');});}else{b.textContent='✓ Los';b.addEventListener('click',()=>tutSet(99));}tutEl.appendChild(b);}
  tutEl.style.display='flex';}
// Einstellungen: Grafik, Tempo, Ton (Platzhalter), Tutorial, Spielstand
const CFG_KEY='siedlungCfg';let cfg={q:-1,snd:1};try{Object.assign(cfg,JSON.parse(localStorage.getItem(CFG_KEY)||'{}'));}catch(e){}
let qAuto=!(cfg.q>=0);
function saveCfg(){try{localStorage.setItem(CFG_KEY,JSON.stringify(cfg));}catch(e){}}
function setQuality(q){cfg.q=q;saveCfg();qAuto=q<0;
  sun.shadow.mapSize.set(2048,2048);if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null;}renderer.setPixelRatio(Math.min(DPR,1.75));sun.castShadow=true;
  qLevel=q<0?0:Math.min(3,q|0);applyQuality();resize();}
function setGameSpeed(v){paused=v===0;if(v>0)speed=v;bPause.textContent=paused?'▶️':'⏸';bPause.classList.toggle('on',paused);bSpeed.textContent=speed+'×';bSpeed.classList.toggle('on',speed>1);}
function srow(label,opts){const r=document.createElement('div');r.className='srow';const l=document.createElement('span');l.textContent=label;r.appendChild(l);
  for(const o of opts){const b=document.createElement('button');b.className='chip'+(o.on?' on':'')+(o.c?' '+o.c:'');b.textContent=o.t;b.addEventListener('click',o.f);r.appendChild(b);}ptext.appendChild(r);}
function openSettings(){closePanel();infoKind='settings';openPanel('⚙️ Optionen','<small>Welt-Seed '+W.seed+' · Einstellungen werden auf diesem Gerät gespeichert.</small>',[{t:'Schließen',f:closePanel}]);
  const re=f=>()=>{f();openSettings();};
  srow('Grafik',[['Auto',-1],['Hoch',0],['Mittel',1],['Niedrig',2],['Minimal',3]].map(([t,q])=>({t,on:q<0?qAuto:!qAuto&&qLevel===q,f:re(()=>setQuality(q))})));
  srow('Tempo',[['⏸',0],['1×',1],['2×',2],['3×',3]].map(([t,v])=>({t,on:v===0?paused:!paused&&speed===v,f:re(()=>setGameSpeed(v))})));
  srow('Ton',[{t:'🔊 An',on:!!cfg.snd,f:re(()=>{cfg.snd=1;saveCfg();})},{t:'🔇 Aus',on:!cfg.snd,f:re(()=>{cfg.snd=0;saveCfg();})}]);
  srow('Tipps',[{t:'💡 Tutorial neu starten',f:()=>{tutSet(0);closePanel();}}]);
  srow('Spielstand',[{t:'🗑 Zurücksetzen',c:'red',f:()=>openPanel('🗑 Spielstand zurücksetzen?','Alle Gebäude, Bewohner und Vorräte gehen verloren. Die Insel bleibt gleich.',[{t:'Ja, zurücksetzen',c:'red',f:resetSave},{t:'Abbrechen',f:openSettings}])}]);}
function resetSave(){noSave=true;try{localStorage.setItem('siedlungSeed',String(W.seed));localStorage.removeItem(SAVE_KEY);}catch(e){}try{location.reload();}catch(e){}}
if(cfg.q>=0)setQuality(cfg.q);
// Fortschritts-Tick (aus slowTick)
function pgTick(){
  if(simT-histT>=5||simT<histT){histT=simT;histSample();}
  for(const k in U){if(k!=='food'&&!(k in res))continue;const r=rateOf(k);U[k].dataset.tr=r>=1?'▲':r<=-1?'▼':'';}
  if(infoKind==='stats')ptext.innerHTML=statsText();
  tutTick();}

// ================= Start: Spielstand laden oder neue Siedlung =================
let loadedSave=false;
if(saveData){try{applySave(saveData);loadedSave=true;}catch(e){console.warn('Spielstand defekt – neues Spiel',e);try{resetGame();}catch(e2){console.warn(e2);}}}
if(!loadedSave)startNew();
lastSeason=season();wasNight=(tod>0.68||tod<0.02);
target.set(store0.x,heightAt(store0.x,store0.z),store0.z);
computeHap();hap=loadedSave?hap:hapT;applySeasonTint();slowTick();updateSky();
requestAnimationFrame(loop);
toast(loadedSave?'💾 Spielstand geladen – willkommen zurück!':'Willkommen! Baue Holzfäller 🪓 und Beerensammler 🫐 (📜 Aufgaben)');
</script>
