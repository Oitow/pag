<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Testwelt</title>
<meta name="description" content="Begehbare 3D-Testwelt aus dem PAG-Baukasten: Weltgenerator + Figurensystem zum Ausprobieren.">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
<style>
  :root { --panel: rgba(18,22,28,.82); --text: #eef1f4; --dim: #a6b0ba; --akzent: #6fb3ff; --rand: rgba(255,255,255,.12); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fb8d8; color: var(--text); font: 14px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .panel { background: var(--panel); border: 1px solid var(--rand); border-radius: 10px; backdrop-filter: blur(4px); }
  #oben { position: fixed; top: max(8px, env(safe-area-inset-top)); left: 8px; right: 8px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding: 6px; pointer-events: auto; }
  #oben a { color: var(--dim); text-decoration: none; padding: 0 4px; }
  select, input, button { font: inherit; color: var(--text); background: #11151a; border: 1px solid var(--rand); border-radius: 8px; padding: 6px 8px; min-height: 36px; }
  input[type=number] { width: 92px; }
  button { cursor: pointer; background: #2a3a4f; border-color: #3b5372; }
  button:active { transform: translateY(1px); }
  #info { position: fixed; left: 8px; bottom: max(8px, env(safe-area-inset-bottom)); padding: 6px 9px; font-size: 12px; color: var(--dim); pointer-events: none; max-width: 60vw; }
  #info b { color: var(--text); font-weight: 600; }
  #karte { position: fixed; right: 8px; top: 64px; width: 140px; height: 140px; border-radius: 10px; border: 1px solid var(--rand); cursor: crosshair; image-rendering: pixelated; }
  #lade { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(10,14,20,.55); font-size: 1.1rem; z-index: 5; }
  #lade[hidden] { display: none; }
  #fehler { position: fixed; left: 8px; right: 8px; top: 120px; padding: 10px; background: #5a1f1f; border-radius: 8px; white-space: pre-wrap; font: 12px monospace; z-index: 6; }
  #fehler[hidden] { display: none; }
  .knopf { position: fixed; width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; background: rgba(20,26,34,.55); border: 2px solid rgba(255,255,255,.25); z-index: 3; }
  #stick { position: fixed; width: 112px; height: 112px; border-radius: 50%; border: 2px solid rgba(255,255,255,.3); background: rgba(20,26,34,.25); pointer-events: none; z-index: 3; }
  #stick i { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px; border-radius: 50%; background: rgba(255,255,255,.45); }
  #zeitLeiste { display: inline-flex; align-items: center; gap: 6px; }
  #zeitText { min-width: 3.2em; font-variant-numeric: tabular-nums; color: var(--dim); }
  #zeit { width: 140px; min-height: 48px; padding: 0; accent-color: var(--akzent); }
  button.gross { min-width: 48px; min-height: 48px; font-size: 20px; }
  .nurTouch { display: none; }
  body.touch .nurTouch { display: grid; }
  body.touch #stick[hidden] { display: none; }
  @media (max-width: 600px) { #karte { width: 104px; height: 104px; top: 108px; } #oben { font-size: 13px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="oben" class="panel">
  <a id="back" href="../../">← Spiele</a>
  <select id="preset" aria-label="Preset"></select>
  <input id="seed" type="number" aria-label="Seed" min="0" step="1">
  <button id="wuerfel" title="Neuer Seed">🎲</button>
  <select id="groesse" aria-label="Größe"><option value="128">128</option><option value="256" selected>256</option></select>
  <button id="erzeuge">Erzeugen</button>
  <button id="zumStart" title="Zum Startplatz">🚩</button>
  <button id="zumDorf" title="Zum nächsten Dorf">🏘</button>
  <button id="zumGipfel" title="Zum nächsten Gipfel">▲</button>
  <span id="zeitLeiste"><label for="zeit" id="zeitText">10:00</label><input id="zeit" type="range" min="0" max="24" step="0.05" value="10" aria-label="Tageszeit"><button id="zeitLauf" class="gross" title="Zeit anhalten/weiterlaufen lassen">⏸</button><button id="wetter" class="gross" title="Wetter: klar, Regen, Sturm">☀</button></span>
</div>
<canvas id="karte" width="128" height="128" title="Karte – antippen zum Hinspringen"></canvas>
<div id="info" class="panel">…</div>
<div id="stick" class="nurTouch" hidden><i></i></div>
<div id="springen" class="knopf nurTouch" style="right:20px;bottom:calc(28px + env(safe-area-inset-bottom))">⤒</div>
<div id="sprint" class="knopf nurTouch" style="right:96px;bottom:calc(20px + env(safe-area-inset-bottom));width:54px;height:54px;font-size:20px">»</div>
<div id="lade">Erzeuge Welt …</div>
<div id="fehler" hidden></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
