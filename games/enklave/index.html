<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Die Enklave</title>
<meta name="description" content="Die Enklave: Tutorial-Tal, Weg und ummauerte Stadt – Erste Schritte, Kampf, Zauber und Großzauber im PAG-Baukasten.">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fb8d8; color: #eef1f4; font: 14px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #oben { position: fixed; top: max(8px, env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right)); display: flex; gap: 6px; align-items: center; z-index: 4; }
  #oben a, #oben button { color: #eef1f4; text-decoration: none; background: rgba(18,22,28,.82); border: 1px solid rgba(255,255,255,.14); border-radius: 10px; padding: 6px 10px; min-height: 40px; min-width: 40px; font: inherit; display: grid; place-items: center; cursor: pointer; }
  #info { position: fixed; left: 8px; bottom: max(6px, env(safe-area-inset-bottom)); padding: 3px 8px; font-size: 11px; color: #c8d2dc; background: rgba(18,22,28,.55); border-radius: 8px; pointer-events: none; z-index: 2; }
  #lade { position: fixed; inset: 0; display: grid; place-items: center; background: #1a2230; font-size: 1.15rem; z-index: 30; text-align: center; }
  #lade small { display: block; opacity: .65; margin-top: 6px; font-size: .8rem; }
  #lade[hidden] { display: none; }
  #fehler { position: fixed; left: 8px; right: 8px; top: 120px; padding: 10px; background: #5a1f1f; border-radius: 8px; white-space: pre-wrap; font: 12px monospace; z-index: 40; }
  #fehler[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="oben"><a id="back" href="../../">← Spiele</a><button id="menueKnopf" title="Menü (Esc)">☰</button></div>
<div id="info"></div>
<div id="lade">🏰 Die Enklave wird erschaffen …<small>Tal, Weg und Stadt entstehen aus einem festen Plan</small></div>
<div id="fehler" hidden></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
