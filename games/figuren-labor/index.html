<!DOCTYPE html>

<style>

  #info { position: fixed; left: 10px; bottom: 10px; z-index: 4; font: 12px/1.4 monospace; background: #0008; color: #e8f0e0; padding: 6px 8px; border-radius: 8px; pointer-events: none; white-space: pre; }

  /* Menü-Blatt: am Handy von unten, am großen Bildschirm von links */

<body>
<a id="back" href="../../">← Spiele</a>
<div id="kopf">
  <button id="bStopp" title="Laufende Aktion beenden" style="display:none">⏹</button>
  <button id="bMenue" title="Aussehen, Zauber, Ausrüstung, Aktionen, Einstellungen">☰ Menü</button>
</div>
<div id="hud"><div class="balken leben"><u></u><i></i></div><div class="balken mana"><i></i></div></div>
<div id="zleiste"></div>
<button id="bZaubern">✨ Zaubern (R)</button>
<div id="meldung"></div>
<div id="blatt">
  <div class="blatt-kopf">
    <div class="tabs">
      <button data-tab="aussehen" class="an">👕 Aussehen</button>
      <button data-tab="zauber">✨ Zauber</button>
      <button data-tab="ausruestung">🗡 Ausrüstung</button>
      <button data-tab="aktionen">🎬 Aktionen</button>
      <button data-tab="mehr">⚙️ Mehr</button>
    </div>
    <button id="bZu" aria-label="Menü schließen">✕</button>
  </div>
  <div class="blatt-inhalt">
    <section data-tab="aussehen" class="an"></section>
    <section data-tab="zauber">
      <h3>Zauber wählen – in der Leiste oben nochmal tippen oder ✨ drücken zum Wirken</h3>
      <div id="zliste"></div>
    </section>
    <section data-tab="ausruestung">
      <h3>In die Hand nehmen (Schild und Buch links, der Rest rechts)</h3>
      <div class="chips" id="ausr"></div>
    </section>
    <section data-tab="aktionen"><div class="aktionen" id="aktionen"></div></section>
    <section data-tab="mehr">
      <h3>Kamera</h3>
      <div class="chips" id="kameras"></div>
      <div class="chips" style="margin-top:6px">
        <button data-schalter="ichsicht">👁 Ich-Sicht</button>
        <button data-knopf="fahrt">🎞 Kamerafahrt</button>
      </div>
      <h3>Welt</h3>
      <div class="chips">
        <button data-schalter="npcs" class="an">🧑‍🤝‍🧑 NPCs</button>
        <button data-schalter="schilder" class="an">🏷 Namensschilder</button>
        <button data-schalter="info">ℹ️ Debug-Anzeige</button>
      </div>
      <h3>Zauber-Labor</h3>
      <div class="chips">
        <button data-schalter="freimana">♾ Unendlich Mana</button>
        <button data-knopf="treffen">💥 Mich treffen (−25)</button>
        <button data-knopf="heilen">❤ Alle heilen</button>
      </div>
    </section>
  </div>
</div>
<pre id="info"></pre>
<div class="hilfe" id="hilfe">Stick/WASD laufen · Zauber oben wählen, ✨ / R wirken (1–0 = sofort) · ☰ Menü: Aussehen, Ausrüstung, Aktionen</div>
