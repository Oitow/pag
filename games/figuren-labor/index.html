<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Figuren-Labor</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9ec8e8; font-family: system-ui, sans-serif; color: #2a2218; -webkit-user-select: none; user-select: none; }
  canvas { display: block; position: fixed; inset: 0; touch-action: none; }
  #back { position: fixed; left: 10px; top: 10px; z-index: 5; color: #fff; text-decoration: none; background: #0006; padding: 6px 10px; border-radius: 8px; font-size: 14px; }
  .leiste { position: fixed; right: 10px; top: 10px; z-index: 5; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: 70vw; }
  .leiste button, .aktionen button { font: inherit; font-size: 14px; border: 0; border-radius: 10px; padding: 7px 10px; background: #fffc; color: #2a2218; box-shadow: 0 2px 6px #0003; cursor: pointer; }
  .leiste button.an { background: #ffd870; }
  .aktionen { position: fixed; left: 50%; top: 10px; transform: translateX(-50%); z-index: 5; display: none; gap: 5px; flex-wrap: wrap; justify-content: center; max-width: 60vw; }
  .aktionen.offen { display: flex; }
  #info { position: fixed; left: 10px; bottom: 10px; z-index: 4; font: 12px/1.4 monospace; background: #0008; color: #e8f0e0; padding: 6px 8px; border-radius: 8px; pointer-events: none; white-space: pre; }
  .hilfe { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 4; background: #0008; color: #fff; padding: 6px 12px; border-radius: 10px; font-size: 13px; pointer-events: none; transition: opacity 1s; text-align: center; }
  /* Editor */
  .ed { position: fixed; left: 0; top: 0; bottom: 0; width: min(360px, 92vw); z-index: 6; background: #fbf6eaf2; box-shadow: 4px 0 18px #0004; transform: translateX(-105%); transition: transform .25s; overflow-y: auto; padding: 12px; box-sizing: border-box; -webkit-user-select: auto; user-select: auto; }
  .ed.offen { transform: none; }
  .ed-kopf { display: flex; gap: 8px; align-items: center; margin: 34px 0 8px; }
  .ed-name { flex: 1; font: inherit; padding: 5px 8px; border: 1px solid #c8b890; border-radius: 8px; background: #fff; }
  .ed-reihe { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
  .ed-reihe button { font: inherit; font-size: 13px; border: 1px solid #c8b890; background: #fff; border-radius: 8px; padding: 5px 8px; cursor: pointer; }
  .ed-gitter { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; font-size: 13px; }
  .ed-gitter label { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .ed-gitter .ed-weit { grid-column: 1 / -1; }
  .ed-gitter select { font: inherit; max-width: 110px; }
  .ed-gitter input[type=color] { width: 40px; height: 26px; border: 0; padding: 0; background: none; }
  .ed-gitter input[type=range] { flex: 1; }
</style>
</head>
<body>
<a id="back" href="../../">← Spiele</a>
<div class="leiste">
  <button id="bEditor">👕 Aussehen</button>
  <button id="bAktionen">🎬 Aktionen</button>
  <button id="bNpc">🧑‍🤝‍🧑 NPCs</button>
  <button id="bInfo">ℹ️</button>
</div>
<div class="aktionen" id="aktionen"></div>
<pre id="info"></pre>
<div class="hilfe" id="hilfe">WASD/Stick laufen · Shift Sprint · Leertaste springen · C ducken · Ziehen = Kamera · F Schlag · G winken</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
