<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Natur-Labor</title>
<meta name="description" content="Betrachter für die prozeduralen Natur-Assets des PAG-Baukastens: Bäume, Felsen, Büsche, Bodendecker – Seed, Detail, Jahreszeit, Wind.">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
<style>
  :root { --panel: rgba(18,22,28,.82); --text: #eef1f4; --dim: #a6b0ba; --rand: rgba(255,255,255,.12); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9cc4e4; color: var(--text); font: 14px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .panel { background: var(--panel); border: 1px solid var(--rand); border-radius: 10px; backdrop-filter: blur(4px); }
  #oben { position: fixed; top: max(8px, env(safe-area-inset-top)); left: 8px; right: 8px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding: 6px; }
  #oben a { color: var(--dim); text-decoration: none; padding: 0 4px; }
  select, input, button { font: inherit; color: var(--text); background: #11151a; border: 1px solid var(--rand); border-radius: 8px; padding: 6px 8px; min-height: 36px; }
  input[type=number] { width: 84px; }
  button { cursor: pointer; background: #2a3a4f; border-color: #3b5372; }
  button.an { background: #2f6a45; border-color: #4c9a66; }
  button:active { transform: translateY(1px); }
  #info { position: fixed; left: 8px; bottom: max(8px, env(safe-area-inset-bottom)); padding: 6px 9px; font-size: 12px; color: var(--dim); pointer-events: none; max-width: calc(100vw - 16px); }
  #info b { color: var(--text); font-weight: 600; }
  #fehler { position: fixed; left: 8px; right: 8px; top: 120px; padding: 10px; background: #5a1f1f; border-radius: 8px; white-space: pre-wrap; font: 12px monospace; z-index: 6; }
  #fehler[hidden] { display: none; }
  @media (max-width: 600px) { #oben { font-size: 13px; gap: 4px; } select, input, button { padding: 5px 6px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="oben" class="panel">
  <a id="back" href="../../">← Spiele</a>
  <button id="ansicht" title="Ein Asset oder alle im Raster">▦ Alle</button>
  <select id="typ" aria-label="Typ"></select>
  <input id="seed" type="number" aria-label="Seed" min="0" step="1" value="1">
  <button id="wuerfel" title="Neuer Seed">🎲</button>
  <select id="detail" aria-label="Detail"><option value="0">Detail 0</option><option value="1" selected>Detail 1</option><option value="2">Detail 2</option></select>
  <select id="zeit" aria-label="Jahreszeit"><option value="sommer">☀️ Sommer</option><option value="herbst">🍂 Herbst</option><option value="winter">❄️ Winter</option></select>
  <button id="wind" class="an" title="Wind an/aus">🌬 Wind</button>
</div>
<div id="info" class="panel">…</div>
<div id="fehler" hidden></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
