<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Viniland – Testlab</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1016; font-family: system-ui, sans-serif; color: #f4ecd8; }
  #c { display: block; image-rendering: pixelated; image-rendering: crisp-edges; position: fixed; inset: 0; }
  .view { position: fixed; overflow: hidden; pointer-events: none; }
  .hud { position: absolute; left: 10px; top: 10px; padding: 6px 10px; background: #1a140ecc; border: 2px solid #6b4f2e; border-radius: 8px; font-size: 14px; pointer-events: none; text-shadow: 1px 1px 0 #000; }
  .bars { position: absolute; left: 10px; top: 46px; width: min(220px, 40%); }
  .bar { position: relative; height: 11px; margin: 0 0 4px; background: #1a140ecc; border: 2px solid #6b4f2e; border-radius: 6px; overflow: hidden; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; transition: width .12s; }
  .bar.hp { height: 15px; } .bar.hp i { background: linear-gradient(#ff7a6a, #c8302a); }
  .bar.hp span { position: absolute; right: 5px; top: -1px; font: bold 11px monospace; text-shadow: 1px 1px 0 #000; }
  .bar.sta i { background: linear-gradient(#ffe07a, #d8a02a); } .bar.sta.ex i { background: #8a6a3a; }
  .bar.mana i { background: linear-gradient(#8ac8ff, #3a6ad8); }
  .spells { position: absolute; left: 10px; top: 96px; display: flex; gap: 6px; }
  .sp { position: relative; width: 38px; height: 38px; border: 2px solid #6b4f2e; border-radius: 8px; background: #1a140ecc; overflow: hidden; text-align: center; font-size: 19px; line-height: 36px; }
  .sp b { position: absolute; left: 2px; bottom: -11px; font: bold 10px monospace; color: #f0c27a; }
  .sp i { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: #000b; }
  .sp.nomana { filter: grayscale(1) brightness(.7); }
  .lockm { position: absolute; left: -14px; top: -14px; width: 24px; height: 24px; border: 3px solid #ffdf70; border-radius: 50%; box-shadow: 0 0 0 2px #000a, inset 0 0 0 2px #000a; }
  .lockm::after { content: ''; position: absolute; left: 8px; top: 8px; width: 8px; height: 8px; background: #ffdf70; border-radius: 50%; }
  .bossbar { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); width: min(560px, 80%); text-shadow: 1px 1px 0 #000; }
  .bossbar .bn { font-size: 15px; margin-bottom: 3px; } .bossbar small { opacity: .75; } .bossbar em { font-style: normal; color: #ff9a6a; font-size: 12px; }
  .bossbar .bbar { position: relative; height: 12px; background: #1a140ee6; border: 2px solid #8a6a3e; border-radius: 4px; overflow: hidden; }
  .bossbar .bbar u { position: absolute; left: 0; top: 0; bottom: 0; background: #f0d8a0; }
  .bossbar .bbar i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(#e04a3a, #8a1a14); }
  .bossbar .stg { height: 4px; margin-top: 2px; background: #0008; border-radius: 2px; overflow: hidden; } .bossbar .stg i { display: block; height: 100%; width: 0; background: #ffd870; }
  .flash { position: absolute; inset: 0; opacity: 0; box-shadow: inset 0 0 70px 18px #ff1a10; }
  .deadmsg { position: absolute; left: 0; right: 0; top: 42%; text-align: center; font-size: 26px; color: #ffd0b0; text-shadow: 2px 2px 0 #000; }
  .divider { position: fixed; background: #1a140e; pointer-events: none; }
  #divV { top: 0; bottom: 0; left: calc(50% - 2px); width: 4px; }
  #divH { left: 0; right: 0; top: calc(50% - 2px); height: 4px; display: none; }
  body.hsplit #divV { display: none; } body.hsplit #divH { display: block; }
  body.solo .divider { display: none !important; }
  #fps { position: fixed; right: 10px; top: 10px; font: 12px monospace; background: #000a; padding: 4px 8px; border-radius: 6px; pointer-events: none; }
  #help { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); max-width: 92vw; font-size: 13px; line-height: 1.5; background: #1a140ee6; border: 2px solid #6b4f2e; border-radius: 10px; padding: 8px 14px; transition: opacity 1.5s; pointer-events: none; }
  #help.fade { opacity: 0; }
  #err { display: none; position: fixed; left: 10px; bottom: 10px; right: 10px; white-space: pre-wrap; font: 12px monospace; color: #ffb4a8; background: #300c; padding: 8px; z-index: 9; }
  #menu { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100vw); overflow-y: auto; background: #1b1610f2; border-left: 3px solid #6b4f2e; padding: 12px 16px; box-sizing: border-box; transform: translateX(105%); transition: transform .2s; z-index: 5; }
  #menu.open { transform: none; }
  #menu .mhead { display: flex; justify-content: space-between; align-items: center; font-size: 18px; margin-bottom: 8px; }
  #menu button { background: #3a2c1c; color: #f4ecd8; border: 1px solid #8a6a3e; border-radius: 6px; padding: 6px 9px; margin: 3px 2px; font-size: 13px; cursor: pointer; }
  #menu button:hover { background: #57412a; }
  #menu h3 { margin: 14px 0 6px; font-size: 14px; color: #f0c27a; border-bottom: 1px solid #4b3a24; }
  #menu label { display: grid; grid-template-columns: 130px 1fr 46px; gap: 6px; align-items: center; font-size: 12.5px; margin: 3px 0; }
  #menu input[type=range] { width: 100%; accent-color: #e0a050; }
  #menu em { font-style: normal; font-family: monospace; text-align: right; opacity: .8; }
  #menu .pads { font-size: 12px; background: #0006; border-radius: 6px; padding: 6px 8px; margin: 4px 0; line-height: 1.5; }
  #menu .hint { font-size: 12px; opacity: .7; }
  .view .hud, .view .bars, .view .spells { zoom: var(--hud, 1); }
  .bossbar .bn { font-family: 'Cinzel','Trajan Pro','Palatino Linotype',Georgia,serif; letter-spacing: .08em; }
  #menu .mtabs { display: flex; gap: 2px; margin: 4px 0 8px; border-bottom: 1px solid #8a6a3e; }
  #menu .mtabs button { border-radius: 6px 6px 0 0; margin: 0; border-bottom: none; background: #241b12; }
  #menu .mtabs button.on { background: #57412a; color: #ffe2a0; }
  #menu label.opt button { justify-self: start; min-width: 90px; }
  #back { position: fixed; right: 10px; bottom: 10px; color: #f4ecd8; font-size: 12px; opacity: .55; text-decoration: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="divider" id="divV"></div><div class="divider" id="divH"></div>
<div class="view" id="view0"><div class="hud" id="hud0"></div>
  <div class="bars"><div class="bar hp"><i></i><span></span></div><div class="bar sta"><i></i></div><div class="bar mana"><i></i></div></div>
  <div class="spells"><div class="sp s1"><span>·</span><b>1</b><i></i></div><div class="sp s2"><span>·</span><b>2</b><i></i></div></div>
  <div class="lockm" style="display:none"></div>
  <div class="bossbar" style="display:none"><div class="bn"></div><div class="bbar"><u></u><i></i></div><div class="stg"><i></i></div></div>
  <div class="flash"></div><div class="deadmsg" style="display:none"></div></div>
<div class="view" id="view1"><div class="hud" id="hud1"></div>
  <div class="bars"><div class="bar hp"><i></i><span></span></div><div class="bar sta"><i></i></div><div class="bar mana"><i></i></div></div>
  <div class="spells"><div class="sp s1"><span>·</span><b>7</b><i></i></div><div class="sp s2"><span>·</span><b>8</b><i></i></div></div>
  <div class="lockm" style="display:none"></div>
  <div class="bossbar" style="display:none"><div class="bn"></div><div class="bbar"><u></u><i></i></div><div class="stg"><i></i></div></div>
  <div class="flash"></div><div class="deadmsg" style="display:none"></div></div>
<div id="fps"></div>
<div id="help"></div>
<div id="menu"></div>
<div id="err"></div>
<a id="back" href="../../">← Spiele</a>
<script>
  addEventListener('error', e => { const el = document.getElementById('err'); el.style.display = 'block'; el.textContent += (e.message || e) + '\n'; });
  addEventListener('unhandledrejection', e => { const el = document.getElementById('err'); el.style.display = 'block'; el.textContent += 'Promise: ' + (e.reason?.message || e.reason) + '\n'; });
</script>
<script>
  if (location.protocol === 'file:' && document.querySelector('script[src="js/main.js"]')) {
    const el = document.getElementById('err'); el.style.display = 'block'; el.style.fontSize = '16px';
    el.textContent = 'Per Doppelklick blockiert der Browser die js/-Dateien. Öffne stattdessen viniland.html (gleicher Ordner) – die läuft auch so.';
  }
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
