<script type="module">
import * as THREE from 'three';
// ===== psx.js =====
const __m_psx = (() => {
// PSX/PS2-Look: Vertex-Snapping, Farb-Quantisierung mit Bayer-Dithering, Lambert-Flat-Shading.
// Jedes Modul nutzt psxMat() für seine Materialien, damit der Look global steuerbar ist.

const PSX = {
  uniforms: {
    uSnap: { value: 220.0 },     // Raster der Vertex-Snapping (kleiner = wackeliger). 0 = aus
    uDither: { value: 1.0 },     // 1 = Dithering + Farbtiefe 5 Bit, 0 = aus
    uTime: { value: 0.0 },
  },
};

function setPSX({ snap, dither } = {}) {
  if (snap !== undefined) PSX.uniforms.uSnap.value = snap;
  if (dither !== undefined) PSX.uniforms.uDither.value = dither ? 1 : 0;
}

const SNAP_VERT = /* glsl */`
  #include <project_vertex>
  if (uSnap > 0.0) {
    vec4 snapPos = gl_Position;
    snapPos.xyz /= snapPos.w;
    snapPos.xy = floor(snapPos.xy * uSnap + 0.5) / uSnap;
    snapPos.xyz *= snapPos.w;
    gl_Position = snapPos;
  }
`;

const DITHER_FRAG = /* glsl */`
  #include <dithering_fragment>
  if (uDither > 0.5) {
    int bx = int(mod(gl_FragCoord.x, 4.0));
    int by = int(mod(gl_FragCoord.y, 4.0));
    float bayer[16] = float[16](0.,8.,2.,10.,12.,4.,14.,6.,3.,11.,1.,9.,15.,7.,13.,5.);
    float d = (bayer[by * 4 + bx] / 16.0 - 0.5) / 31.0;
    gl_FragColor.rgb = floor((gl_FragColor.rgb + d) * 31.0 + 0.5) / 31.0;
  }
`;

/** Patcht ein beliebiges three.js-Material mit dem PSX-Look. Gibt das Material zurück. */
function patchPSX(material) {
  const prev = material.onBeforeCompile;
  material.onBeforeCompile = (shader, renderer) => {
    if (prev) prev(shader, renderer);
    shader.uniforms.uSnap = PSX.uniforms.uSnap;
    shader.uniforms.uDither = PSX.uniforms.uDither;
    shader.uniforms.uTime = PSX.uniforms.uTime;
    shader.vertexShader = 'uniform float uSnap;\nuniform float uTime;\n' +
      shader.vertexShader.replace('#include <project_vertex>', SNAP_VERT);
    shader.fragmentShader = 'uniform float uDither;\n' +
      shader.fragmentShader.replace('#include <dithering_fragment>', DITHER_FRAG);
  };
  material.customProgramCacheKey = () => 'psx-' + (material.userData.psxKey || '');
  return material;
}

const cache = new Map();
/**
 * Standard-Material für alles. opts wie MeshLambertMaterial.
 * Ohne opts: geteiltes Vertex-Color-Flat-Material (empfohlen, spart Draw-State).
 */
function psxMat(opts = {}) {
  const o = { vertexColors: true, flatShading: true, ...opts };
  const key = JSON.stringify(o, (k, v) => (v && v.isColor ? v.getHex() : (v && v.isTexture ? v.uuid : v)));
  if (!opts.noCache && cache.has(key)) return cache.get(key);
  delete o.noCache;
  const m = patchPSX(new THREE.MeshLambertMaterial(o));
  cache.set(key, m);
  return m;
}

return { PSX, setPSX, patchPSX, psxMat };
})();

// ===== kit.js =====
const __m_kit = (() => {
// Mesh-Baukasten: Low/Mid-Poly-Primitive mit Vertex-Farben, die zu EINER Geometrie verschmolzen werden.
// Beispiel:
//   const b = new MeshBuilder();
//   b.box(0.6, 0.4, 1.0, 0xd9772b, { y: 0.5 });
//   b.sphere(0.25, 0xffffff, { y: 0.8, z: 0.5, sy: 0.8 }, 6, 4);
//   const mesh = b.mesh(); // THREE.Mesh mit psxMat()
const { psxMat } = __m_psx;

const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(),
  _p = new THREE.Vector3(), _s = new THREE.Vector3(), _c = new THREE.Color();

/** t = { x,y,z, rx,ry,rz (Radiant), s (uniform), sx,sy,sz, jitter (Farbvariation 0..1) } */
function tMatrix(t = {}) {
  _p.set(t.x || 0, t.y || 0, t.z || 0);
  _e.set(t.rx || 0, t.ry || 0, t.rz || 0);
  _q.setFromEuler(_e);
  const s = t.s ?? 1;
  _s.set((t.sx ?? 1) * s, (t.sy ?? 1) * s, (t.sz ?? 1) * s);
  return _m.compose(_p, _q, _s).clone();
}

class MeshBuilder {
  constructor() { this.parts = []; }

  /** Fügt beliebige BufferGeometry mit Farbe und Transform hinzu. */
  add(geo, color, t = {}) {
    let g = geo.index ? geo.toNonIndexed() : geo.clone();
    g.applyMatrix4(tMatrix(t));
    const n = g.attributes.position.count;
    const col = new Float32Array(n * 3);
    _c.set(color);
    const jit = t.jitter ?? 0.06;
    // Pro Dreieck leicht variierende Farbe => handgemachter PS1-Look
    for (let i = 0; i < n; i += 3) {
      const k = 1 + (Math.random() - 0.5) * jit * 2;
      for (let j = 0; j < 3 && i + j < n; j++) {
        col[(i + j) * 3] = Math.min(1, _c.r * k);
        col[(i + j) * 3 + 1] = Math.min(1, _c.g * k);
        col[(i + j) * 3 + 2] = Math.min(1, _c.b * k);
      }
    }
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    for (const name of Object.keys(g.attributes)) if (!['position', 'normal', 'color'].includes(name)) g.deleteAttribute(name);
    this.parts.push(g);
    return this;
  }
  box(w, h, d, color, t) { return this.add(new THREE.BoxGeometry(w, h, d), color, t); }
  sphere(r, color, t, ws = 7, hs = 5) { return this.add(new THREE.SphereGeometry(r, ws, hs), color, t); }
  cyl(rTop, rBot, h, color, t, seg = 7) { return this.add(new THREE.CylinderGeometry(rTop, rBot, h, seg), color, t); }
  cone(r, h, color, t, seg = 7) { return this.add(new THREE.ConeGeometry(r, h, seg), color, t); }
  ico(r, color, t, detail = 0) { return this.add(new THREE.IcosahedronGeometry(r, detail), color, t); }
  capsule(r, len, color, t, cap = 3, seg = 7) { return this.add(new THREE.CapsuleGeometry(r, len, cap, seg), color, t); }

  geometry() {
    let total = 0;
    for (const g of this.parts) total += g.attributes.position.count;
    const pos = new Float32Array(total * 3), col = new Float32Array(total * 3);
    let o = 0;
    for (const g of this.parts) {
      pos.set(g.attributes.position.array, o * 3);
      col.set(g.attributes.color.array, o * 3);
      o += g.attributes.position.count;
    }
    const out = new THREE.BufferGeometry();
    out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    out.setAttribute('color', new THREE.BufferAttribute(col, 3));
    out.computeVertexNormals();
    out.computeBoundingSphere();
    return out;
  }
  mesh(material = psxMat()) {
    const m = new THREE.Mesh(this.geometry(), material);
    m.castShadow = true; m.receiveShadow = true;
    return m;
  }
}

/** Seeded RNG (mulberry32) */
function rng(seed = 1) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** 2D Value-Noise + fbm, seeded */
function makeNoise(seed = 1) {
  const r = rng(seed), P = new Uint8Array(512), G = new Float32Array(256);
  for (let i = 0; i < 256; i++) { P[i] = i; G[i] = r() * 2 - 1; }
  for (let i = 255; i > 0; i--) { const j = (r() * (i + 1)) | 0; [P[i], P[j]] = [P[j], P[i]]; }
  for (let i = 0; i < 256; i++) P[i + 256] = P[i];
  const fade = t => t * t * (3 - 2 * t);
  const v = (x, y) => G[P[P[x & 255] + (y & 255)]];
  function noise(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = fade(xf), w = fade(yf);
    const a = v(xi, yi), b = v(xi + 1, yi), c = v(xi, yi + 1), d = v(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * w + (a - b - c + d) * u * w;
  }
  function fbm(x, y, oct = 4) {
    let s = 0, amp = 0.5, f = 1;
    for (let i = 0; i < oct; i++) { s += noise(x * f, y * f) * amp; f *= 2; amp *= 0.5; }
    return s;
  }
  return { noise, fbm };
}

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, lambda, dt) => lerp(a, b, 1 - Math.exp(-lambda * dt));

return { tMatrix, MeshBuilder, rng, makeNoise, clamp, lerp, damp };
})();

// ===== world.js =====
const __m_world = (() => {
// Viniland – Welt: Insel-Terrain, Wasser, Himmel, Licht, Bäume (fällbar), Logs mit leichter Eigenphysik, Deko.
// API siehe CONTRACT.md (createWorld).
const { psxMat, patchPSX } = __m_psx;
const { MeshBuilder, rng, makeNoise, clamp, lerp } = __m_kit;

const G = 9.81;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

// Temporäre Objekte (keine Allokationen im Loop)
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _q2 = new THREE.Quaternion(), _e = new THREE.Euler(0, 0, 0, 'YXZ'),
  _v = new THREE.Vector3(), _s = new THREE.Vector3(), _ax = new THREE.Vector3(), _c = new THREE.Color();
const ZERO_M = new THREE.Matrix4().makeScale(0, 0, 0);
const UP = new THREE.Vector3(0, 1, 0);

// Baumarten (unskaliert, Meter)
const TREE_TYPES = [
  { id: 'pine', H: 9.2, rB: 0.30, rT: 0.09, stump: 0.42, crownC: 6.0, crownR: 2.2, top: 10.6, lc: 0.50, hp: [4, 5],
    bark: 0x7a5232, leaves: [0x2f6b3a, 0x3d7d44, 0x285f33] },
  { id: 'oak', H: 5.0, rB: 0.42, rT: 0.27, stump: 0.42, crownC: 6.4, crownR: 2.8, top: 9.0, lc: 0.66, hp: [4, 5],
    bark: 0x5e4430, leaves: [0x5c9e3c, 0x74b247, 0x4e8c35] },
  { id: 'birch', H: 8.4, rB: 0.20, rT: 0.08, stump: 0.40, crownC: 6.7, crownR: 1.7, top: 9.4, lc: 0.55, hp: [3, 4],
    bark: 0xe6e1d3, leaves: [0xa3cf4f, 0xbcd95c, 0x8cbf45] },
];

function mergeGeos(geos) {
  let n = 0; for (const g of geos) n += g.attributes.position.count;
  const pos = new Float32Array(n * 3), col = new Float32Array(n * 3); let o = 0;
  for (const g of geos) { pos.set(g.attributes.position.array, o * 3); col.set(g.attributes.color.array, o * 3); o += g.attributes.position.count; }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('color', new THREE.BufferAttribute(col, 3));
  out.computeVertexNormals(); out.computeBoundingSphere();
  return out;
}

function buildTreeGeos(T, r) {
  const st = new MeshBuilder(), tr = new MeshBuilder(), cr = new MeshBuilder();
  const rAt = y => lerp(T.rB, T.rT, y / T.H);
  st.cyl(rAt(T.stump), T.rB * 1.08, T.stump, T.bark, { y: T.stump / 2 }, 8);
  st.cyl(rAt(T.stump) * 0.85, rAt(T.stump) * 0.85, 0.02, 0xe8c48a, { y: T.stump + 0.005 }, 8);
  tr.cyl(T.rT, rAt(T.stump), T.H - T.stump, T.bark, { y: T.stump + (T.H - T.stump) / 2 }, 8);
  if (T.id === 'pine') {
    const lay = [[2.6, 2.2, 3.2], [4.3, 1.85, 3.0], [5.9, 1.45, 2.7], [7.5, 1.05, 2.4], [8.9, 0.6, 1.8]];
    lay.forEach(([y, rr, h], i) => cr.cone(rr, h, T.leaves[i % 3], { y: y + h / 2, ry: r() * 3, jitter: 0.1 }, 8));
  } else if (T.id === 'oak') {
    tr.cyl(0.09, 0.16, 2.2, T.bark, { y: 4.3, x: 0.7, rz: -0.8 }, 6);
    tr.cyl(0.08, 0.15, 2.0, T.bark, { y: 4.5, z: -0.6, rx: -0.75 }, 6);
    const bl = [[0, 6.6, 0, 2.4], [1.5, 6.0, 0.4, 1.8], [-1.3, 6.1, -0.7, 1.9], [0.3, 5.8, 1.5, 1.7], [-0.5, 7.6, 0.6, 1.6], [0.9, 7.2, -1.2, 1.5]];
    bl.forEach(([x, y, z, rr], i) => cr.ico(rr, T.leaves[i % 3], { x, y, z, sy: 0.85, jitter: 0.12 }, 1));
  } else {
    for (let i = 0; i < 7; i++) {
      const y = 0.9 + r() * (T.H - 2), a = r() * 6.28, rr = rAt(y);
      tr.box(0.16, 0.05, 0.05, 0x3a3532, { x: Math.sin(a) * rr, y, z: Math.cos(a) * rr, ry: a + 1.57, jitter: 0.1 });
    }
    const bl = [[0, 7.0, 0, 1.5], [0.7, 6.0, 0.3, 1.2], [-0.6, 6.3, -0.4, 1.15], [0.1, 8.3, 0.2, 1.0]];
    bl.forEach(([x, y, z, rr], i) => cr.ico(rr, T.leaves[i % 3], { x, y, z, sy: 1.35, jitter: 0.12 }, 1));
  }
  const gs = st.geometry(), gt = tr.geometry(), gc = cr.geometry();
  const full = mergeGeos([gs, gt, gc]);
  const gt2 = gt.clone(); gt2.translate(0, -T.stump, 0);
  const gc2 = gc.clone(); gc2.translate(0, -T.stump, 0);
  return { full, stump: gs, trunk: gt2, crown: gc2 };
}

function buildLogGeo(T) {
  const b = new MeshBuilder();
  b.cyl(1, 1, 1, T.bark, { rx: Math.PI / 2 }, 8);
  b.cyl(0.86, 0.86, 0.02, 0xe8c48a, { rx: Math.PI / 2, z: 0.5 }, 8);
  b.cyl(0.86, 0.86, 0.02, 0xe8c48a, { rx: Math.PI / 2, z: -0.5 }, 8);
  b.cyl(0.3, 0.3, 0.025, 0xc99a5e, { rx: Math.PI / 2, z: 0.5 }, 6);
  b.cyl(0.3, 0.3, 0.025, 0xc99a5e, { rx: Math.PI / 2, z: -0.5 }, 6);
  if (T.id === 'birch') for (let i = 0; i < 5; i++) {
    const a = i * 2.3, z = -0.4 + i * 0.2;
    b.box(0.5, 0.18, 0.06, 0x3a3532, { x: Math.sin(a), y: Math.cos(a), z, rz: -a });
  } else b.box(0.35, 0.3, 0.2, 0x4a3524, { x: 0.95, z: 0.1 });
  return b.geometry();
}

function createWorld(scene, { seed = 1 } = {}) {
  const R = 220, WATER = 0, EXT = 262.5, CELL = 2.5, N = Math.round(2 * EXT / CELL), N1 = N + 1;
  const rand = rng(seed * 7919 + 13);
  const nz = makeNoise(seed), nz2 = makeNoise(seed + 101);
  const HILL = { x: 62, z: -72, r: 55, h: 26 };

  // ---------------------------------------------------------------- Terrain-Höhe
  function rawHeight(x, z) {
    const d = Math.hypot(x, z);
    const s = R - d + nz.fbm(x * 0.006 + 11, z * 0.006 - 7, 3) * 40; // Meter landeinwärts
    let h;
    if (s < 0) h = s * 0.05 + Math.min(0, s + 25) * 0.12;
    else h = 1.7 * (1 - Math.exp(-s * 0.035));
    const inl = smooth(14, 60, s);
    let hills = (nz.fbm(x * 0.011, z * 0.011, 4) + 0.3) * 7.5;
    hills *= 0.35 + 0.65 * smooth(-0.15, 0.3, nz2.fbm(x * 0.004 + 50, z * 0.004, 2)); // weite flache Wiesen
    hills = Math.log(1 + Math.exp(hills * 1.2)) / 1.2;
    const hd2 = (x - HILL.x) ** 2 + (z - HILL.z) ** 2;
    const big = HILL.h * Math.exp(-hd2 / (HILL.r * HILL.r)) * (1 + 0.3 * nz2.fbm(x * 0.05, z * 0.05, 3));
    h += inl * (hills + big + nz2.fbm(x * 0.08, z * 0.08, 2) * 0.35);
    return Math.max(h, -9);
  }
  const H = new Float32Array(N1 * N1);
  for (let j = 0; j < N1; j++) for (let i = 0; i < N1; i++) H[j * N1 + i] = rawHeight(-EXT + i * CELL, -EXT + j * CELL);

  // Exakt dieselbe Dreiecks-Interpolation wie im Mesh (Diagonale (i,j)-(i+1,j+1))
  function heightAt(x, z) {
    const gx = (x + EXT) / CELL, gz = (z + EXT) / CELL;
    if (!(gx >= 0 && gz >= 0 && gx < N && gz < N)) return -9;
    const i = gx | 0, j = gz | 0, fx = gx - i, fz = gz - j, k = j * N1 + i;
    const h00 = H[k], h10 = H[k + 1], h01 = H[k + N1], h11 = H[k + N1 + 1];
    return fx >= fz ? h00 + (h10 - h00) * fx + (h11 - h10) * fz : h00 + (h11 - h01) * fx + (h01 - h00) * fz;
  }
  let gX = 0, gZ = 0;
  function grad(x, z) { const e = 0.6; gX = (heightAt(x + e, z) - heightAt(x - e, z)) / (2 * e); gZ = (heightAt(x, z + e) - heightAt(x, z - e)) / (2 * e); }
  const slopeAt = (x, z) => { grad(x, z); return Math.hypot(gX, gZ); };

  // ---------------------------------------------------------------- Terrain-Mesh (Chunks)
  const col = h => new THREE.Color(h);

    height: 1.75,
    radius: 0.35,

  deer(R) {

// ===== controller.js =====
const __m_controller = (() => {
// Kinematischer Charakter-Controller: Beschleunigung, Coyote-Time, Jump-Buffer, variable Sprunghöhe,
// Step-Up, Ground-Snap, Hang-Rutschen, Schwimmen. Alle Werte live tunebar über TUNING.
const { clamp, damp } = __m_kit;

const TUNING = {
  walkSpeed: 4.6,
  runSpeed: 8.2,
  accelGround: 42,
  decelGround: 34,
  accelAir: 11,
  turnRate: 13,        // wie schnell die Figur sich in Laufrichtung dreht
  gravity: 26,
  jumpHeight: 1.45,
  lowJumpMul: 2.4,     // Schwerkraft-Faktor, wenn Sprungtaste früh losgelassen (variable Höhe)
  fallMul: 1.55,       // schwereres Fallen = knackigeres Gefühl
  maxFall: 42,
  coyoteTime: 0.13,
  jumpBuffer: 0.15,
  stepHeight: 0.5,
  slopeLimitDeg: 44,
  slideAccel: 14,
  airControl: 1.0,
  chopMoveMul: 0.45,
  swimSpeed: 2.8,
};

const _wish = new THREE.Vector3(), _n = new THREE.Vector3();

class CharacterController {
  constructor(world, spawn, radius = 0.35, height = 1.75) {
    this.world = world;
    this.pos = spawn.clone();
    this.pos.y = world.groundAt(this.pos.x, this.pos.z, 999);
    this.vel = new THREE.Vector3();
    this.radius = radius; this.height = height;
    this.yaw = 0;              // Blickrichtung der Figur (+Z = 0)
    this.turn = 0;             // rad/s, für Animation
    this.grounded = true;
    this.swimming = false;
    this.coyote = 0; this.buffer = 0;
    this.jumping = false;
    this.landImpact = 0;
    this.sprint = false;
    this.airTime = 0;
    this.lastGroundY = this.pos.y;
  }

  groundNormal(x, z, out) {
    const e = 0.6, w = this.world;
    const hL = w.heightAt(x - e, z), hR = w.heightAt(x + e, z), hD = w.heightAt(x, z - e), hU = w.heightAt(x, z + e);
    return out.set(hL - hR, 2 * e, hD - hU).normalize();
  }

  /** intent: { moveX, moveY, sprint, jump, jumpPressed }, camYaw: Kamera-Yaw, mul: Speed-Multiplikator (z. B. beim Hacken) */
  update(dt, intent, camYaw, mul = 1) {
    const T = TUNING, w = this.world;
    this.landImpact = 0;

    // Wunschrichtung relativ zur Kamera
    const sx = intent.moveX, sy = intent.moveY;
    const mag = Math.min(1, Math.hypot(sx, sy));
    const sin = Math.sin(camYaw), cos = Math.cos(camYaw);
    // Kamera schaut entlang (-sin, -cos) -> vorwärts
    _wish.set(-sin * sy + cos * sx, 0, -cos * sy - sin * sx);
    if (_wish.lengthSq() > 1e-6) _wish.normalize();
    this.sprint = intent.sprint && mag > 0.3;
    let maxSpeed = (this.sprint ? T.runSpeed : T.walkSpeed) * mul;
    if (this.swimming) maxSpeed = T.swimSpeed * (this.sprint ? 1.4 : 1);

    // Hangbremse bergauf
    const gN = this.groundNormal(this.pos.x, this.pos.z, _n);
    const slopeDeg = Math.acos(clamp(gN.y, -1, 1)) * 57.3;
    if (this.grounded && mag > 0) {
      const uphill = -(gN.x * _wish.x + gN.z * _wish.z); // >0 = bergauf
      if (uphill > 0) maxSpeed *= 1 - clamp(uphill * 1.1, 0, 0.45);
    }

    const target = _wish.multiplyScalar(maxSpeed * mag);
    const onGround = this.grounded || this.swimming;
    const accel = onGround ? (mag > 0.01 ? T.accelGround : T.decelGround) : T.accelAir * T.airControl;
    // Beschleunigung als Vektor-Annäherung (kein Schwimmen/Eis-Gefühl)
    const dx = target.x - this.vel.x, dz = target.z - this.vel.z;
    const dl = Math.hypot(dx, dz), step = accel * dt;
    if (dl <= step || dl < 1e-6) { this.vel.x = target.x; this.vel.z = target.z; }
    else { this.vel.x += dx / dl * step; this.vel.z += dz / dl * step; }

    // Zu steiler Hang: rutschen
    if (this.grounded && slopeDeg > T.slopeLimitDeg) {
      this.vel.x += gN.x * T.slideAccel * dt;
      this.vel.z += gN.z * T.slideAccel * dt;
    }

    // Drehung zur Laufrichtung
    const hs = Math.hypot(this.vel.x, this.vel.z);
    const prevYaw = this.yaw;
    if (hs > 0.25 && mag > 0.05) {
      const want = Math.atan2(this.vel.x, this.vel.z);
      let d = want - this.yaw; d = Math.atan2(Math.sin(d), Math.cos(d));
      this.yaw += d * (1 - Math.exp(-T.turnRate * dt));
    }
    let dy = this.yaw - prevYaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy));
    this.turn = damp(this.turn, dt > 0 ? dy / dt : 0, 10, dt);

    // Sprung: Buffer + Coyote
    this.buffer = intent.jumpPressed ? T.jumpBuffer : Math.max(0, this.buffer - dt);
    this.coyote = this.grounded ? T.coyoteTime : Math.max(0, this.coyote - dt);
    if (this.buffer > 0 && this.coyote > 0 && !this.swimming) {
      this.vel.y = Math.sqrt(2 * T.gravity * T.jumpHeight);
      this.grounded = false; this.jumping = true;
      this.buffer = 0; this.coyote = 0;
      this.justJumped = true;
    } else this.justJumped = false;
    if (this.swimming && intent.jumpPressed) { this.vel.y = 4.5; this.swimming = false; this.grounded = false; }

    // Schwerkraft
    if (!this.grounded && !this.swimming) {
      let g = T.gravity;
      if (this.vel.y < 0) g *= T.fallMul;
      else if (!intent.jump) g *= T.lowJumpMul;
      this.vel.y = Math.max(-T.maxFall, this.vel.y - g * dt);
      this.airTime += dt;
    }

    // Integration horizontal + Kollision
    this.pos.x += this.vel.x * dt;
    this.pos.z += this.vel.z * dt;
    w.collide(this.pos, this.radius, this.height, this.vel);
    // Inselrand: unsichtbare weiche Grenze weit draußen im Wasser
    const rr = Math.hypot(this.pos.x, this.pos.z), lim = w.radius + 60;
    if (rr > lim) { this.pos.x *= lim / rr; this.pos.z *= lim / rr; }

    // Vertikal
    const ground = w.groundAt(this.pos.x, this.pos.z, this.pos.y);
    const water = w.waterLevel ?? 0;
    const swimY = water - 1.25;
    if (this.grounded) {
      const drop = this.pos.y - ground;
      if (ground > this.pos.y && ground - this.pos.y <= T.stepHeight) this.pos.y = ground;        // Step-Up
      else if (drop >= 0 && drop < T.stepHeight + hs * dt * 1.2) this.pos.y = ground;              // Ground-Snap bergab
      else if (drop >= T.stepHeight) { this.grounded = false; this.vel.y = 0; this.airTime = 0; } // Kante -> fallen
      this.vel.y = 0;
    } else if (!this.swimming) {
      this.pos.y += this.vel.y * dt;
      if (this.pos.y <= ground && this.vel.y <= 0) {
        this.landImpact = clamp(-this.vel.y / 20, 0, 1);
        this.pos.y = ground; this.vel.y = 0;
        this.grounded = true; this.jumping = false; this.airTime = 0;
      }
    }
    // Schwimmen wenn Wasser tief genug
    if (ground < swimY - 0.05 && this.pos.y <= swimY + 0.05) {
      if (!this.swimming) this.landImpact = clamp(-this.vel.y / 30, 0, 0.5);
      this.swimming = true; this.grounded = false; this.jumping = false;
      this.pos.y = damp(this.pos.y, swimY + Math.sin(performance.now() / 600) * 0.05, 8, dt);
      this.vel.y = 0;
    } else if (this.swimming) {
      this.swimming = false;
      this.grounded = ground >= this.pos.y - 0.3;
      if (this.grounded) this.pos.y = Math.max(this.pos.y, ground);
    }
    this.maxSpeed = maxSpeed;
    this.speed = Math.hypot(this.vel.x, this.vel.z);
  }

  forward(out = new THREE.Vector3()) { return out.set(Math.sin(this.yaw), 0, Math.cos(this.yaw)); }
}

return { TUNING, CharacterController };
})();

// ===== camera.js =====
const __m_camera = (() => {
// Third-Person-Kamera pro Spieler: Orbit (Yaw/Pitch), weiches Folgen (vertikal träger -> Sprünge wirken ruhig),
// Terrain-Kollision, Auto-Ausrichtung hinter die Figur, Sprint-FOV, Lande-Shake.
const { clamp, damp } = __m_kit;

const CAM_TUNING = {
  distance: 6.5, minDist: 2.5, maxDist: 14,
  height: 1.55,
  followXZ: 14, followY: 6,
  autoAlign: 1.2,     // 0 = aus. Dreht Kamera langsam hinter die Laufrichtung
  fov: 62, sprintFov: 70,
  shake: 1,
};

class FollowCamera {
  constructor(aspect) {
    this.cam = new THREE.PerspectiveCamera(CAM_TUNING.fov, aspect, 0.1, 1100);
    this.yaw = Math.PI;        // Kamera hinter Figur, die nach +Z schaut
    this.pitch = 0.32;
    this.dist = CAM_TUNING.distance;
    this.target = new THREE.Vector3();
    this.shakeT = 0; this.shakeAmp = 0;
    this.lookIdle = 0;
    this.inited = false;
  }

  kick(amount) { this.shakeAmp = Math.max(this.shakeAmp, amount * CAM_TUNING.shake); this.shakeT = 0; }

  update(dt, ctrl, intent, world) {
    const C = CAM_TUNING;
    this.yaw -= intent.lookX * dt;
    this.pitch = clamp(this.pitch + intent.lookY * dt, -0.35, 1.25);
    this.dist = clamp(this.dist + intent.zoom, C.minDist, C.maxDist);
    const looking = Math.abs(intent.lookX) + Math.abs(intent.lookY) > 0.01;
    this.lookIdle = looking ? 0 : this.lookIdle + dt;

    // Auto-Ausrichtung nur bei Bewegung und wenn der Spieler die Kamera eine Weile nicht anfasst
    if (C.autoAlign > 0 && this.lookIdle > 1.2 && ctrl.speed > 1.5 && ctrl.grounded) {
      const behind = ctrl.yaw + Math.PI;
      let d = behind - this.yaw; d = Math.atan2(Math.sin(d), Math.cos(d));
      // seitliches Laufen nicht "jagen": nur wenn nicht fast rückwärts
      if (Math.abs(d) < 2.4) this.yaw += d * (1 - Math.exp(-C.autoAlign * 0.35 * dt)) * Math.min(1, ctrl.speed / 5);
    }

    const tx = ctrl.pos.x, tz = ctrl.pos.z, ty = ctrl.pos.y + C.height;
    if (!this.inited) { this.target.set(tx, ty, tz); this.inited = true; }
    this.target.x = damp(this.target.x, tx, C.followXZ, dt);
    this.target.z = damp(this.target.z, tz, C.followXZ, dt);
    // Vertikal: beim Springen träge, beim Fallen unter das Ziel schneller nachziehen
    const fy = ty < this.target.y - 1.2 ? C.followY * 2.5 : C.followY;
    this.target.y = damp(this.target.y, ty, fy, dt);

    const cp = Math.cos(this.pitch), sp = Math.sin(this.pitch);
    let d = this.dist;
    const cam = this.cam;
    const place = dd => cam.position.set(
      this.target.x + Math.sin(this.yaw) * cp * dd,
      this.target.y + sp * dd + 0.4,
      this.target.z + Math.cos(this.yaw) * cp * dd);
    place(d);
    // Terrain-Kollision: Kamera näher heranziehen statt durch den Hügel zu schauen
    for (let i = 0; i < 6; i++) {
      const g = world.heightAt(cam.position.x, cam.position.z) + 0.5;
      if (cam.position.y >= g) break;
      d *= 0.78; place(d);
    }
    const g = world.heightAt(cam.position.x, cam.position.z) + 0.4;
    if (cam.position.y < g) cam.position.y = g;
    if (cam.position.y < (world.waterLevel ?? 0) + 0.3) cam.position.y = (world.waterLevel ?? 0) + 0.3;

    // Shake
    if (this.shakeAmp > 0.001) {
      this.shakeT += dt;
      const a = this.shakeAmp * Math.exp(-this.shakeT * 9);
      cam.position.x += Math.sin(this.shakeT * 61) * a * 0.12;
      cam.position.y += Math.sin(this.shakeT * 73 + 1) * a * 0.18;
      if (a < 0.002) this.shakeAmp = 0;
    }
    cam.lookAt(this.target.x, this.target.y + 0.15, this.target.z);
    const fov = ctrl.sprint && ctrl.speed > 6 ? C.sprintFov : C.fov;
    cam.fov = damp(cam.fov, fov, 4, dt);
    cam.updateProjectionMatrix();
  }
}

return { CAM_TUNING, FollowCamera };
})();

// ===== main.js =====
const __m_main = (() => {
// Viniland Testlab – Hauptschleife: Welt, 2 Spieler (Splitscreen), Tiere, Tuning-Menü.
const { PSX, setPSX } = __m_psx;
const { createWorld } = __m_world;
const { createPlayerModel, PLAYER_LOOKS } = __m_players;
const { Fauna } = __m_fauna;
const { Input, KEY_HELP } = __m_input;
const { CharacterController, TUNING } = __m_controller;
const { FollowCamera, CAM_TUNING } = __m_camera;

const params = new URLSearchParams(location.search);
const SETTINGS = {
  players: params.get('p') === '1' ? 1 : 2,
  split: 'auto',           // auto | vertical | horizontal
  pixelScale: 0.5,         // interne Auflösung relativ zum Bildschirm (PSX-Pixel)
  snap: 220, dither: true, shadows: true,
  animals: true,
  debug: false,
  swapPads: false,
  looks: [0, 1],
};
try { Object.assign(SETTINGS, JSON.parse(localStorage.getItem('viniland.settings') || '{}')); } catch (e) { /* ok */ }
try { Object.assign(TUNING, JSON.parse(localStorage.getItem('viniland.tuning') || '{}')); } catch (e) { /* ok */ }
try { Object.assign(CAM_TUNING, JSON.parse(localStorage.getItem('viniland.cam') || '{}')); } catch (e) { /* ok */ }
if (params.get('p')) SETTINGS.players = params.get('p') === '1' ? 1 : 2;
const save = () => { try {
  localStorage.setItem('viniland.settings', JSON.stringify(SETTINGS));
  localStorage.setItem('viniland.tuning', JSON.stringify(TUNING));
  localStorage.setItem('viniland.cam', JSON.stringify(CAM_TUNING));
} catch (e) { /* ok */ } };

// ---------- Renderer ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.shadowMap.enabled = SETTINGS.shadows;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.setScissorTest(true);
const scene = new THREE.Scene();
setPSX({ snap: SETTINGS.snap, dither: SETTINGS.dither });

const seed = Number(params.get('seed')) || 1337;
const world = createWorld(scene, { seed });
const sun = world.sun;
const sunOffset = world.sunOffset ? world.sunOffset.clone() : new THREE.Vector3(70, 110, 45);
if (sun) {
  if (sunOffset.lengthSq() < 1) sunOffset.set(60, 90, 40);
  const sc = sun.shadow.camera; sc.left = -45; sc.right = 45; sc.top = 45; sc.bottom = -45; sc.near = 1; sc.far = 320; sc.updateProjectionMatrix();
  if (!sun.target.parent) scene.add(sun.target);
}

// ---------- Spieler ----------
const input = new Input(canvas);
const players = [];
function makePlayer(i) {
  const model = createPlayerModel(SETTINGS.looks[i] ?? i);
  scene.add(model.object3D);
  const spawn = (world.spawnPoints && world.spawnPoints[i]) ? world.spawnPoints[i].clone() : new THREE.Vector3(i * 3, 0, 0);
  const ctrl = new CharacterController(world, spawn, model.radius || 0.35, model.height || 1.75);
  const cam = new FollowCamera(1);
  cam.yaw = Math.PI; // hinter der Figur
  return { i, model, ctrl, cam, pos: ctrl.pos, vel: ctrl.vel, get speed() { return ctrl.speed || 0; }, intent: null, pendingHit: null, chopT: 0 };
}
for (let i = 0; i < 2; i++) players.push(makePlayer(i));
// Spieler schauen sich zum Start leicht zur Inselmitte hin
for (const p of players) {
  const yaw = Math.atan2(-p.pos.x, -p.pos.z);
  p.ctrl.yaw = yaw; p.cam.yaw = yaw + Math.PI;
}

let fauna = null;
try { if (SETTINGS.animals) fauna = new Fauna(scene, world, seed + 3); } catch (e) { console.error(e); showError('Fauna: ' + e.message); }

// ---------- HUD ----------
const hudEls = [document.getElementById('hud0'), document.getElementById('hud1')];
const fpsEl = document.getElementById('fps');
const helpEl = document.getElementById('help');
helpEl.innerHTML = KEY_HELP.map(s => `<div>${s}</div>`).join('') + '<div>Gamepad: Stick L laufen · A springen · LB/L3 sprinten · X/RT hacken · Y winken · Stick R Kamera · Start = Menü</div><div><b>Tab / Esc</b> = Menü & Tuning</div>';
setTimeout(() => helpEl.classList.add('fade'), 9000);

function showError(msg) { const el = document.getElementById('err'); el.style.display = 'block'; el.textContent += msg + '\n'; }
addEventListener('error', e => showError(e.message));

// ---------- Menü ----------
const menu = document.getElementById('menu');
function buildMenu() {
  const sec = (title, obj, defs) => {
    let h = `<h3>${title}</h3>`;
    for (const [k, min, max, step, label] of defs) {
      h += `<label><span>${label || k}</span><input type="range" data-obj="${title}" data-k="${k}" min="${min}" max="${max}" step="${step}" value="${obj[k]}"><em>${(+obj[k]).toFixed(2)}</em></label>`;
    }
    return h;
  };
  menu.innerHTML = `
  <div class="mhead"><b>Viniland Testlab</b><button id="mclose">✕</button></div>
  <div class="row">
    <button data-act="players">${SETTINGS.players === 2 ? '👥 2 Spieler' : '👤 1 Spieler'}</button>
    <button data-act="split">Split: ${SETTINGS.split}</button>
    <button data-act="swap">Gamepads tauschen${SETTINGS.swapPads ? ' ✓' : ''}</button>
    <button data-act="look0">P1 Look: ${PLAYER_LOOKS[SETTINGS.looks[0]]?.name ?? SETTINGS.looks[0]}</button>
    <button data-act="look1">P2 Look: ${PLAYER_LOOKS[SETTINGS.looks[1]]?.name ?? SETTINGS.looks[1]}</button>
    <button data-act="dither">Dithering ${SETTINGS.dither ? 'an' : 'aus'}</button>
    <button data-act="shadows">Schatten ${SETTINGS.shadows ? 'an' : 'aus'}</button>
    <button data-act="debug">Debug ${SETTINGS.debug ? 'an' : 'aus'}</button>
    <button data-act="reset">Tuning zurücksetzen</button>
  </div>
  ${sec('Grafik', SETTINGS, [['pixelScale', 0.2, 1, 0.05, 'Pixel-Skala'], ['snap', 0, 400, 10, 'Vertex-Snap (0=aus)']])}
  ${sec('Bewegung', TUNING, [['walkSpeed', 1, 10, 0.1, 'Gehen m/s'], ['runSpeed', 2, 16, 0.1, 'Sprint m/s'], ['accelGround', 5, 120, 1, 'Beschl. Boden'], ['decelGround', 5, 120, 1, 'Bremsen Boden'], ['accelAir', 0, 60, 1, 'Beschl. Luft'], ['turnRate', 2, 30, 0.5, 'Drehrate'], ['gravity', 8, 60, 0.5, 'Schwerkraft'], ['jumpHeight', 0.3, 4, 0.05, 'Sprunghöhe m'], ['lowJumpMul', 1, 5, 0.1, 'Kurzsprung-Mul'], ['fallMul', 1, 4, 0.05, 'Fall-Mul'], ['coyoteTime', 0, 0.4, 0.01, 'Coyote-Zeit'], ['jumpBuffer', 0, 0.4, 0.01, 'Sprung-Puffer'], ['stepHeight', 0.1, 1.2, 0.05, 'Stufenhöhe'], ['slopeLimitDeg', 20, 70, 1, 'Max. Hang °']])}
  ${sec('Kamera', CAM_TUNING, [['distance', 2, 14, 0.1, 'Abstand'], ['height', 0.5, 3, 0.05, 'Höhe'], ['followXZ', 2, 30, 0.5, 'Folgen XZ'], ['followY', 1, 30, 0.5, 'Folgen Y'], ['autoAlign', 0, 4, 0.1, 'Auto-Ausrichtung'], ['fov', 40, 90, 1, 'FOV'], ['sprintFov', 40, 100, 1, 'Sprint-FOV'], ['shake', 0, 3, 0.1, 'Shake']])}
  <p class="hint">Einstellungen werden im Browser gespeichert. URL-Parameter: <code>?p=1</code> (1 Spieler), <code>?seed=42</code>.</p>`;
  menu.querySelector('#mclose').onclick = () => toggleMenu(false);
  menu.querySelectorAll('input[type=range]').forEach(el => el.oninput = () => {
    const obj = { Grafik: SETTINGS, Bewegung: TUNING, Kamera: CAM_TUNING }[el.dataset.obj];
    obj[el.dataset.k] = +el.value;
    el.nextElementSibling.textContent = (+el.value).toFixed(2);
    if (el.dataset.k === 'snap') setPSX({ snap: +el.value });
    if (el.dataset.k === 'distance') players.forEach(p => p.cam.dist = +el.value);
    if (el.dataset.k === 'pixelScale') resize();
    save();
  });
  menu.querySelectorAll('button[data-act]').forEach(b => b.onclick = () => {
    const a = b.dataset.act;
    if (a === 'players') { SETTINGS.players = SETTINGS.players === 2 ? 1 : 2; resize(); }
    if (a === 'split') SETTINGS.split = { auto: 'vertical', vertical: 'horizontal', horizontal: 'auto' }[SETTINGS.split];
    if (a === 'swap') { SETTINGS.swapPads = !SETTINGS.swapPads; input.swapPads = SETTINGS.swapPads; }
    if (a === 'dither') { SETTINGS.dither = !SETTINGS.dither; setPSX({ dither: SETTINGS.dither }); }
    if (a === 'shadows') { SETTINGS.shadows = !SETTINGS.shadows; if (sun) sun.castShadow = SETTINGS.shadows; }
    if (a === 'debug') SETTINGS.debug = !SETTINGS.debug;
    if (a === 'look0' || a === 'look1') {
      const i = +a.slice(-1);
      SETTINGS.looks[i] = (SETTINGS.looks[i] + 1) % PLAYER_LOOKS.length;
      const p = players[i]; scene.remove(p.model.object3D);
      p.model = createPlayerModel(SETTINGS.looks[i]); scene.add(p.model.object3D);
    }
    if (a === 'reset') { localStorage.removeItem('viniland.tuning'); localStorage.removeItem('viniland.cam'); location.reload(); return; }
    save(); buildMenu();
  });
}
function toggleMenu(open = !menu.classList.contains('open')) {
  if (open) buildMenu();
  menu.classList.toggle('open', open);

}
input.swapPads = SETTINGS.swapPads;
if (sun) sun.castShadow = SETTINGS.shadows;

// ---------- Layout ----------
let W = 1, H = 1;
function views() {
  if (SETTINGS.players === 1) return [{ x: 0, y: 0, w: W, h: H }];
  const vertical = SETTINGS.split === 'vertical' || (SETTINGS.split === 'auto' && W >= H);
  return vertical
    ? [{ x: 0, y: 0, w: Math.floor(W / 2), h: H }, { x: Math.floor(W / 2), y: 0, w: W - Math.floor(W / 2), h: H }]
    : [{ x: 0, y: Math.floor(H / 2), w: W, h: H - Math.floor(H / 2) }, { x: 0, y: 0, w: W, h: Math.floor(H / 2) }];
}
function resize() {
  const s = SETTINGS.pixelScale;
  renderer.setPixelRatio(1);
  W = Math.max(2, Math.floor(innerWidth * s)); H = Math.max(2, Math.floor(innerHeight * s));
  renderer.setSize(W, H, false);
  canvas.style.width = innerWidth + 'px'; canvas.style.height = innerHeight + 'px';
  document.body.classList.toggle('solo', SETTINGS.players === 1);
  const vertical = SETTINGS.split === 'vertical' || (SETTINGS.split === 'auto' && innerWidth >= innerHeight);
  document.body.classList.toggle('hsplit', !vertical);
}
addEventListener('resize', resize);
resize();

// ---------- Interaktion ----------
const _o = new THREE.Vector3(), _d = new THREE.Vector3();
function doChop(p) {
  if (p.model.actionActive) return;
  const r = p.model.playAction('chop') || { duration: 0.55, impactAt: 0.28 };
  p.pendingHit = r.impactAt; p.chopT = r.duration;
}
function impact(p) {
  _o.copy(p.ctrl.pos); _o.y += 1.0;
  p.ctrl.forward(_d);
  const res = world.hitTree(_o, _d, 2.6, 1) || {};
  if (res.hit) {
    p.cam.kick(res.felled ? 1.2 : 0.35);
    input.rumble(SETTINGS.players === 1 ? 0 : p.i, res.felled ? 0.9 : 0.35, res.felled ? 200 : 60);
  }
}

// Spieler gegeneinander
function separatePlayers() {
  if (SETTINGS.players < 2) return;
  const a = players[0].ctrl, b = players[1].ctrl;
  const dx = b.pos.x - a.pos.x, dz = b.pos.z - a.pos.z, d = Math.hypot(dx, dz), min = a.radius + b.radius;
  if (d < min && d > 1e-4 && Math.abs(a.pos.y - b.pos.y) < 1.6) {
    const push = (min - d) / 2, nx = dx / d, nz = dz / d;
    a.pos.x -= nx * push; a.pos.z -= nz * push; b.pos.x += nx * push; b.pos.z += nz * push;
  }
}

// ---------- Demo (?demo): automatische Eingaben zum Testen ----------
const DEMO = params.has('demo');
let demoT = 0;
function demoIntent(p, o) {
  if (p.i === 0) {
    // zum nächsten Baum laufen und hacken
    const t = world.trees?.filter(t => t.state === 0)
      .reduce((b, t) => { const d = Math.hypot(t.x - p.pos.x, t.z - p.pos.z); return !b || d < b.d ? { t, d } : b; }, null);
    if (t) {
      const want = Math.atan2(t.t.x - p.pos.x, t.t.z - p.pos.z);
      if (t.d > 1.6) { p.cam.yaw = want + Math.PI; o.moveY = 1; o.sprint = t.d > 6; }
      else { p.ctrl.yaw = want; o.chopPressed = true; }
    }
  } else {
    o.moveY = 1; o.moveX = Math.sin(demoT * 0.7) * 0.6;
    o.jump = (demoT % 1.6) < 0.4; o.jumpPressed = (demoT % 1.6) < 0.06;
  }
}

// ---------- Loop ----------
let last = performance.now(), fpsAcc = 0, fpsN = 0, fpsShow = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  if (dt <= 0) return;
  fpsAcc += dt; fpsN++;
  if (fpsAcc > 0.5) { fpsShow = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0; }
  PSX.uniforms.uTime.value += dt; demoT += dt;

  const active = players.slice(0, SETTINGS.players);
  const menuOpen = menu.classList.contains('open');
  for (const p of active) {
    const intent = input.read(p.i, dt);
    if (intent.menuPressed) toggleMenu();
    if (menuOpen) { intent.moveX = intent.moveY = intent.lookX = intent.lookY = 0; intent.jumpPressed = intent.chopPressed = intent.jump = false; }
    if (DEMO) demoIntent(p, intent);
    p.intent = intent;
    if (intent.chopPressed && !p.ctrl.swimming) doChop(p);
    if (intent.wavePressed && !p.model.actionActive) p.model.playAction('wave');

    const mul = p.chopT > 0 ? TUNING.chopMoveMul : 1;
    const steps = dt > 1 / 55 ? 2 : 1;
    for (let s = 0; s < steps; s++) p.ctrl.update(dt / steps, intent, p.cam.yaw, mul);
    if (p.ctrl.landImpact > 0.25) { p.cam.kick(p.ctrl.landImpact * 0.8); input.rumble(p.i, p.ctrl.landImpact * 0.5, 70); }

    if (p.pendingHit !== null) { p.pendingHit -= dt; if (p.pendingHit <= 0) { p.pendingHit = null; impact(p); } }
    p.chopT = Math.max(0, p.chopT - dt);

    const m = p.model;
    m.object3D.position.copy(p.ctrl.pos);
    m.object3D.rotation.y = p.ctrl.yaw;
    m.animate(dt, {
      speed: p.ctrl.speed, maxSpeed: TUNING.runSpeed, grounded: p.ctrl.grounded || p.ctrl.swimming, vy: p.ctrl.vel.y,
      turn: p.ctrl.turn, landImpact: p.ctrl.landImpact, sprint: p.ctrl.sprint, swimming: p.ctrl.swimming,
    });
    p.cam.update(dt, p.ctrl, intent, world);
  }
  // Inaktiver P2 wird versteckt
  players[1].model.object3D.visible = SETTINGS.players === 2;
  separatePlayers();
  input.endFrame();

  world.update(dt, active.map(p => ({ pos: p.ctrl.pos, vel: p.ctrl.vel })));
  if (fauna) fauna.update(dt, active.map(p => ({ pos: p.ctrl.pos, speed: p.ctrl.speed })));

  // Rendern pro Viewport; Sonne/Schatten folgt dem jeweiligen Spieler
  const vs = views();
  vs.forEach((v, idx) => {
    const p = active[idx];
    p.cam.cam.aspect = v.w / v.h; p.cam.cam.updateProjectionMatrix();
    if (sun) {
      sun.target.position.copy(p.ctrl.pos);
      sun.position.copy(p.ctrl.pos).add(sunOffset);
      sun.target.updateMatrixWorld();
      sun.shadow.needsUpdate = true;
    }
    renderer.setViewport(v.x, v.y, v.w, v.h);
    renderer.setScissor(v.x, v.y, v.w, v.h);
    renderer.render(scene, p.cam.cam);
  });

  // HUD
  const st = world.stats ? world.stats() : {};
  fpsEl.textContent = `${fpsShow} fps · 🪵 ${st.wood ?? 0} · 🌲 ${st.trees ?? '?'} · Logs ${st.logs ?? 0}`;
  active.forEach((p, idx) => {
    const c = p.ctrl;
    let t = `<b>P${p.i + 1}</b> <small>${input.lastDevice[p.i]}</small>`;
    if (SETTINGS.debug) t += `<br><small>v ${c.speed.toFixed(2)} · vy ${c.vel.y.toFixed(2)} · ${c.swimming ? 'schwimmt' : c.grounded ? 'Boden' : 'Luft ' + c.airTime.toFixed(2) + 's'}<br>x ${c.pos.x.toFixed(1)} y ${c.pos.y.toFixed(2)} z ${c.pos.z.toFixed(1)}</small>`;
    hudEls[idx].innerHTML = t;
  });
  hudEls[1].style.display = SETTINGS.players === 2 ? '' : 'none';
}
requestAnimationFrame(frame);
window.__viniland = { world, players, fauna, TUNING, CAM_TUNING, SETTINGS };
if (params.has('dbg')) setInterval(() => {
  const el = document.getElementById('err'); el.style.display = 'block';
  el.textContent = players.map(p => `P${p.i + 1} ${p.model.look?.name} pos ${p.ctrl.pos.toArray().map(n => n.toFixed(2))} cam ${p.cam.cam.position.toArray().map(n => n.toFixed(1))}`).join('\n');
}, 250);

return {  };
})();

</script>
</body>
