<script type="module">
import * as THREE from 'three';
// ===== psx.js =====
const __m_psx = (() => {
// PSX/PS2-Look: Vertex-Snapping, Farb-Quantisierung mit Bayer-Dithering, Lambert-Flat-Shading.
// Jedes Modul nutzt psxMat() für seine Materialien, damit der Look global steuerbar ist.

const PSX = {
  uniforms: {
    uSnap: { value: 220.0 },     // Raster der Vertex-Snapping (kleiner = wackeliger). 0 = aus
    uDither: { value: 1.0 },     // 1 = Dithering + Farbtiefe 5 Bit, 0 = aus
    uTime: { value: 0.0 },
  },
};

function setPSX({ snap, dither } = {}) {
  if (snap !== undefined) PSX.uniforms.uSnap.value = snap;
  if (dither !== undefined) PSX.uniforms.uDither.value = dither ? 1 : 0;
}

const SNAP_VERT = /* glsl */`
  #include <project_vertex>
  if (uSnap > 0.0) {
    vec4 snapPos = gl_Position;
    snapPos.xyz /= snapPos.w;
    snapPos.xy = floor(snapPos.xy * uSnap + 0.5) / uSnap;
    snapPos.xyz *= snapPos.w;
    gl_Position = snapPos;
  }
`;

const DITHER_FRAG = /* glsl */`
  #include <dithering_fragment>
  if (uDither > 0.5) {
    int bx = int(mod(gl_FragCoord.x, 4.0));
    int by = int(mod(gl_FragCoord.y, 4.0));
    float bayer[16] = float[16](0.,8.,2.,10.,12.,4.,14.,6.,3.,11.,1.,9.,15.,7.,13.,5.);
    float d = (bayer[by * 4 + bx] / 16.0 - 0.5) / 31.0;
    gl_FragColor.rgb = floor((gl_FragColor.rgb + d) * 31.0 + 0.5) / 31.0;
  }
`;

/** Patcht ein beliebiges three.js-Material mit dem PSX-Look. Gibt das Material zurück. */
function patchPSX(material) {
  const prev = material.onBeforeCompile;
  material.onBeforeCompile = (shader, renderer) => {
    if (prev) prev(shader, renderer);
    shader.uniforms.uSnap = PSX.uniforms.uSnap;
    shader.uniforms.uDither = PSX.uniforms.uDither;
    shader.uniforms.uTime = PSX.uniforms.uTime;
    shader.vertexShader = 'uniform float uSnap;\nuniform float uTime;\n' +
      shader.vertexShader.replace('#include <project_vertex>', SNAP_VERT);
    shader.fragmentShader = 'uniform float uDither;\n' +
      shader.fragmentShader.replace('#include <dithering_fragment>', DITHER_FRAG);
  };
  material.customProgramCacheKey = () => 'psx-' + (material.userData.psxKey || '');
  return material;
}

const cache = new Map();
/**
 * Standard-Material für alles. opts wie MeshLambertMaterial.
 * Ohne opts: geteiltes Vertex-Color-Flat-Material (empfohlen, spart Draw-State).
 */
function psxMat(opts = {}) {
  const o = { vertexColors: true, flatShading: true, ...opts };
  const key = JSON.stringify(o, (k, v) => (v && v.isColor ? v.getHex() : (v && v.isTexture ? v.uuid : v)));
  if (!opts.noCache && cache.has(key)) return cache.get(key);
  delete o.noCache;
  const m = patchPSX(new THREE.MeshLambertMaterial(o));
  cache.set(key, m);
  return m;
}

return { PSX, setPSX, patchPSX, psxMat };
})();

// ===== kit.js =====
const __m_kit = (() => {
// Mesh-Baukasten: Low/Mid-Poly-Primitive mit Vertex-Farben, die zu EINER Geometrie verschmolzen werden.
// Beispiel:
//   const b = new MeshBuilder();
//   b.box(0.6, 0.4, 1.0, 0xd9772b, { y: 0.5 });
//   b.sphere(0.25, 0xffffff, { y: 0.8, z: 0.5, sy: 0.8 }, 6, 4);
//   const mesh = b.mesh(); // THREE.Mesh mit psxMat()
const { psxMat } = __m_psx;

const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(),
  _p = new THREE.Vector3(), _s = new THREE.Vector3(), _c = new THREE.Color();

/** t = { x,y,z, rx,ry,rz (Radiant), s (uniform), sx,sy,sz, jitter (Farbvariation 0..1) } */
function tMatrix(t = {}) {
  _p.set(t.x || 0, t.y || 0, t.z || 0);
  _e.set(t.rx || 0, t.ry || 0, t.rz || 0);
  _q.setFromEuler(_e);
  const s = t.s ?? 1;
  _s.set((t.sx ?? 1) * s, (t.sy ?? 1) * s, (t.sz ?? 1) * s);
  return _m.compose(_p, _q, _s).clone();
}

class MeshBuilder {
  constructor() { this.parts = []; }

  /** Fügt beliebige BufferGeometry mit Farbe und Transform hinzu. */
  add(geo, color, t = {}) {
    let g = geo.index ? geo.toNonIndexed() : geo.clone();
    g.applyMatrix4(tMatrix(t));
    const n = g.attributes.position.count;
    const col = new Float32Array(n * 3);
    _c.set(color);
    const jit = t.jitter ?? 0.06;
    // Pro Dreieck leicht variierende Farbe => handgemachter PS1-Look
    for (let i = 0; i < n; i += 3) {
      const k = 1 + (Math.random() - 0.5) * jit * 2;
      for (let j = 0; j < 3 && i + j < n; j++) {
        col[(i + j) * 3] = Math.min(1, _c.r * k);
        col[(i + j) * 3 + 1] = Math.min(1, _c.g * k);
        col[(i + j) * 3 + 2] = Math.min(1, _c.b * k);
      }
    }
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    for (const name of Object.keys(g.attributes)) if (!['position', 'normal', 'color'].includes(name)) g.deleteAttribute(name);
    this.parts.push(g);
    return this;
  }
  box(w, h, d, color, t) { return this.add(new THREE.BoxGeometry(w, h, d), color, t); }
  sphere(r, color, t, ws = 7, hs = 5) { return this.add(new THREE.SphereGeometry(r, ws, hs), color, t); }
  cyl(rTop, rBot, h, color, t, seg = 7) { return this.add(new THREE.CylinderGeometry(rTop, rBot, h, seg), color, t); }
  cone(r, h, color, t, seg = 7) { return this.add(new THREE.ConeGeometry(r, h, seg), color, t); }
  ico(r, color, t, detail = 0) { return this.add(new THREE.IcosahedronGeometry(r, detail), color, t); }
  capsule(r, len, color, t, cap = 3, seg = 7) { return this.add(new THREE.CapsuleGeometry(r, len, cap, seg), color, t); }

  geometry() {
    let total = 0;
    for (const g of this.parts) total += g.attributes.position.count;
    const pos = new Float32Array(total * 3), col = new Float32Array(total * 3);
    let o = 0;
    for (const g of this.parts) {
      pos.set(g.attributes.position.array, o * 3);
      col.set(g.attributes.color.array, o * 3);
      o += g.attributes.position.count;
    }
    const out = new THREE.BufferGeometry();
    out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    out.setAttribute('color', new THREE.BufferAttribute(col, 3));
    out.computeVertexNormals();
    out.computeBoundingSphere();
    return out;
  }
  mesh(material = psxMat()) {
    const m = new THREE.Mesh(this.geometry(), material);
    m.castShadow = true; m.receiveShadow = true;
    return m;
  }
}

/** Seeded RNG (mulberry32) */
function rng(seed = 1) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** 2D Value-Noise + fbm, seeded */
function makeNoise(seed = 1) {
  const r = rng(seed), P = new Uint8Array(512), G = new Float32Array(256);
  for (let i = 0; i < 256; i++) { P[i] = i; G[i] = r() * 2 - 1; }
  for (let i = 255; i > 0; i--) { const j = (r() * (i + 1)) | 0; [P[i], P[j]] = [P[j], P[i]]; }
  for (let i = 0; i < 256; i++) P[i + 256] = P[i];
  const fade = t => t * t * (3 - 2 * t);
  const v = (x, y) => G[P[P[x & 255] + (y & 255)]];
  function noise(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = fade(xf), w = fade(yf);
    const a = v(xi, yi), b = v(xi + 1, yi), c = v(xi, yi + 1), d = v(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * w + (a - b - c + d) * u * w;
  }
  function fbm(x, y, oct = 4) {
    let s = 0, amp = 0.5, f = 1;
    for (let i = 0; i < oct; i++) { s += noise(x * f, y * f) * amp; f *= 2; amp *= 0.5; }
    return s;
  }
  return { noise, fbm };
}

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, lambda, dt) => lerp(a, b, 1 - Math.exp(-lambda * dt));

return { tMatrix, MeshBuilder, rng, makeNoise, clamp, lerp, damp };
})();

// ===== world.js =====
const __m_world = (() => {
// Viniland – Welt: Insel-Terrain, Wasser, Himmel, Licht, Bäume (fällbar), Logs mit leichter Eigenphysik, Deko.
// API siehe CONTRACT.md (createWorld).
const { psxMat, patchPSX } = __m_psx;
const { MeshBuilder, rng, makeNoise, clamp, lerp } = __m_kit;

const G = 9.81;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

// Temporäre Objekte (keine Allokationen im Loop)
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _q2 = new THREE.Quaternion(), _e = new THREE.Euler(0, 0, 0, 'YXZ'),
  _v = new THREE.Vector3(), _s = new THREE.Vector3(), _ax = new THREE.Vector3(), _c = new THREE.Color();
const ZERO_M = new THREE.Matrix4().makeScale(0, 0, 0);
const UP = new THREE.Vector3(0, 1, 0);

// Baumarten (unskaliert, Meter)
const TREE_TYPES = [
  { id: 'pine', H: 9.2, rB: 0.30, rT: 0.09, stump: 0.42, crownC: 6.0, crownR: 2.2, top: 10.6, lc: 0.50, hp: [4, 5],
    bark: 0x7a5232, leaves: [0x2f6b3a, 0x3d7d44, 0x285f33] },
  { id: 'oak', H: 5.0, rB: 0.42, rT: 0.27, stump: 0.42, crownC: 6.4, crownR: 2.8, top: 9.0, lc: 0.66, hp: [4, 5],
    bark: 0x5e4430, leaves: [0x5c9e3c, 0x74b247, 0x4e8c35] },
  { id: 'birch', H: 8.4, rB: 0.20, rT: 0.08, stump: 0.40, crownC: 6.7, crownR: 1.7, top: 9.4, lc: 0.55, hp: [3, 4],
    bark: 0xe6e1d3, leaves: [0xa3cf4f, 0xbcd95c, 0x8cbf45] },
];

function mergeGeos(geos) {
  let n = 0; for (const g of geos) n += g.attributes.position.count;
  const pos = new Float32Array(n * 3), col = new Float32Array(n * 3); let o = 0;
  for (const g of geos) { pos.set(g.attributes.position.array, o * 3); col.set(g.attributes.color.array, o * 3); o += g.attributes.position.count; }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('color', new THREE.BufferAttribute(col, 3));
  out.computeVertexNormals(); out.computeBoundingSphere();
  return out;
}

function buildTreeGeos(T, r) {
  const st = new MeshBuilder(), tr = new MeshBuilder(), cr = new MeshBuilder();
  const rAt = y => lerp(T.rB, T.rT, y / T.H);
  st.cyl(rAt(T.stump), T.rB * 1.08, T.stump, T.bark, { y: T.stump / 2 }, 8);
  st.cyl(rAt(T.stump) * 0.85, rAt(T.stump) * 0.85, 0.02, 0xe8c48a, { y: T.stump + 0.005 }, 8);
  tr.cyl(T.rT, rAt(T.stump), T.H - T.stump, T.bark, { y: T.stump + (T.H - T.stump) / 2 }, 8);
  if (T.id === 'pine') {
    const lay = [[2.6, 2.2, 3.2], [4.3, 1.85, 3.0], [5.9, 1.45, 2.7], [7.5, 1.05, 2.4], [8.9, 0.6, 1.8]];
    lay.forEach(([y, rr, h], i) => cr.cone(rr, h, T.leaves[i % 3], { y: y + h / 2, ry: r() * 3, jitter: 0.1 }, 8));
  } else if (T.id === 'oak') {
    tr.cyl(0.09, 0.16, 2.2, T.bark, { y: 4.3, x: 0.7, rz: -0.8 }, 6);
    tr.cyl(0.08, 0.15, 2.0, T.bark, { y: 4.5, z: -0.6, rx: -0.75 }, 6);
    const bl = [[0, 6.6, 0, 2.4], [1.5, 6.0, 0.4, 1.8], [-1.3, 6.1, -0.7, 1.9], [0.3, 5.8, 1.5, 1.7], [-0.5, 7.6, 0.6, 1.6], [0.9, 7.2, -1.2, 1.5]];
    bl.forEach(([x, y, z, rr], i) => cr.ico(rr, T.leaves[i % 3], { x, y, z, sy: 0.85, jitter: 0.12 }, 1));
  } else {
    for (let i = 0; i < 7; i++) {
      const y = 0.9 + r() * (T.H - 2), a = r() * 6.28, rr = rAt(y);
      tr.box(0.16, 0.05, 0.05, 0x3a3532, { x: Math.sin(a) * rr, y, z: Math.cos(a) * rr, ry: a + 1.57, jitter: 0.1 });
    }
    const bl = [[0, 7.0, 0, 1.5], [0.7, 6.0, 0.3, 1.2], [-0.6, 6.3, -0.4, 1.15], [0.1, 8.3, 0.2, 1.0]];
    bl.forEach(([x, y, z, rr], i) => cr.ico(rr, T.leaves[i % 3], { x, y, z, sy: 1.35, jitter: 0.12 }, 1));
  }

function sampleKeys(keys, t, fast) {

// ---- Modell ----
function createPlayerModel(index = 0) {
  const n = PLAYER_LOOKS.length;

  const w = L.width;

  const root = new THREE.Group(); root.name = 'player_' + L.name;

  const rollG = grp(root, 0, ROLL_Y, 0);         // Pivot für Ausweichrolle (Körpermitte)

  const arm = {};

    const sh = grp(torso, s * SH_X * w, SH_Y, 0); sh.add(buildUpper(L));
    const el = grp(sh, 0, -UPPER, 0); el.add(buildFore(L));
    const hand = grp(el, 0, -FORE, 0); hand.add(buildHand(L));

  }

  const blade = grp(axe, 0, 0.49, 0.16);        // Schneide (für Hitbox/FX)

  const leg = {};
  for (const [key, s] of [['l', 1], ['r', -1]]) {
    const th = grp(hips, s * 0.1 * w, -0.02, 0); th.add(buildThigh(L));
    const kn = grp(th, 0, -THIGH, 0); kn.add(buildShin(L));
    const ft = grp(kn, 0, -SHIN, 0); ft.add(buildFoot(L));

  // ---- Zustand ----
  const st = {
    t: Math.random() * 10, phase: 0, spd: 0, runF: 0, sprintW: 0, lean: 0, turnLean: 0,
    air: 0, rise: 0, land: 0, landV: 0, cape: 0.1, capeV: 0, lastSpeed: 0, accel: 0,
    headY: 0,

  let action = null, actionT = 0;
  // Pose-Überblendung zwischen Aktionen (Combo-Ketten ohne Springen)
  const POSE_KEYS = ['lsx', 'lsz', 'lel', 'rsx', 'rsz', 'rel', 'wr', 'wy', 'tx', 'ty', 'crouch'];
  const last = {}, from = {}; for (const k of POSE_KEYS) last[k] = from[k] = 0;
  let fadeT = 0; const FADE = 0.12;

  /** 'chop'|'wave'|'attack1'|'attack2'|'attack3'|'roll'|'cast1'|'cast2'|'hurt'|'death' → { duration, impactAt } */
  function playAction(name) {
    const A = ACTIONS[name];
    if (!A) return { duration: 0, impactAt: 0 };
    if (action && action !== 'death') { for (const k of POSE_KEYS) from[k] = last[k]; fadeT = FADE; } else fadeT = 0;
    action = name; actionT = 0;
    return { duration: A.duration, impactAt: A.impactAt };
  }
  function cancelAction() { action = null; actionT = 0; fadeT = 0; }

  // Bein-Pose: Hüfte senkt sich um d -> symmetrischer Knick (Fuß bleibt unter der Hüfte, flach)
  const crouchAngle = d => Math.acos(clamp(1 - d / LEG, -1, 1));

  function animate(dt, s = {}) {
    dt = Math.min(dt || 0, 0.1);
    st.t += dt;
    const speed = Math.max(0, s.speed || 0);
    const maxSpeed = Math.max(0.1, s.maxSpeed || 6);
    const grounded = s.grounded !== false;
    const vy = s.vy || 0, turn = s.turn || 0;

    // --- geglättete Eingangsgrößen ---
    st.accel = damp(st.accel, (speed - st.lastSpeed) / Math.max(dt, 1e-4), 6, dt);
    st.lastSpeed = speed;
    st.spd = damp(st.spd, grounded ? speed : st.spd, 10, dt);
    st.runF = damp(st.runF, smooth(2.2, 4.6, speed), 6, dt);
    st.sprintW = damp(st.sprintW, s.sprint && speed > 1 ? 1 : 0, 5, dt);
    st.lean = damp(st.lean, clamp(speed / maxSpeed, 0, 1.2) + clamp(st.accel * 0.04, -0.3, 0.4), 6, dt);
    st.turnLean = damp(st.turnLean, clamp(turn, -4, 4) * clamp(speed / 3, 0.15, 1.3), 5, dt);
    st.air = damp(st.air, grounded ? 0 : 1, grounded ? 18 : 9, dt);
    st.rise = damp(st.rise, clamp(vy / 4, -1, 1), 7, dt);

    if (s.landImpact > 0) { st.land = Math.max(st.land, clamp(s.landImpact, 0, 1)); st.landV = Math.min(st.landV, 0); }
    st.landV += (-190 * st.land - 17 * st.landV) * dt;
    st.land += st.landV * dt;
    if (Math.abs(st.land) < 1e-4 && Math.abs(st.landV) < 1e-3) st.land = st.landV = 0;

    // --- Schrittphase proportional zur Strecke (kein Fußgleiten) ---
    const cycleLen = clamp(1.05 + 0.32 * speed, 1.1, 3.2);   // m pro Doppelschritt
    if (grounded) st.phase += (speed * dt / cycleLen) * Math.PI * 2;
    else st.phase += dt * 2.0 * (1 - st.air);                // in der Luft einfrieren
    const P = st.phase, sP = Math.sin(P);
    const moveW = smooth(0.05, 0.9, st.spd) * (1 - st.air);
    const runF = st.runF, spr = st.sprintW;

    // --- Pose-Ziel aufbauen ---

    const walkBob = -LEG * (1 - Math.cos(A * sP)) * 0.9;
    const runBob = 0.055 * Math.abs(sP) - 0.06 - 0.03 * spr;
    let crouch = idleW * (0.012 + 0.006 * breath) * (1 - st.air);
    crouch += st.land * 0.32;
    crouch += moveW * runF * 0.03;
    let hipY = moveW * lerp(walkBob, runBob, runF);
    let hipX = idleW * sway * 0.012 + moveW * Math.cos(P) * lerp(0.025, 0.012, runF);

    // Beine

    const legs = {};

      const p = P + off, sp = Math.sin(p), cp = Math.cos(p);

      let kn = (Math.pow(swingPhase, 1.4) * lerp(0.75, 1.75, runF) + Math.max(0, -cp) * lerp(0.05, 0.35, runF) * (sp < 0.3 ? 1 : 0.4)) * moveW;
      kn += spr * moveW * swingPhase * 0.3;
      let ft = (-(th + kn) * Math.max(0, -cp) + swingPhase * 0.35 * (sp < 0 ? 1 : -0.5)) * moveW;
      // Luft: steigend anhocken, fallend strecken (Landung vorbereiten)
      const tuck = smooth(-0.1, 0.8, st.rise), reach = smooth(0.1, -0.9, st.rise);
      const airTh = -0.95 * tuck - 0.3 * reach + (key === 'l' ? -0.18 : 0.12) * tuck;
      const airKn = 1.55 * tuck + 0.18 * reach + (key === 'l' ? 0.2 : -0.1) * tuck;
      const airFt = -0.25 * tuck + 0.25 * reach;
      th = lerp(th, airTh, st.air); kn = lerp(kn, airKn, st.air); ft = lerp(ft, airFt, st.air);
      legs[key] = { th: th - base, kn: kn + 2 * base, ft: ft - base, z: (key === 'l' ? 1 : -1) * idleW * 0.03 };
    }

    // Oberkörper
    const lean = st.lean;
    let torsoX = lean * (0.1 + 0.12 * runF) + spr * 0.14 + breath * 0.015 * idleW + st.land * 0.45 + st.air * (-0.08 * st.rise + 0.05);
    let torsoY = moveW * sP * lerp(0.2, 0.32, runF);
    let torsoZ = idleW * sway * -0.02;
    let hipsY = -moveW * sP * lerp(0.1, 0.16, runF);
    let hipsZ = moveW * Math.cos(P) * 0.04 * (1 - runF);
    let bodyX = lean * 0.06 + spr * 0.06;
    let bodyZ = -st.turnLean * lerp(0.05, 0.08, runF);

    // Arme (gegengleich)
    const armA = lerp(0.35, 0.9, runF) + 0.25 * spr;
    const elB = lerp(-0.22, -1.45, runF) - 0.1 * spr;
    const tuck = smooth(-0.1, 0.8, st.rise), reach = smooth(0.1, -0.9, st.rise);
    const arms = {
      l: { sx: sP * armA * moveW + idleW * (0.05 + breath * 0.02), sz: 0.1 + idleW * breath * 0.015, el: elB * moveW - 0.18 * idleW + Math.max(0, -sP) * -0.25 * moveW, wr: 0 },
      r: { sx: -sP * armA * moveW + idleW * (-0.05 - breath * 0.02), sz: -0.1 - idleW * breath * 0.015, el: elB * moveW - 0.3 * idleW + Math.max(0, sP) * -0.25 * moveW, wr: Math.PI / 2 - 0.15 },
    };
    for (const k of ['l', 'r']) {
      const sg = k === 'l' ? 1 : -1, a = arms[k];
      const airSx = -1.3 * tuck - 0.25 * reach, airSz = sg * (0.35 * tuck + 1.05 * reach), airEl = -0.7 * tuck - 0.2 * reach;
      a.sx = lerp(a.sx, airSx, st.air); a.sz = lerp(a.sz, airSz, st.air); a.el = lerp(a.el, airEl, st.air);
      a.sx = lerp(a.sx, -0.35, st.land); a.sz += sg * st.land * 0.5;      // Landung: Arme fangen ab
    }

    // --- Aktions-Layer (nur Oberkörper, überlagert Locomotion; Rolle/Tod = ganzer Körper) ---
    let neckJerk = 0, deathX = 0;
    let actW = 0, rollA = 0, tuckW = 0, deathW = 0, deathLift = 0;
    if (action) actionT += dt;
    const AC = action ? ACTIONS[action] : null;

      const legW = 1 - moveW;

      arms.r.el = lerp(arms.r.el, k.rel, actW); arms.r.wr = lerp(arms.r.wr, k.wr, actW); arms.r.wy = lerp(0, k.wy, actW);
      arms.l.sx = lerp(arms.l.sx, k.lsx, actW); arms.l.sz = lerp(arms.l.sz, k.lsz, actW); arms.l.el = lerp(arms.l.el, k.lel, actW);
      torsoX += k.tx * actW; torsoY = lerp(torsoY, k.ty, actW * 0.85);

    } else if (action === 'wave') {

// Rig-Parameter: pivotY = Hinterhüft-Höhe, zF/zB Hüft-z, stride = m pro Gangzyklus (Schritt), gait, sitMode.
const CFG = {
  fox:      { pivotY: 0.25, zF: 0.16, zB: -0.16, stride: 0.5,  gait: 'quad',   sit: 'quad',  eatA: 0.75, radius: 0.22, height: 0.62, wag: 5, tailLift: 0.4 },
  rabbit:   { pivotY: 0.12, zF: 0.08, zB: -0.1,  stride: 0.32, gait: 'hop',    sit: 'upright', eatA: 0.6, radius: 0.15, height: 0.5, hopH: 0.12, wag: 14 },
  deer:     { pivotY: 0.68, zF: 0.3,  zB: -0.3,  stride: 1.1,  gait: 'quad',   sit: 'quad',  eatA: 1.35, radius: 0.4, height: 1.5, wag: 10 },
  boar:     { pivotY: 0.27, zF: 0.22, zB: -0.22, stride: 0.55, gait: 'quad',   sit: 'quad',  eatA: 0.55, radius: 0.38, height: 0.8, wag: 12 },
  sheep:    { pivotY: 0.33, zF: 0.2,  zB: -0.2,  stride: 0.55, gait: 'quad',   sit: 'quad',  eatA: 0.9, radius: 0.38, height: 0.95, wag: 9 },
  duck:     { pivotY: 0.11, zF: 0.0,  zB: 0.0,   stride: 0.16, gait: 'waddle', sit: 'squat', eatA: 0.9, radius: 0.15, height: 0.45, wag: 16 },
  hedgehog: { pivotY: 0.055, zF: 0.07, zB: -0.07, stride: 0.12, gait: 'quad',  sit: 'squat', eatA: 0.5, radius: 0.15, height: 0.25, wag: 8 },
  bear:     { pivotY: 0.55, zF: 0.36, zB: -0.36, stride: 1.2,  gait: 'amble',  sit: 'quad',  eatA: 0.6, radius: 0.6, height: 1.45, wag: 6 },
  frog:     { pivotY: 0.07, zF: 0.06, zB: -0.06, stride: 0.3,  gait: 'frog',   sit: 'none',  eatA: 0.25, radius: 0.1, height: 0.18, hopH: 0.14 },
  squirrel: { pivotY: 0.09, zF: 0.06, zB: -0.07, stride: 0.3,  gait: 'hop',    sit: 'upright', eatA: 0.4, radius: 0.1, height: 0.42, hopH: 0.09, wag: 7 },
};

// ---------------------------------------------------------------- Factory
function createAnimal(type, seed = 1) {
  if (!BUILD[type]) throw new Error('Unbekanntes Tier: ' + type);
  const cfg = CFG[type], info = ANIMAL_INFO[type];
  const R = new Rig(seed, cfg);
  const extra = BUILD[type](R) || {};
  const scale = 1 + (R.r() - 0.5) * 0.16;
  R.scaler.scale.setScalar(scale);
  R.root.name = 'animal:' + type;
  R.root.userData.animal = type;

  // Sitz-Geometrie vorberechnen
  const d = Math.max(0.01, cfg.zF - cfg.zB), hy = cfg.pivotY;
  let drop = hy * 0.5, theta = Math.asin(Math.min(0.85, drop / d)), phi = Math.acos(clamp((hy - drop) / hy, -1, 1));
  if (cfg.sit === 'upright') { drop = hy * 0.35; theta = 1.0; phi = Math.acos(0.65); }

  const rnd = rng((seed * 7919 + 3) >>> 0);
  const st = { t: rnd() * 10, phase: rnd() * TAU, amp: 0, run: 0, sit: 0, eat: 0, air: 0, lookY: 0, lookT: 2 + rnd() * 3,
    lookTarget: 0, wagT: 2 + rnd() * 4, wagEnv: 0, earT: 1 + rnd() * 3, turn: 0 };
  const { rig, body, breath, head, tail, legs, ears, wings } = R;
  const headRest = head ? head.rotation.x : 0;

  function animate(dt, s = {}) {
    dt = Math.min(dt || 0, 0.1);
    const spd = Math.abs(s.speed || 0), turn = s.turn || 0, grounded = s.grounded !== false;
    st.t += dt; const t = st.t;
    st.amp = damp(st.amp, clamp(spd / (info.walk * 0.5), 0, 1), 8, dt);
    st.run = damp(st.run, clamp((spd - info.walk) / (info.run - info.walk), 0, 1), 5, dt);
    st.sit = damp(st.sit, s.action === 'sit' && spd < 0.2 ? 1 : 0, 4, dt);
    st.eat = damp(st.eat, s.action === 'eat' && spd < 0.4 ? 1 : 0, 5, dt);
    st.air = damp(st.air, grounded ? 0 : 1, 10, dt);
    st.turn = damp(st.turn, turn, 6, dt);
    const stride = cfg.stride * scale * (1 + st.run * 1.1);
    st.phase = (st.phase + dt * spd / stride * TAU) % (TAU * 8);
    const ph = st.phase, amp = st.amp * (1 - st.sit), run = st.run, sit = st.sit;

    let y = 0, pitch = 0, roll = 0, yaw = 0, nod = 0;
    const A = lerp(0.4, 0.8, run) * amp;
    const hopping = cfg.gait === 'hop' || cfg.gait === 'frog';
    for (const L of legs) { L.h = L.restHip; L.k = L.restKnee; }

    if (cfg.gait === 'quad' || cfg.gait === 'amble') {
      for (const L of legs) {
        const walkOff = (L.side > 0 ? (L.front ? 0.25 : 0) : (L.front ? 0.75 : 0.5)) * TAU;
        const trotOff = cfg.gait === 'amble' ? (L.side > 0 ? 0 : Math.PI) + (L.front ? 0.6 : 0)
                                              : (L.front ? 0 : Math.PI) + (L.side > 0 ? 0 : Math.PI);
        const off = lerp(walkOff, trotOff, run), p = ph + off;
        L.h += Math.sin(p) * A;
        L.k += Math.max(0, -Math.cos(p)) * A * 1.4;
      }
      y += (0.5 - 0.5 * Math.cos(2 * ph)) * hy * 0.06 * amp * (1 + run);
      pitch += Math.sin(2 * ph) * 0.025 * amp;
      if (cfg.gait === 'amble') roll += Math.sin(ph) * 0.06 * amp;
      nod = Math.sin(2 * ph + 0.6) * 0.06 * amp;
    } else if (cfg.gait === 'waddle') {
      for (const L of legs) {
        const p = ph + (L.side > 0 ? 0 : Math.PI);
        L.h += Math.sin(p) * 0.7 * amp; L.k += Math.max(0, -Math.cos(p)) * 0.8 * amp;
      }
      roll += Math.sin(ph) * 0.2 * amp; yaw += Math.sin(ph) * 0.12 * amp;
      y += Math.abs(Math.cos(ph)) * hy * 0.12 * amp;
      nod = Math.sin(2 * ph) * 0.15 * amp;
    } else if (cfg.gait === 'hop') {
      const s1 = Math.sin(ph), air = Math.max(0, s1), lift = amp;
      y += air * cfg.hopH * scale * lift * (1 + run * 0.6);
      pitch += -Math.cos(ph) * 0.22 * lift;
      for (const L of legs) {
        if (L.front) { L.h += -s1 * 0.9 * lift; L.k += Math.max(0, s1) * 0.4 * lift; }
        else { const q = Math.sin(ph - 0.5); L.h += q * 1.0 * lift; L.k += Math.max(0, -q) * 1.3 * lift; }
      }
      nod = Math.cos(ph) * 0.15 * lift;
    } else if (cfg.gait === 'frog') {
      const s1 = Math.sin(ph), air = Math.max(0, s1), lift = amp;
      y += air * cfg.hopH * scale * lift * (1 + run * 0.6);
      pitch += -Math.cos(ph) * 0.3 * lift;
      for (const L of legs) {
        if (L.front) L.h += -air * 0.8 * lift;
        else { L.h += air * 1.6 * lift; L.k -= air * 2.0 * lift; }
      }
    }

    // In der Luft (Sprung/Fall)
    if (!hopping) for (const L of legs) L.h += (L.front ? -0.5 : 0.6) * st.air;

    // Sitzen
    if (cfg.sit === 'quad' || cfg.sit === 'upright') {
      y -= drop * sit; pitch -= theta * sit;
      for (const L of legs) {
        if (L.front) L.h += (cfg.sit === 'upright' ? -0.6 : theta) * sit, L.k += (cfg.sit === 'upright' ? 0.8 : 0) * sit;
        else { L.h += (theta - phi) * sit; L.k += 2 * phi * sit; }
      }
    } else if (cfg.sit === 'squat') {
      y -= hy * 0.75 * sit;
      for (const L of legs) { L.h += -1.1 * sit; L.k += 2.2 * sit; }
    }

    // Fressen: Körper vorn leicht runter
    pitch += 0.08 * st.eat;

    // Idle: Atmen + Umschauen
    const idle = 1 - st.amp;
    const br = Math.sin(t * (2.2 + run * 3)) * (0.6 * idle + 0.4);
    breath.scale.set(1 + br * 0.012, 1 + br * 0.02, 1 + br * 0.006);
    st.lookT -= dt;
    if (st.lookT < 0) { st.lookT = 2 + rnd() * 4; st.lookTarget = idle > 0.7 && st.eat < 0.5 && rnd() < 0.6 ? (rnd() - 0.5) * 1.0 : 0; }

let arenaPts = [], kills = 0, bossErr = false;
function findArenas() {
  const sp = world.spawnPoints?.length ? world.spawnPoints : [new THREE.Vector3()];
  const cx = sp.reduce((s, p) => s + p.x, 0) / sp.length, cz = sp.reduce((s, p) => s + p.z, 0) / sp.length;
  const r = rng(seed * 7 + 11), out = [];
  const trees = world.trees || [];
  for (const strict of [1, 0.6, 0.3, 0]) {
    for (let tries = 0; tries < 1500 && out.length < 3; tries++) {
      const a = r() * Math.PI * 2, d = 60 + r() * 90, x = cx + Math.cos(a) * d, z = cz + Math.sin(a) * d;
      if (Math.hypot(x, z) > (world.radius || 200) - 18) continue;
      const h = world.heightAt(x, z);
      if (h < 2) continue;
      let ok = true;
      for (let k = 0; k < 10 && ok; k++) {
        const b = k / 10 * Math.PI * 2, hh = world.heightAt(x + Math.cos(b) * 10, z + Math.sin(b) * 10);
        if (hh < 1.2 || Math.abs(hh - h) > 2.2 + (1 - strict) * 4) ok = false;
      }
      if (!ok) continue;
      if (strict > 0.5 && trees.filter(t => t.state === 0 && (t.x - x) ** 2 + (t.z - z) ** 2 < 81).length > 2) continue;
      if (out.some(o => Math.hypot(o.x - x, o.z - z) < 85 * strict + 25)) continue;
      out.push(new THREE.Vector3(x, h, z));
    }
  }
  while (out.length < 3) out.push(new THREE.Vector3(cx + 70 * Math.cos(out.length * 2.1), 0, cz + 70 * Math.sin(out.length * 2.1)));
  return out;
}
function buildArenaMarkers(pts) {
  // kleiner Steinkreis mit Glutschalen, damit man die Arena von weitem sieht
  for (const p of pts) {
    const b = new MeshBuilder();
    for (let k = 0; k < 7; k++) {
      const a = k / 7 * Math.PI * 2 + 0.3, x = Math.cos(a) * 14, z = Math.sin(a) * 14;
      const y = world.heightAt(p.x + x, p.z + z) - p.y;
      b.box(0.9, 2.4 + (k % 3) * 0.5, 0.7, 0x8a8f96, { x, y: y + 1.0, z, ry: a, rz: (k % 2 - 0.5) * 0.12 });
      b.box(1.0, 0.25, 0.8, 0x6a7078, { x, y: y + 2.3 + (k % 3) * 0.5, z, ry: a });
      if (k % 2 === 0) b.cone(0.22, 0.4, 0xff9a3a, { x, y: y + 2.65 + (k % 3) * 0.5, z }, 5);
    }
    const m = b.mesh(); m.position.copy(p); scene.add(m);
  }
}
function spawnBoss(type, home, summoned, yaw) {
  if (!BOSS) return null;
  try {
    const b = BOSS.createBoss(type, { scene, world, combat, home: home.clone(), yaw });
    const e = { type, home: home.clone(), b, summoned, deadT: -1 };
    bosses.push(e);
    return e;
  } catch (err) { console.error(err); showError('Boss ' + type + ': ' + err.message); return null; }
}
function disposeBoss(e) { try { e.b.dispose(); } catch (err) { console.error(err); } combat.removeActor(e.b.actor); const k = bosses.indexOf(e); if (k >= 0) bosses.splice(k, 1); }
function initBosses() {
  if (!arenaPts.length) { arenaPts = findArenas(); buildArenaMarkers(arenaPts); }

function resetBosses() { while (bosses.length) disposeBoss(bosses[0]); initBosses(); }
function summonBoss(type) {
  const p = players[0], f = p.ctrl.forward(new THREE.Vector3());
  const home = p.ctrl.pos.clone().addScaledVector(f, 15); home.y = world.heightAt(home.x, home.z);
  // gleicher Typ darf nur einmal gerufen existieren
  for (const e of [...bosses]) if (e.summoned && e.type === type) disposeBoss(e);
  return spawnBoss(type, home, true, Math.atan2(p.ctrl.pos.x - home.x, p.ctrl.pos.z - home.z));
}
const bossDead = e => e.b.actor.hp <= 0 || e.b.actor.alive === false;
function updateBosses(dt, plist) {
  for (const e of [...bosses]) {
    try { e.b.update(dt, plist); } catch (err) { if (!bossErr) { bossErr = true; console.error(err); showError('Boss-Update: ' + err.message); } }

    }
  }
}

let W = 1, H = 1;
function views() {

  const vertical = SETTINGS.split === 'vertical' || (SETTINGS.split === 'auto' && W >= H);
  return vertical
    ? [{ x: 0, y: 0, w: Math.floor(W / 2), h: H }, { x: Math.floor(W / 2), y: 0, w: W - Math.floor(W / 2), h: H }]
    : [{ x: 0, y: Math.floor(H / 2), w: W, h: H - Math.floor(H / 2) }, { x: 0, y: 0, w: W, h: Math.floor(H / 2) }];
}
function resize() {
  const s = SETTINGS.pixelScale;
  renderer.setPixelRatio(1);
  W = Math.max(2, Math.floor(innerWidth * s)); H = Math.max(2, Math.floor(innerHeight * s));
  renderer.setSize(W, H, false);
  canvas.style.width = innerWidth + 'px'; canvas.style.height = innerHeight + 'px';
  document.body.classList.toggle('solo', SETTINGS.players === 1);
  const vertical = SETTINGS.split === 'vertical' || (SETTINGS.split === 'auto' && innerWidth >= innerHeight);
  document.body.classList.toggle('hsplit', !vertical);
  // HUD-Container deckungsgleich mit den Viewports (CSS-Pixel; WebGL-y zählt von unten)
  const kx = innerWidth / W, ky = innerHeight / H;
  views().forEach((v, k) => {
    const r = ui[k].rect; r.x = v.x * kx; r.w = v.w * kx; r.h = v.h * ky; r.y = (H - v.y - v.h) * ky;
    Object.assign(viewEls[k].style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px', display: '' });
  });
  if (SETTINGS.players === 1) viewEls[1].style.display = 'none';
}

// Spieler gegen Gegner-Kapseln (Bosse) – nicht in den Boss hineinlaufen/-rollen
function separateFromEnemies(active) {
  for (const p of active) {
    const c = p.ctrl;
    for (const a of combat.actors) {
      if (a.team === 'player' || a.alive === false || a.hp <= 0) continue;
      if (c.pos.y > a.pos.y + a.height || c.pos.y + c.height < a.pos.y) continue;
      const dx = c.pos.x - a.pos.x, dz = c.pos.z - a.pos.z, d = Math.hypot(dx, dz), min = c.radius + a.radius * 0.9;
      if (d < min) { const nx = d > 1e-4 ? dx / d : 1, nz = d > 1e-4 ? dz / d : 0; c.pos.x = a.pos.x + nx * min; c.pos.z = a.pos.z + nz * min; }
    }
  }
}
// Spieler gegeneinander
function separatePlayers() {
  if (SETTINGS.players < 2) return;
  const a = players[0].ctrl, b = players[1].ctrl;
  const dx = b.pos.x - a.pos.x, dz = b.pos.z - a.pos.z, d = Math.hypot(dx, dz), min = a.radius + b.radius;
  if (d < min && d > 1e-4 && Math.abs(a.pos.y - b.pos.y) < 1.6) {
    const push = (min - d) / 2, nx = dx / d, nz = dz / d;
    a.pos.x -= nx * push; a.pos.z -= nz * push; b.pos.x += nx * push; b.pos.z += nz * push;
  }
}

// ---------- Demo (?demo): automatische Eingaben zum Testen ----------
let demoT = 0, demoBoss = null, demoT0 = 0, demoPrev = 0;
function demoIntent(p, o) {
  if (p.i === 0) {
    const f = p.fighter;
    if (!demoBoss && BOSS && demoT > 0.8) { demoBoss = summonBoss(BOSS.BOSS_TYPES[0]); demoT0 = demoT; }
    if (!demoBoss || bossDead(demoBoss)) {
      if (demoBoss && demoBoss.deadT > 3) demoBoss = null;   // neuen rufen
      return;
    }
    const a = demoBoss.b.actor;
    if (!f.lock && f.state !== 'dead') o.lockPressed = true;
    const ph = (demoT - demoT0) % 8, prev = demoPrev; demoPrev = ph;
    const cross = x => (prev < x && ph >= x) || (prev > ph && x < ph);   // Zeitmarke überschritten
    const d = Math.hypot(a.pos.x - p.pos.x, a.pos.z - p.pos.z) - a.radius;
    if (ph < 3.4) {
      if (d > 1.4) { o.moveY = 1; o.sprint = d > 8; }
      else if ((demoT * 4 | 0) !== ((demoT - 0.05) * 4 | 0)) o.chopPressed = true;
    } else if (ph < 4.4) { if (cross(3.5)) { o.rollPressed = true; o.moveX = 1; } if (cross(4.0)) { o.rollPressed = true; o.moveY = -1; } }
    else if (ph < 5.6) { o.moveY = d < 7 ? -1 : 0; if (cross(5.2)) o.spell1Pressed = true; }
    else { if (d > 2.5) o.moveY = 1; if (cross(6.6)) o.spell2Pressed = true; if (cross(7.4)) { o.rollPressed = true; o.moveX = -1; } }
  } else {
    o.moveY = 1; o.moveX = Math.sin(demoT * 0.7) * 0.6;
    o.jump = (demoT % 1.6) < 0.4; o.jumpPressed = (demoT % 1.6) < 0.06;
  }
}

// ---------- Loop ----------
const _pv = new THREE.Vector3();
let last = performance.now(), fpsAcc = 0, fpsN = 0, fpsShow = 0, frameN = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let el = Math.max(0, (now - last) / 1000); last = now;
  if (el <= 0) return;
  frameN++;
  fpsAcc += el; fpsN++;
  if (fpsAcc > 0.5) { fpsShow = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0; }
  // Demo: bei sehr niedriger Framerate (Headless-Test) mehrere Simulationsschritte pro Bild nachholen
  el = Math.min(el, DEMO ? 4 : 0.05);
  while (el > 1e-4) { const dt = Math.min(0.05, el); el -= dt; simulate(dt); }
  render();
}
function simulate(dt) {
  PSX.uniforms.uTime.value += dt; demoT += dt;
  const gdt = combat.stopT > 0 ? 0 : dt;        // Hitstop friert die Spielwelt kurz ein

  const active = players.slice(0, SETTINGS.players);
  const menuOpen = menu.classList.contains('open');
  let menuReq = false;
  for (const p of players) p.fighter.actor.alive = active.includes(p) && p.fighter.state !== 'dead';
  for (const p of active) {
    const intent = input.read(p.i, dt);
    if (intent.menuPressed) menuReq = true;
    if (menuOpen) {
      intent.moveX = intent.moveY = intent.lookX = intent.lookY = 0;
      intent.jumpPressed = intent.chopPressed = intent.jump = intent.rollPressed = intent.spell1Pressed = intent.spell2Pressed = intent.lockPressed = false;
      intent.switchTarget = 0;
    }
    if (DEMO) demoIntent(p, intent);
    p.intent = intent;
    if (intent.wavePressed && !p.model.actionActive && !p.fighter.busy) p.model.playAction('wave');

    if (gdt > 0) {
      const mul = p.fighter.update(gdt, intent, p.cam.yaw);
      const steps = gdt > 1 / 55 ? 2 : 1;
      for (let s = 0; s < steps; s++) p.ctrl.update(gdt / steps, intent, p.cam.yaw, mul);
      if (p.ctrl.landImpact > 0.25) { p.cam.kick(p.ctrl.landImpact * 0.8); input.rumble(p.i, p.ctrl.landImpact * 0.5, 70); }
    } else {
      // während Hitstop Eingaben puffern
      const f = p.fighter;
      if (intent.chopPressed) f.bufAtk = FIGHT.buffer; if (intent.rollPressed) f.bufRoll = FIGHT.buffer;
      if (intent.spell1Pressed) f.bufS1 = FIGHT.buffer; if (intent.spell2Pressed) f.bufS2 = FIGHT.buffer;
    }

    const m = p.model;
    m.object3D.position.copy(p.ctrl.pos);
    m.object3D.rotation.y = p.ctrl.yaw;
    m.animate(gdt, {
      speed: p.ctrl.speed, maxSpeed: TUNING.runSpeed, grounded: p.ctrl.grounded || p.ctrl.swimming, vy: p.ctrl.vel.y,
      turn: p.ctrl.turn, landImpact: p.ctrl.landImpact, sprint: p.ctrl.sprint, swimming: p.ctrl.swimming,
    });
    p.cam.update(dt, p.ctrl, intent, world);
  }
  // Inaktiver P2 wird versteckt
  players[1].model.object3D.visible = SETTINGS.players === 2;
  separatePlayers();
  separateFromEnemies(active);
  input.endFrame();
  if (menuReq) toggleMenu();

  world.update(gdt, active.map(p => ({ pos: p.ctrl.pos, vel: p.ctrl.vel })));
  if (fauna) fauna.update(gdt, active.map(p => ({ pos: p.ctrl.pos, speed: p.ctrl.speed })));
  if (gdt > 0) updateBosses(gdt, active.map(p => ({ actor: p.fighter.actor, pos: p.ctrl.pos, alive: p.fighter.state !== 'dead' })));
  combat.update(dt);
  // Kamera-Shake-Anfragen aus dem Kampf verteilen
  for (const s of combat.shakes) for (const p of active) {
    let d = 0;
    if (!Number.isNaN(s.x)) d = Math.hypot(s.x - p.pos.x, s.z - p.pos.z);
    else { d = 1e9; for (const a of combat.actors) if (a.team !== 'player') d = Math.min(d, Math.hypot(a.pos.x - p.pos.x, a.pos.z - p.pos.z)); if (d > 1e8) d = 0; }
    const a = s.amount * clamp(1 - d / 35, 0, 1);
    if (a > 0.02) p.cam.kick(a);
  }
  combat.shakes.length = 0;
}
function render() {
  const active = players.slice(0, SETTINGS.players);
  // Rendern pro Viewport; Sonne/Schatten folgt dem jeweiligen Spieler
  const vs = views();
  vs.forEach((v, idx) => {
    const p = active[idx];
    p.cam.cam.aspect = v.w / v.h; p.cam.cam.updateProjectionMatrix();
    if (sun) {
      sun.target.position.copy(p.ctrl.pos);
      sun.position.copy(p.ctrl.pos).add(sunOffset);
      sun.target.updateMatrixWorld();
      sun.shadow.needsUpdate = true;
    }
    renderer.setViewport(v.x, v.y, v.w, v.h);
    renderer.setScissor(v.x, v.y, v.w, v.h);
    renderer.render(scene, p.cam.cam);
  });

  // HUD
  const st = world.stats ? world.stats() : {};
  fpsEl.textContent = `${fpsShow} fps · 🪵 ${st.wood ?? 0} · 🌲 ${st.trees ?? '?'} · Logs ${st.logs ?? 0} · 💀 ${kills}`;
  active.forEach((p, idx) => updateHud(p, idx, 1 / 60));
}

function setBar(el, v, max) { const w = (clamp(v / max, 0, 1) * 100).toFixed(1) + '%'; if (el.style.width !== w) el.style.width = w; }
function updateHud(p, idx, dt) {
  const c = p.ctrl, f = p.fighter, u = ui[idx];
  let t = `<b>P${p.i + 1}</b> <small>${input.lastDevice[p.i]}</small>`;
  if (SETTINGS.debug) t += `<br><small>v ${c.speed.toFixed(2)} · vy ${c.vel.y.toFixed(2)} · ${c.swimming ? 'schwimmt' : c.grounded ? 'Boden' : 'Luft ' + c.airTime.toFixed(2) + 's'} · ${f.state}<br>x ${c.pos.x.toFixed(1)} y ${c.pos.y.toFixed(2)} z ${c.pos.z.toFixed(1)}</small>`;
  if (hudEls[idx].innerHTML !== t) hudEls[idx].innerHTML = t;
  setBar(u.hp, f.hp, FIGHT.maxHp); setBar(u.sta, f.sta, FIGHT.maxSta); setBar(u.mana, f.mana, FIGHT.maxMana);
  u.hpT.textContent = Math.ceil(f.hp);
  u.sta.parentElement.classList.toggle('ex', f.exhausted);
  const pad = input.lastDevice[p.i] === 'Gamepad';
  u.s1k.textContent = pad ? 'RB' : p.i === 0 ? '1' : '7';
  u.s2k.textContent = pad ? 'Y' : p.i === 0 ? '2' : '8';
  u.s1c.style.height = (f.cd1 / FIGHT.spell1.cd * 100).toFixed(0) + '%';
  u.s2c.style.height = (f.cd2 / FIGHT.spell2.cd * 100).toFixed(0) + '%';
  u.s1.classList.toggle('nomana', f.mana < FIGHT.spell1.mana);
  u.s2.classList.toggle('nomana', f.mana < FIGHT.spell2.mana);
  u.flash.style.opacity = (f.flash * 0.9).toFixed(2);
  u.dead.style.display = f.state === 'dead' ? '' : 'none';
  if (f.state === 'dead') u.dead.textContent = `Du bist gefallen … ${Math.max(0, FIGHT.respawn - f.deadT).toFixed(1)}`;
  // Lock-On-Markierung
  if (f.lock) {
    _pv.copy(f.lockPoint).project(p.cam.cam);
    const vis = _pv.z < 1 && Math.abs(_pv.x) < 1.1 && Math.abs(_pv.y) < 1.1;
    u.lock.style.display = vis ? '' : 'none';
    if (vis) u.lock.style.transform = `translate(${((_pv.x + 1) / 2 * u.rect.w).toFixed(0)}px, ${((1 - _pv.y) / 2 * u.rect.h).toFixed(0)}px)`;
  } else u.lock.style.display = 'none';
  // Boss-Leiste: gesperrter Boss oder nächster wacher Boss in der Nähe
  let e = bosses.find(b => b.b.actor === f.lock && !bossDead(b)) || null;
  if (!e) {
    let bd = 50;
    for (const b of bosses) {
      if (!b.b.awake || bossDead(b)) continue;
      const d = Math.hypot(b.b.actor.pos.x - c.pos.x, b.b.actor.pos.z - c.pos.z);
      if (d < bd) { bd = d; e = b; }
    }
  }
  u.boss.style.display = e ? '' : 'none';
  if (e) {
    const I = BOSS.BOSS_INFO[e.type] || {}, a = e.b.actor;
    const txt = `<b>${I.name || a.name || e.type}</b> <small>${I.title || a.title || ''}</small>${e.b.phase === 2 ? ' <em>Phase 2</em>' : ''}`;
    if (u.bn.innerHTML !== txt) u.bn.innerHTML = txt;
    const frac = clamp(a.hp / (a.maxHp || I.hp || 1), 0, 1);
    u.bossLag = Math.max(frac, u.bossLag - dt * 0.35);
    u.bhp.style.width = (frac * 100).toFixed(1) + '%';
    u.bhpL.style.width = (u.bossLag * 100).toFixed(1) + '%';
    u.bstg.style.width = (clamp(a.stagger || 0, 0, 1) * 100).toFixed(0) + '%';
  } else u.bossLag = 1;
}
if (BOSS && !bosses.length) initBosses();
requestAnimationFrame(frame);
window.__viniland = { world, players, fauna, combat, bosses, TUNING, CAM_TUNING, FIGHT, SETTINGS, summonBoss, resetBosses };
if (params.has('dbg')) setInterval(() => {
  const el = document.getElementById('err'); el.style.display = 'block';
  el.textContent = players.map(p => `P${p.i + 1} ${p.model.look?.name} ${p.fighter.state} hp ${p.fighter.hp.toFixed(0)} sta ${p.fighter.sta.toFixed(0)} mana ${p.fighter.mana.toFixed(0)} lock ${p.fighter.lock?.name ?? '-'} pos ${p.ctrl.pos.toArray().map(n => n.toFixed(1))}`).join('\n') +
    '\n' + bosses.map(e => `${e.type}${e.summoned ? '*' : ''} hp ${e.b.actor.hp.toFixed(0)}/${e.b.actor.maxHp} ${e.b.awake ? 'wach' : 'schläft'} P${e.b.phase} @ ${e.b.actor.pos.x.toFixed(0)},${e.b.actor.pos.z.toFixed(0)}`).join(' · ') +
    `\nArenen: ${arenaPts.map(a => a.x.toFixed(0) + ',' + a.z.toFixed(0)).join(' | ')} · Kills ${kills} · Frames ${frameN} demoT ${demoT.toFixed(1)} · Hitboxen ${combat.hitboxes.length} · Projektile ${combat.projectiles.length}`;
}, 250);

return {  };
})();

</script>
