<script type="module">
import * as THREE from 'three';
// ===== psx.js =====
const __m_psx = (() => {
// PSX/PS2-Look: Vertex-Snapping, Farb-Quantisierung mit Bayer-Dithering, Lambert-Flat-Shading.
// Jedes Modul nutzt psxMat() für seine Materialien, damit der Look global steuerbar ist.

const PSX = {
  uniforms: {
    uSnap: { value: 220.0 },     // Raster der Vertex-Snapping (kleiner = wackeliger). 0 = aus
    uDither: { value: 1.0 },     // 1 = Dithering + Farbtiefe 5 Bit, 0 = aus
    uTime: { value: 0.0 },
    // Farb-Grading (global, wird von world.applyAtmosphere pro Ansicht gesetzt)
    uGrade: { value: new THREE.Vector4(1, 1, 0, 1) },   // x = contrast, y = saturation, z = vignette, w = exposure
    uTint: { value: new THREE.Color(1, 1, 1) },
    uView: { value: new THREE.Vector4(0, 0, 1, 1) },    // aktueller Viewport in Pixeln (für Vignette pro Splitscreen-Ansicht)
  },
};

/** Farb-Grading setzen: { contrast=1, saturation=1, tint=0xffffff|Color, vignette=0, exposure=1 } – nur übergebene Felder. */
function setGrade({ contrast, saturation, tint, vignette, exposure } = {}) {
  const g = PSX.uniforms.uGrade.value;
  if (contrast !== undefined) g.x = contrast;
  if (saturation !== undefined) g.y = saturation;
  if (vignette !== undefined) g.z = vignette;
  if (exposure !== undefined) g.w = exposure;
  if (tint !== undefined) { if (tint.isColor) PSX.uniforms.uTint.value.copy(tint); else PSX.uniforms.uTint.value.setHex(tint, THREE.LinearSRGBColorSpace); } // Werte im Ausgabe-Raum (sRGB), keine Konvertierung
}

/** Hängt an scene.onBeforeRender, damit die Vignette jeder Splitscreen-Ansicht zentriert ist. */
const _vp = new THREE.Vector4();
function trackViewport(scene) {
  const prev = scene.onBeforeRender;
  scene.onBeforeRender = (renderer, sc, cam, rt) => {
    if (prev) prev(renderer, sc, cam, rt);
    if (rt) PSX.uniforms.uView.value.set(0, 0, rt.width, rt.height);
    else { renderer.getCurrentViewport(_vp); PSX.uniforms.uView.value.copy(_vp); }
  };
}

function setPSX({ snap, dither } = {}) {
  if (snap !== undefined) PSX.uniforms.uSnap.value = snap;
  if (dither !== undefined) PSX.uniforms.uDither.value = dither ? 1 : 0;
}

const SNAP_VERT = /* glsl */`
  #include <project_vertex>
  if (uSnap > 0.0) {
    vec4 snapPos = gl_Position;
    snapPos.xyz /= snapPos.w;
    snapPos.xy = floor(snapPos.xy * uSnap + 0.5) / uSnap;
    snapPos.xyz *= snapPos.w;
    gl_Position = snapPos;
  }
`;

const DITHER_FRAG = /* glsl */`
  #include <dithering_fragment>
  {
    vec3 gc = gl_FragColor.rgb * uGrade.w;
    float gl = dot(gc, vec3(0.299, 0.587, 0.114));
    gc = mix(vec3(gl), gc, uGrade.y);
    gc = (gc - 0.5) * uGrade.x + 0.5;
    gc *= uTint;
    vec2 vq = (gl_FragCoord.xy - uView.xy) / max(uView.zw, vec2(1.0)) - 0.5;
    vq.x *= uView.z / max(uView.w, 1.0);
    gc *= 1.0 - uGrade.z * smoothstep(0.3, 0.95, length(vq));
    gl_FragColor.rgb = clamp(gc, 0.0, 1.0);
  }
  if (uDither > 0.5) {
    int bx = int(mod(gl_FragCoord.x, 4.0));
    int by = int(mod(gl_FragCoord.y, 4.0));
    float bayer[16] = float[16](0.,8.,2.,10.,12.,4.,14.,6.,3.,11.,1.,9.,15.,7.,13.,5.);
    float d = (bayer[by * 4 + bx] / 16.0 - 0.5) / 31.0;
    gl_FragColor.rgb = floor((gl_FragColor.rgb + d) * 31.0 + 0.5) / 31.0;
  }
`;

/** Patcht ein beliebiges three.js-Material mit dem PSX-Look. Gibt das Material zurück. */
function patchPSX(material) {
  const prev = material.onBeforeCompile;
  material.onBeforeCompile = (shader, renderer) => {
    if (prev) prev(shader, renderer);
    shader.uniforms.uSnap = PSX.uniforms.uSnap;
    shader.uniforms.uDither = PSX.uniforms.uDither;
    shader.uniforms.uTime = PSX.uniforms.uTime;
    shader.uniforms.uGrade = PSX.uniforms.uGrade;
    shader.uniforms.uTint = PSX.uniforms.uTint;
    shader.uniforms.uView = PSX.uniforms.uView;
    shader.vertexShader = 'uniform float uSnap;\nuniform float uTime;\n' +
      shader.vertexShader.replace('#include <project_vertex>', SNAP_VERT);
    shader.fragmentShader = 'uniform float uDither;\nuniform vec4 uGrade;\nuniform vec3 uTint;\nuniform vec4 uView;\n' +
      shader.fragmentShader.replace('#include <dithering_fragment>', DITHER_FRAG);
  };
  material.customProgramCacheKey = () => 'psx-' + (material.userData.psxKey || '');
  return material;
}

const cache = new Map();
/**
 * Standard-Material für alles. opts wie MeshLambertMaterial.
 * Ohne opts: geteiltes Vertex-Color-Flat-Material (empfohlen, spart Draw-State).
 */
function psxMat(opts = {}) {
  const o = { vertexColors: true, flatShading: true, ...opts };
  const key = JSON.stringify(o, (k, v) => (v && v.isColor ? v.getHex() : (v && v.isTexture ? v.uuid : v)));
  if (!opts.noCache && cache.has(key)) return cache.get(key);
  delete o.noCache;
  const m = patchPSX(new THREE.MeshLambertMaterial(o));
  cache.set(key, m);
  return m;
}

return { PSX, setGrade, trackViewport, setPSX, patchPSX, psxMat };
})();

// ===== kit.js =====
const __m_kit = (() => {
// Mesh-Baukasten: Low/Mid-Poly-Primitive mit Vertex-Farben, die zu EINER Geometrie verschmolzen werden.
// Beispiel:
//   const b = new MeshBuilder();
//   b.box(0.6, 0.4, 1.0, 0xd9772b, { y: 0.5 });
//   b.sphere(0.25, 0xffffff, { y: 0.8, z: 0.5, sy: 0.8 }, 6, 4);
//   const mesh = b.mesh(); // THREE.Mesh mit psxMat()
const { psxMat } = __m_psx;

const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(),
  _p = new THREE.Vector3(), _s = new THREE.Vector3(), _c = new THREE.Color();

/** t = { x,y,z, rx,ry,rz (Radiant), s (uniform), sx,sy,sz, jitter (Farbvariation 0..1) } */
function tMatrix(t = {}) {
  _p.set(t.x || 0, t.y || 0, t.z || 0);
  _e.set(t.rx || 0, t.ry || 0, t.rz || 0);
  _q.setFromEuler(_e);
  const s = t.s ?? 1;
  _s.set((t.sx ?? 1) * s, (t.sy ?? 1) * s, (t.sz ?? 1) * s);
  return _m.compose(_p, _q, _s).clone();
}

class MeshBuilder {
  constructor() { this.parts = []; }

  /** Fügt beliebige BufferGeometry mit Farbe und Transform hinzu. */
  add(geo, color, t = {}) {
    let g = geo.index ? geo.toNonIndexed() : geo.clone();
    g.applyMatrix4(tMatrix(t));
    const n = g.attributes.position.count;
    const col = new Float32Array(n * 3);
    _c.set(color);
    const jit = t.jitter ?? 0.06;
    // Pro Dreieck leicht variierende Farbe => handgemachter PS1-Look
    for (let i = 0; i < n; i += 3) {
      const k = 1 + (Math.random() - 0.5) * jit * 2;
      for (let j = 0; j < 3 && i + j < n; j++) {
        col[(i + j) * 3] = Math.min(1, _c.r * k);
        col[(i + j) * 3 + 1] = Math.min(1, _c.g * k);
        col[(i + j) * 3 + 2] = Math.min(1, _c.b * k);
      }
    }
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    for (const name of Object.keys(g.attributes)) if (!['position', 'normal', 'color'].includes(name)) g.deleteAttribute(name);
    this.parts.push(g);
    return this;
  }
  box(w, h, d, color, t) { return this.add(new THREE.BoxGeometry(w, h, d), color, t); }
  sphere(r, color, t, ws = 7, hs = 5) { return this.add(new THREE.SphereGeometry(r, ws, hs), color, t); }
  cyl(rTop, rBot, h, color, t, seg = 7) { return this.add(new THREE.CylinderGeometry(rTop, rBot, h, seg), color, t); }
  cone(r, h, color, t, seg = 7) { return this.add(new THREE.ConeGeometry(r, h, seg), color, t); }
  ico(r, color, t, detail = 0) { return this.add(new THREE.IcosahedronGeometry(r, detail), color, t); }
  capsule(r, len, color, t, cap = 3, seg = 7) { return this.add(new THREE.CapsuleGeometry(r, len, cap, seg), color, t); }

  geometry() {
    let total = 0;
    for (const g of this.parts) total += g.attributes.position.count;
    const pos = new Float32Array(total * 3), col = new Float32Array(total * 3);
    let o = 0;
    for (const g of this.parts) {
      pos.set(g.attributes.position.array, o * 3);
      col.set(g.attributes.color.array, o * 3);
      o += g.attributes.position.count;
    }
    const out = new THREE.BufferGeometry();
    out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    out.setAttribute('color', new THREE.BufferAttribute(col, 3));
    out.computeVertexNormals();
    out.computeBoundingSphere();
    return out;
  }
  mesh(material = psxMat()) {
    const m = new THREE.Mesh(this.geometry(), material);
    m.castShadow = true; m.receiveShadow = true;
    return m;
  }
}

/** Seeded RNG (mulberry32) */
function rng(seed = 1) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** 2D Value-Noise + fbm, seeded */
function makeNoise(seed = 1) {
  const r = rng(seed), P = new Uint8Array(512), G = new Float32Array(256);
  for (let i = 0; i < 256; i++) { P[i] = i; G[i] = r() * 2 - 1; }
  for (let i = 255; i > 0; i--) { const j = (r() * (i + 1)) | 0; [P[i], P[j]] = [P[j], P[i]]; }
  for (let i = 0; i < 256; i++) P[i + 256] = P[i];
  const fade = t => t * t * (3 - 2 * t);
  const v = (x, y) => G[P[P[x & 255] + (y & 255)]];
  function noise(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = fade(xf), w = fade(yf);
    const a = v(xi, yi), b = v(xi + 1, yi), c = v(xi, yi + 1), d = v(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * w + (a - b - c + d) * u * w;
  }
  function fbm(x, y, oct = 4) {
    let s = 0, amp = 0.5, f = 1;
    for (let i = 0; i < oct; i++) { s += noise(x * f, y * f) * amp; f *= 2; amp *= 0.5; }
    return s;
  }
  return { noise, fbm };
}

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, lambda, dt) => lerp(a, b, 1 - Math.exp(-lambda * dt));

return { tMatrix, MeshBuilder, rng, makeNoise, clamp, lerp, damp };
})();

// ===== biomes.js =====
const __m_biomes = (() => {
// Viniland – Biome (reine Daten). world.js liest alles hieraus; Platzhalter, leicht austauschbar.
// Layout: Biome sind Sektoren um die Inselmitte. Winkel phi = atan2(z, x) in Grad (0..360).
// Start (Wrack) liegt an der Küste bei phi = 90° (also +Z). Fortschritt gegen den Uhrzeigersinn (phi steigend):
// kueste (50–130) → duesterwald (130–215) → pilzhain (215–300) → aschenoede (300–360) | frostgipfel (0–50, + Gipfel in der Mitte).
// Zwischen allen Sektoren stehen Felsgrate (Wände). In den Graten 1→2, 2→3, 3→4 sitzt je ein Nebeltor.

const LAYOUT = {
  radius: 390,          // nominaler Küstenradius (m)
  ext: 455,             // halbe Terrain-Kantenlänge (m)
  cell: 3.5,            // Terrain-Zellgröße (m)
  gateR: 235,           // Radius, auf dem die Nebeltore in den Graten sitzen
  gateWidth: 12,
  startPhi: 90,
  peak: { h: 62, r: 105 }, // Zentralmassiv
};

// Baumarten (Platzhalter). style: pine | oak | birch | dead | shroom. glow: Krone unbeleuchtet (leuchtet).
const TREE_TYPES = {
  pine: { style: 'pine', H: 9.2, rB: 0.30, rT: 0.09, stump: 0.42, crownC: 6.0, crownR: 2.2, top: 10.6, lc: 0.50, hp: [4, 5],
    bark: 0x4e3a2a, leaves: [0x2a4234, 0x334a3a, 0x243a2e] },
  oak: { style: 'oak', H: 5.0, rB: 0.42, rT: 0.27, stump: 0.42, crownC: 6.4, crownR: 2.8, top: 9.0, lc: 0.66, hp: [4, 5],
    bark: 0x4a3a2c, leaves: [0x4a5a3a, 0x56653f, 0x3e4e32] },

function buildTreeGeos(T, r) {
  const st = new MeshBuilder(), tr = new MeshBuilder(), cr = new MeshBuilder();
  const rAt = y => lerp(T.rB, T.rT, clamp(y / T.H, 0, 1));

  st.cyl(rAt(T.stump) * 0.85, rAt(T.stump) * 0.85, 0.02, cut, { y: T.stump + 0.005 }, 8);
  tr.cyl(T.rT, rAt(T.stump), T.H - T.stump, T.bark, { y: T.stump + (T.H - T.stump) / 2 }, 8);
  const branch = (b, y, a, len, tilt, r0, r1, col) => {
    const dx = Math.sin(a) * Math.sin(tilt), dy = Math.cos(tilt), dz = Math.cos(a) * Math.sin(tilt), rr = rAt(y);
    b.cyl(r1, r0, len, col, { x: Math.sin(a) * rr * 0.6 + dx * len / 2, y: y + dy * len / 2, z: Math.cos(a) * rr * 0.6 + dz * len / 2, rz: tilt, ry: a + Math.PI / 2 }, 5);
    return [Math.sin(a) * rr * 0.6 + dx * len, y + dy * len, Math.cos(a) * rr * 0.6 + dz * len];
  };
  if (T.style === 'pine') {
    const sy = T.H / 9.2, sr = T.crownR / 2.2;
    const lay = [[2.6, 2.2, 3.2], [4.3, 1.85, 3.0], [5.9, 1.45, 2.7], [7.5, 1.05, 2.4], [8.9, 0.6, 1.8]];
    lay.forEach(([y, rr, h], i) => cr.cone(rr * sr, h * sy, T.leaves[i % 3], { y: y * sy + h * sy / 2, ry: r() * 3, jitter: 0.1 }, 8));
  } else if (T.style === 'oak') {
    const k = T.crownC / 6.4;
    tr.cyl(0.09, 0.16, 2.2, T.bark, { y: 4.3 * k, x: 0.7, rz: -0.8 }, 6);
    tr.cyl(0.08, 0.15, 2.0, T.bark, { y: 4.5 * k, z: -0.6, rx: -0.75 }, 6);
    const bl = [[0, 6.6, 0, 2.4], [1.5, 6.0, 0.4, 1.8], [-1.3, 6.1, -0.7, 1.9], [0.3, 5.8, 1.5, 1.7], [-0.5, 7.6, 0.6, 1.6], [0.9, 7.2, -1.2, 1.5]];
    bl.forEach(([x, y, z, rr], i) => cr.ico(rr * (T.crownR / 2.8), T.leaves[i % 3], { x, y: y * k, z, sy: 0.85, jitter: 0.12 }, 1));
  } else if (T.style === 'birch') {
    for (let i = 0; i < 7; i++) {
      const y = 0.9 + r() * (T.H - 2), a = r() * 6.28, rr = rAt(y);
      tr.box(0.16, 0.05, 0.05, 0x3a3532, { x: Math.sin(a) * rr, y, z: Math.cos(a) * rr, ry: a + 1.57, jitter: 0.1 });
    }
    const bl = [[0, 7.0, 0, 1.5], [0.7, 6.0, 0.3, 1.2], [-0.6, 6.3, -0.4, 1.15], [0.1, 8.3, 0.2, 1.0]];
    bl.forEach(([x, y, z, rr], i) => cr.ico(rr, T.leaves[i % 3], { x, y, z, sy: 1.35, jitter: 0.12 }, 1));

      if (T.embers) cr.box(0.12, 0.12, 0.12, 0xff6a20, { x: ex, y: ey, z: ez, jitter: 0.2 });
    }
    if (T.embers) for (let i = 0; i < 6; i++) { const y = 0.6 + r() * (T.H * 0.7), a = r() * 6.28, rr = rAt(y); tr.box(0.1, 0.22, 0.04, 0xff7a2a, { x: Math.sin(a) * rr, y, z: Math.cos(a) * rr, ry: a, jitter: 0.25 }); }

    if (T.cap === 'flat') {

      cr.cone(R * 0.45, R * 0.7, l[1], { y: top + R * 1.05 }, 7);

      cr.cyl(R * 0.68, T.rT, 0.2, gill, { y: top + 0.1 }, 8);

function sampleKeys(keys, t, fast) {
  let i = 0;
  while (i < keys.length - 2 && t > keys[i + 1].t) i++;
  const a = keys[i], b = keys[i + 1];
  let u = clamp((t - a.t) / (b.t - a.t), 0, 1);
  u = i === fast ? u * u * u : u * u * (3 - 2 * u);   // Schlag beschleunigt (ease-in), Rest weich
  const o = {};
  for (const k in a) if (k !== 't') o[k] = lerp(a[k], b[k], u);
  return o;
}

// ---- Modell ----
function createPlayerModel(index = 0) {
  const n = PLAYER_LOOKS.length;
  const L = PLAYER_LOOKS[((index % n) + n) % n];
  const w = L.width;

  const root = new THREE.Group(); root.name = 'player_' + L.name;
  const ROLL_Y = 0.55;
  const rollG = grp(root, 0, ROLL_Y, 0);         // Pivot für Ausweichrolle (Körpermitte)
  const body = grp(rollG, 0, -ROLL_Y, 0);        // Squash + Seitlehnen (Pivot an den Füßen)
  const hips = grp(body, 0, HIP, 0); hips.add(buildPelvis(L));
  const torso = grp(hips, 0, 0.05, 0); torso.add(buildTorso(L));
  const cape = grp(torso, 0, 0.47, -0.1); if (L.cloak != null) cape.add(buildCape(L));
  const neck = grp(torso, 0, NECK_Y, 0.005);
  const head = grp(neck); head.add(buildHead(L));

  const arm = {};
  for (const [key, s] of [['l', 1], ['r', -1]]) {
    const sh = grp(torso, s * SH_X * w, SH_Y, 0); sh.add(buildUpper(L, key));
    const el = grp(sh, 0, -UPPER, 0); el.add(buildFore(L, key));
    const hand = grp(el, 0, -FORE, 0); hand.add(buildHand(L));
    arm[key] = { sh, el, hand };
  }
  // Waffen-Halter (Griff am Ursprung, Klinge +Y); Standard = Fäuste (leer)
  const weaponR = grp(arm.r.hand, 0, -0.045, 0.0); weaponR.rotation.order = 'YXZ';
  const weaponL = grp(arm.l.hand, 0, -0.045, 0.0); weaponL.rotation.order = 'YXZ';
  const blade = grp(weaponR, 0, 0.05, 0);       // Spitze (für Hitbox/FX), wird von setWeapon versetzt
  const flask = buildFlask(); flask.position.set(0, -0.07, 0.03); flask.visible = false; arm.l.hand.add(flask);
  let grip = 'fists', curWeapon = null, curOff = null;
  /** Waffe in die Hand: mesh = Object3D aus buildWeaponMesh (userData.tip, userData.offhand) oder null (Fäuste) */
  function setWeapon(mesh, gripType) {
    if (curWeapon) weaponR.remove(curWeapon);
    if (curOff) weaponL.remove(curOff);
    curWeapon = mesh || null; curOff = mesh?.userData?.offhand || null;
    if (curWeapon) weaponR.add(curWeapon);
    if (curOff) weaponL.add(curOff);
    const tip = mesh?.userData?.tip;
    blade.position.set(0, tip ? tip.y * 0.85 : 0.05, tip ? tip.z || 0 : 0);
    grip = gripType || (mesh ? (curOff ? 'dual' : 'one') : 'fists');
  }

  const leg = {};
  for (const [key, s] of [['l', 1], ['r', -1]]) {
    const th = grp(hips, s * 0.1 * w, -0.02, 0); th.add(buildThigh(L));
    const kn = grp(th, 0, -THIGH, 0); kn.add(buildShin(L));
    const ft = grp(kn, 0, -SHIN, 0); ft.add(buildFoot(L));
    leg[key] = { th, kn, ft };
  }

  // ---- Zustand ----
  const st = {
    t: Math.random() * 10, phase: 0, spd: 0, runF: 0, sprintW: 0, lean: 0, turnLean: 0,
    air: 0, rise: 0, land: 0, landV: 0, cape: 0.1, capeV: 0, lastSpeed: 0, accel: 0,
    headY: 0,
  };
  let action = null, actionT = 0, actDef = null, actSpeed = 1;
  // Pose-Überblendung zwischen Aktionen (Combo-Ketten ohne Springen)
  const POSE_KEYS = ['lsx', 'lsz', 'lel', 'rsx', 'rsz', 'rel', 'wr', 'wy', 'lwr', 'lwy', 'tx', 'ty', 'crouch', 'by', 'ly'];
  const last = {}, from = {}; for (const k of POSE_KEYS) last[k] = from[k] = 0;
  let fadeT = 0; const FADE = 0.12;

  /** name: siehe ACTION_NAMES (slashR, thrust, spin, slam, jab, …, drink, heavyCharge, art_*, roll, hurt, death, wave, chop).
   *  opts = { speed } → { duration, impactAt } in Sekunden (bereits durch speed geteilt). Unbekannte art_* fallen auf 'slam' zurück. */
  function playAction(name, opts = {}) {
    let A = ACTIONS[name], sp = opts.speed || 1;
    if (!A && name && name.startsWith('art_')) A = ACTIONS.slam;
    if (!A) return { duration: 0, impactAt: 0 };
    if (A.alias) { sp *= A.speed || 1; A = ACTIONS[A.alias]; }
    if (action && action !== 'death') { for (const k of POSE_KEYS) from[k] = last[k]; fadeT = FADE; } else fadeT = 0;
    action = name; actionT = 0; actDef = A; actSpeed = sp;
    return { duration: A.duration / sp, impactAt: A.impactAt / sp };
  }
  function cancelAction() { action = null; actDef = null; actionT = 0; fadeT = 0; }

  // Bein-Pose: Hüfte senkt sich um d -> symmetrischer Knick (Fuß bleibt unter der Hüfte, flach)
  const crouchAngle = d => Math.acos(clamp(1 - d / LEG, -1, 1));

  function animate(dt, s = {}) {
    dt = Math.min(dt || 0, 0.1);
    st.t += dt;
    const speed = Math.max(0, s.speed || 0);
    const maxSpeed = Math.max(0.1, s.maxSpeed || 6);
    const grounded = s.grounded !== false;
    const vy = s.vy || 0, turn = s.turn || 0;

    // --- geglättete Eingangsgrößen ---
    st.accel = damp(st.accel, (speed - st.lastSpeed) / Math.max(dt, 1e-4), 6, dt);
    st.lastSpeed = speed;
    st.spd = damp(st.spd, grounded ? speed : st.spd, 10, dt);
    st.runF = damp(st.runF, smooth(2.2, 4.6, speed), 6, dt);
    st.sprintW = damp(st.sprintW, s.sprint && speed > 1 ? 1 : 0, 5, dt);
    st.lean = damp(st.lean, clamp(speed / maxSpeed, 0, 1.2) + clamp(st.accel * 0.04, -0.3, 0.4), 6, dt);
    st.turnLean = damp(st.turnLean, clamp(turn, -4, 4) * clamp(speed / 3, 0.15, 1.3), 5, dt);
    st.air = damp(st.air, grounded ? 0 : 1, grounded ? 18 : 9, dt);
    st.rise = damp(st.rise, clamp(vy / 4, -1, 1), 7, dt);

  fox(R) {

  rabbit(R) {

  deer(R) {
    const M = R.c(0xc4844e), W = R.c(0xfaead0), D = 0x3a2a20, S = R.c(0xf3dcb4);
    const b = new MeshBuilder();
    b.sphere(1, M, { y: 0.84, sx: 0.2, sy: 0.22, sz: 0.45 }, 10, 7);
    b.sphere(1, W, { y: 0.76, z: 0.02, sx: 0.165, sy: 0.15, sz: 0.36 }, 8, 5);
    b.sphere(1, W, { y: 0.86, z: -0.38, sx: 0.13, sy: 0.14, sz: 0.08 }, 7, 5);
    for (let i = 0; i < 8; i++) {
      const sx = (R.r() - 0.5) * 0.18, sz = (R.r() - 0.5) * 0.6;
      const k = 1 - (sx / 0.2) ** 2 - (sz / 0.45) ** 2;
      if (k < 0.2) continue;
      b.sphere(0.028, S, { x: sx, y: 0.84 + 0.22 * Math.sqrt(k), z: sz, sy: 0.4 }, 5, 3);
    }
    R.torsoMesh(b);
    R.quadLegs({ x: 0.1, y: 0.68, z: 0.3, l1: 0.34, l2: 0.34, r: 0.034, c1: M, c2: M, fc: D, foot: 'hoof' },
               { x: 0.1, y: 0.68, z: -0.3, l1: 0.34, l2: 0.34, r: 0.045, c1: M, c2: M, fc: D, foot: 'hoof' });
    const h = new MeshBuilder();
    h.cyl(0.07, 0.11, 0.3, M, { y: 0.12, z: 0.06, rx: 0.45 }, 7);
    h.sphere(0.13, M, { y: 0.3, z: 0.14, sz: 1.1 }, 9, 7);
    h.sphere(0.078, W, { y: 0.25, z: 0.28, sz: 1.25 }, 7, 5);
    h.sphere(0.026, BLACK, { y: 0.27, z: 0.37, jitter: 0 }, 6, 4);
    for (const s of [1, -1]) eye(h, s * 0.075, 0.33, 0.21, 0.048, 0.45);
    const antlers = R.r() < 0.5;
    if (antlers) {
      const A = 0xe9d9b8;
      for (const s of [1, -1]) {
        h.cyl(0.01, 0.016, 0.2, A, { x: s * 0.07, y: 0.48, z: 0.1, rz: -s * 0.35, rx: -0.2 }, 5);
        h.cyl(0.008, 0.012, 0.1, A, { x: s * 0.09, y: 0.52, z: 0.15, rz: -s * 0.1, rx: 0.6 }, 5);
        h.cyl(0.007, 0.01, 0.09, A, { x: s * 0.13, y: 0.59, z: 0.09, rz: -s * 0.8 }, 5);
      }
    }
    R.addHead(0.97, 0.36, h);
    for (const s of [1, -1]) {
      const e = new MeshBuilder();
      e.sphere(1, M, { y: 0.07, sx: 0.045, sy: 0.09, sz: 0.022 }, 7, 5);
      e.sphere(1, W, { y: 0.07, z: 0.01, sx: 0.03, sy: 0.065, sz: 0.012 }, 6, 4);
      R.addEar(s * 0.085, 0.38, 0.1, e, 0, 0, -s * 0.95);
    }
    const t = new MeshBuilder(); t.sphere(0.05, W, { z: -0.02, sz: 1.3 }, 6, 4);
    R.addTail(0.92, -0.44, t, 0.3);
    return { antlers };
  },

  boar(R) {

  sheep(R) {
    const Wo = R.c(0xf5ecda), F = R.c(0x4c3c36), Fm = R.c(0x6c5a50);
    const b = new MeshBuilder();
    b.ico(0.3, Wo, { y: 0.6, sx: 0.85, sy: 0.85, sz: 1.3 }, 1);
    for (let i = 0; i < 14; i++) {
      const a = R.r() * TAU, v = R.r() * 0.9 - 0.2;
      const nx = Math.cos(a) * Math.sqrt(1 - v * v), ny = v, nz = Math.sin(a) * Math.sqrt(1 - v * v);
      b.ico(0.11 + R.r() * 0.05, Wo, { x: nx * 0.24, y: 0.6 + ny * 0.24, z: nz * 0.36, ry: R.r() * 3 }, 0);
    }
    R.torsoMesh(b);
    R.quadLegs({ x: 0.1, y: 0.33, z: 0.2, l1: 0.165, l2: 0.165, r: 0.03, c1: F, c2: F, fc: 0x2a201c, foot: 'hoof' },

    const h = new MeshBuilder();
    h.sphere(0.13, F, { y: 0.02, z: 0.1, sz: 1.2 }, 9, 7);
    h.sphere(0.075, Fm, { y: -0.03, z: 0.22, sx: 1.1 }, 7, 5);
    h.sphere(0.016, BLACK, { x: 0.025, y: -0.01, z: 0.29, jitter: 0 }, 4, 3);
    h.sphere(0.016, BLACK, { x: -0.025, y: -0.01, z: 0.29, jitter: 0 }, 4, 3);

  duck(R) {
    const M = R.c(0xa07a54), Ml = R.c(0xcaa982), G = R.c(0x2e8a52), Y = 0xf4c02c, O = 0xf28a22;

  hedgehog(R) {
    const C = R.c(0xe8cfa6), Q = R.c(0x5a3e2c), Qt = R.c(0x9a7a58), D = 0x3a2a22;
    const b = new MeshBuilder();
    b.sphere(1, C, { y: 0.1, sx: 0.11, sy: 0.08, sz: 0.15 }, 8, 6);
    b.sphere(1, Q, { y: 0.13, z: -0.02, sx: 0.13, sy: 0.11, sz: 0.16 }, 9, 7);
    for (let i = 0; i < 46; i++) {
      const u = R.r() * TAU, v = 0.15 + R.r() * 0.85;
      let nx = Math.cos(u) * Math.sqrt(1 - v * v), ny = v, nz = Math.sin(u) * Math.sqrt(1 - v * v);
      if (nz > 0.6) nz = 0.6 - (nz - 0.6);           // Gesicht frei lassen
      const px = nx * 0.12, py = 0.13 + ny * 0.1, pz = -0.02 + nz * 0.15;
      b.cone(0.022, 0.08, i % 3 ? Q : Qt, { x: px, y: py, z: pz, ...alongNormal(nx * 0.8, ny + 0.25, nz - 0.35) }, 4);
    }
    R.torsoMesh(b);
    R.quadLegs({ x: 0.06, y: 0.055, z: 0.07, l1: 0.028, l2: 0.028, r: 0.014, c1: C, c2: D, fc: D, foot: 'paw' },
               { x: 0.065, y: 0.055, z: -0.07, l1: 0.028, l2: 0.028, r: 0.016, c1: C, c2: D, fc: D, foot: 'paw' });
    const h = new MeshBuilder();
    h.sphere(0.07, C, { z: 0.03 }, 8, 6);
    h.cone(0.038, 0.1, C, { y: -0.01, z: 0.1, rx: HALF }, 7);
    h.sphere(0.018, BLACK, { y: -0.01, z: 0.152, jitter: 0 }, 5, 4);
    for (const s of [1, -1]) eye(h, s * 0.036, 0.03, 0.075, 0.023, 0.5);
    R.addHead(0.1, 0.12, h);
    for (const s of [1, -1]) {
      const e = new MeshBuilder(); e.sphere(0.02, C, { sz: 0.5 }, 5, 4);
      R.addEar(s * 0.05, 0.055, 0.0, e, 0, 0, -s * 0.3);
    }
  },

    const M = R.c(0xc85a28), W = R.c(0xfbe8cc), D = R.c(0x6a2c14);

    b.sphere(1, M, { y: 0.15, sx: 0.07, sy: 0.075, sz: 0.12 }, 9, 7);
    b.sphere(1, W, { y: 0.13, z: 0.04, sx: 0.055, sy: 0.06, sz: 0.08 }, 7, 5);
    for (const s of [1, -1]) b.sphere(0.048, M, { x: s * 0.04, y: 0.12, z: -0.06 }, 6, 4);
    R.torsoMesh(b);
    R.quadLegs({ x: 0.04, y: 0.085, z: 0.06, l1: 0.043, l2: 0.042, r: 0.013, c1: M, c2: M, fc: W, foot: 'paw' },
               { x: 0.045, y: 0.09, z: -0.07, l1: 0.045, l2: 0.045, r: 0.018, c1: M, c2: M, fc: M, foot: 'bigpaw' });
    const h = new MeshBuilder();

  squirrel: { pivotY: 0.09, zF: 0.06, zB: -0.07, stride: 0.3,  gait: 'hop',    sit: 'upright', eatA: 0.4, radius: 0.1, height: 0.42, hopH: 0.09, wag: 7 },

          p.y = world.heightAt(p.x, p.z);

          scene.add(a.object3D);

            a, info, type, pos: a.object3D.position, home: center.clone(),
            yaw: r() * Math.PI * 2, speed: 0, wantSpeed: 0, turn: 0,

    else if (state === 'eat') { e.wantSpeed = 0; e.action = 'eat'; e.timer = 2 + r() * 4; }
    else if (state === 'sit') { e.wantSpeed = 0; e.action = 'sit'; e.timer = 4 + r() * 6; }

      const info = e.info;

      let near = null, nd = 1e9;

      e.pos.z += Math.cos(e.yaw) * e.speed * dt;

  ['invertY', 'bool', 'Kamera invertieren Y'],

  ['lockToggle', 'bool', 'Lock-On', 0, 0, 0, ['Halten', 'Umschalten']],
  ['autoAlign', 'bool', 'Auto-Ausrichtung Kamera'],
  ['damageNumbers', 'bool', 'Schadenszahlen'],
  ['screenShake', 'num', 'Kamera-Shake', 0, 2, 0.05],
  ['rumble', 'bool', 'Vibration'],
  ['autoPickup', 'bool', 'Auto-Aufheben'],
  ['hudScale', 'num', 'HUD-Größe', 0.7, 1.5, 0.05],

/** Wiederholender Boden-Schaden (DoT) an allen Gegnern im Kreis um getPos() */
function areaTicker(ctx, { getPos, radius, dur, every, dmg, fx, kb = 0, stagger = 0, onTick }) {
  let t = 0, acc = every * 0.5;
  const team = ctx.team;
  return {
    update(dt) {
      t += dt; acc += dt;
      const p = getPos(t);
      if (onTick) onTick(p, dt, t);
      if (acc >= every) {
        acc -= every;
        for (const a of ctx.combat.actors) {
          if (a.team === team || a.alive === false || !(a.hp > 0)) continue;
          if (Math.hypot(a.pos.x - p.x, a.pos.z - p.z) <= radius + a.radius && Math.abs(a.pos.y - p.y) < 3)
            ctx.combat.applyHit(a, ctx.hitOpts({ owner: ctx.actor, team, damage: Math.max(1, Math.round(dmg)), knockback: kb, stagger, kind: 'spell', onHitFx: fx, hitstop: 0, shake: 0.05 }), V().set(a.pos.x, a.pos.y + 1, a.pos.z));
        }
      }
      return t < dur;
    },
  };
}
/** Heilt einen Actor (nutzt actor.heal falls vorhanden) */
function healActor(combat, a, n) {
  if (!a || a.alive === false || n <= 0) return 0;
  const before = a.hp;
  if (a.heal) a.heal(n); else a.hp = Math.min(a.maxHp ?? a.hp + n, a.hp + n);
  const got = a.hp - before;
  if (got >= 1) combat.damageNumber(V().set(a.pos.x, a.pos.y + (a.height || 1.7) * 0.9, a.pos.z), '+' + Math.round(got), 0x8aff9a);
  return got;
}

  // ================= Ziele =================

  // ================= Pro Frame (vor ctrl.update) =================
  /** Gibt Bewegungs-Multiplikator für den Controller zurück. Verändert intent (sprint/jump) nach Kampfzustand. */
  update(dt, intent, camYaw) {

    c.override = null; c.faceYaw = null; c.faceRate = 0; c.frozen = false;

    }

    // Buffer

    if (intent.chopPressed) this.bufAtk = B;
    if (intent.rollPressed) this.bufRoll = B;
    if (intent.spell1Pressed) this.bufS1 = B;
    if (intent.spell2Pressed) this.bufS2 = B;
    if (intent.heavyPressed) this.bufHeavy = B;
    if (intent.artPressed) this.bufArt = B;
    if (intent.flaskPressed) this.bufFlask = B;
    for (const k of ['bufAtk', 'bufRoll', 'bufS1', 'bufS2', 'bufHeavy', 'bufArt', 'bufFlask']) this[k] = Math.max(0, this[k] - dt);

    // ---- Zustandswechsel ----
    // Rolle: aus free, Erholung, spätem Flinch, nach dem Trinken

      c.yaw = Math.atan2(this.rollDir.x, this.rollDir.z);
      this.enter('roll', m.playAction('roll'));
      this.move = null; this.hits = [];
      this.combat.fx('dust', _w.copy(c.pos).setY(c.pos.y + 0.1), 6);
      this.hooks.rumble?.(this.p.i, 0.2, 50);
      this.onAction?.('roll');
    }
    // Glutflakon
    if (this.bufFlask > 0 && canAct && ready) this.useFlask();
    // Waffenkunst

  // ================= Bewegungsabläufe (Combo / Schwer / Kunst) =================

  /** kind 'light'|'heavy'|'art', def = Schlag- bzw. Kunst-Definition, charge 0..1 (nur schwer) */

// Viniland – Gegner-Registry (Erweiterung 3). Alles Datengetriebene über Bosse und normale Gegner an einer Stelle.
// Normale Gegner sind (vorerst) Platzhalter: kleinere, umgefärbte Boss-Kopien (variant.minion = true, 1–2 Attacken, wenig HP).
// Geometrien werden pro Basis-Typ + Tönung gecacht (bosses.js), d. h. viele gleiche Minions kosten kaum Speicher.
const { BOSS_TYPES, BOSS_INFO, createBoss } = __m_bosses;
const { BOSS_TYPES2, BOSS_INFO2, createBoss2 } = __m_bosses2;

/** Bosse eines Bioms (Reihenfolge: Nebenbosse, dann Siegelträger zuletzt). */
function bossesOfBiome(biome) {
  return ALL_BOSS_TYPES.filter(t => ALL_BOSSES[t].biome === biome).sort((a, b) => (ALL_BOSSES[a].key ? 1 : 0) - (ALL_BOSSES[b].key ? 1 : 0));
}

/** spawnBoss(type, { scene, world, combat, home, yaw, variant }) → Boss-Instanz (siehe createBoss). */
function spawnBoss(type, opts = {}) {
  if (BOSS_INFO[type]) return createBoss(type, opts);
  if (BOSS_INFO2[type]) return createBoss2(type, opts);
  throw new Error('Unbekannter Boss: ' + type);
}

const SFX_LIMIT = { step: 3, hit: 4, hitHeavy: 3, swing: 4, coin: 3, roar: 2, gate: 1, explode: 2, lightning: 2 };
const SFX_GAIN = { step: 0.5, ui: 0.6, swing: 0.7, roll: 0.8, roar: 0.9 };
const MAX_SFX = 24;

function playSfx(E, name, o = {}) {
  const fn = SFX[name]; if (!fn) return;
  const t = E.ctx.currentTime;
  if ((E.sfxActive.get(name) || 0) >= (SFX_LIMIT[name] || 4)) return;          // Voice-Limit pro Name
  let total = 0; for (const c of E.sfxActive.values()) total += c; if (total >= MAX_SFX) return; // global
  if (t - (E.lastSfx.get(name) || -1) < 0.015) return;                          // identisch im selben Frame
  E.lastSfx.set(name, t);
  const v = E.voice(), out = E.gain(v, clamp(o.vol == null ? 1 : o.vol, 0, 2) * (SFX_GAIN[name] || 1) * rand(0.88, 1.05)), pn = E.pan(v, o.pan || 0);
  out.connect(pn); pn.connect(E.sfxIn);
  const p = (o.pitch || 1) * rand(0.95, 1.05);
  const dur = fn(E, v, out, t + 0.005, p);
  v.end = Math.max(v.end, t + dur); E.done(v, name);
}

// Öffentliche Fassade

let E = null, timer = 0;
const pending = { music: null, vol: { music: 0.6, sfx: 0.8 } };
const LOOK = () => (typeof document !== 'undefined' && document.hidden ? 1.6 : 0.3);

const Audio = {
  get ready() { return !!E; },
  get ctx() { return E ? E.ctx : null; },
  SFX_NAMES: Object.keys(SFX),
  BIOME_IDS: Object.keys(EXPLORE),
  init() {
    try {
      if (E) { if (E.ctx.state !== 'running') E.ctx.resume(); return E.ctx.resume ? E.ctx.resume() : Promise.resolve(); }
      const AC = globalThis.AudioContext || globalThis.webkitAudioContext; if (!AC) return Promise.resolve();
      const ctx = new AC({ latencyHint: 'interactive' });
      E = createEngine(ctx);
      E.setVolume(pending.vol);
      if (pending.music) E.setMusic(pending.music);
      const tick = () => { try { E.schedule(E.ctx.currentTime + LOOK()); } catch (e) { console.error(e); } };
      timer = setInterval(tick, 40); tick();
      return ctx.resume();
    } catch (e) { console.error('Audio.init', e); return Promise.resolve(); }
  },
  setMusic(req = {}) { pending.music = { ...pending.music, ...req }; if (E) E.setMusic(pending.music); },
  stopMusic() { pending.music = null; if (E) E.stopMusic(); },
  sting(name) { if (E && E.ctx.state === 'running') playSting(E, name); },
  sfx(name, opts) { if (E && E.ctx.state === 'running') playSfx(E, name, opts); },
  setVolume(v = {}) { Object.assign(pending.vol, Object.fromEntries(Object.entries(v).filter(([, x]) => x != null))); if (E) E.setVolume(v); },
  dispose() { if (!E) return; clearInterval(timer); E.ctx.close(); E = null; },
};

/** Offline-Render (Selbsttest): rendert Musik (+ optional SFX/Stings) und misst RMS/Peak. */
async function renderOffline({ biome = 'kueste', combat = null, intensity = 0.7, seconds = 4, sfx = [], stings = [], sampleRate = 44100 } = {}) {
  const OAC = globalThis.OfflineAudioContext || globalThis.webkitOfflineAudioContext;
  const ctx = new OAC(2, Math.ceil(sampleRate * seconds), sampleRate);
  const X = createEngine(ctx, true);
  X.setVolume({ music: 0.6, sfx: 0.8 });
  X.setMusic({ biome, combat, intensity });
  X.schedule(seconds);
  // SFX/Stings zeitversetzt über suspend/resume einplanen
  const events = [...sfx.map((n, i) => ({ at: 0.3 + i * (seconds - 0.6) / Math.max(1, sfx.length), f: () => playSfx(X, n) })),
    ...stings.map((n, i) => ({ at: 0.5 + i * 1.5, f: () => playSting(X, n) }))];
  for (const ev of events) {
    const at = Math.round(ev.at * sampleRate / 128) * 128 / sampleRate;
    ctx.suspend(at).then(() => { ev.f(); ctx.resume(); });
  }
  const buffer = await ctx.startRendering();
  let sum = 0, peak = 0, n = 0;
  for (let c = 0; c < buffer.numberOfChannels; c++) {
    const d = buffer.getChannelData(c);
    for (let i = 0; i < d.length; i++) { const a = Math.abs(d[i]); sum += a * a; if (a > peak) peak = a; n++; }
  }
  return { rms: Math.sqrt(sum / n), peak, buffer };
}

return { Audio, renderOffline };

  get top() { return this.stack[this.stack.length - 1]; }

  // ---------- HUD ----------
  update(dt) {

      this.el.glutN.textContent = p.glut.toLocaleString('de-DE');

    }
    const fl = f?.flask;

    const t = ch == null ? `${mx}` : `${ch}/${mx}`;
    if (this.el.flaskB.textContent !== t) { this.el.flaskB.textContent = t; this.el.flaskI.style.height = ((ch ?? mx) / Math.max(1, mx) * 100).toFixed(0) + '%'; }
    const k = this.ctx.keyLabel?.('flask') || '';
    if (this.el.flaskE.textContent !== k) this.el.flaskE.textContent = k;
    const w = p.get(p.equip.weapon), wn = w ? itemName(w) : 'Fäuste';
    const wk = wn + '|' + p.level;
    if (this.el.wpn.dataset.t !== wk) { this.el.wpn.dataset.t = wk; this.el.wpn.innerHTML = `${w ? itemIcon(w) : '👊'} <span style="color:${w ? RARITIES[w.rarity].css : '#c9c1ae'}">${esc(wn)}</span> · Stufe ${p.level}`; }
  }
  setPrompt(text, action = 'interact') {
    const t = text ? `<kbd>${esc(this.ctx.keyLabel?.(action) || 'E')}</kbd>${esc(text)}` : '';
    if (t === this.promptTxt) return;
    this.promptTxt = t; this.el.prompt.innerHTML = t; this.el.prompt.style.display = t && !this.isOpen ? 'block' : 'none';
  }
  popup(text, color = '#e8dcc0', label = 'Aufgehoben') {
    const d = document.createElement('div'); d.className = 'pop'; d.style.color = color;
    d.innerHTML = (label ? `<small>${esc(label)}</small>` : '') + `<span>${esc(text)}</span>`;
    d.querySelector('span').style.color = color;
    this.el.pops.appendChild(d);
    while (this.el.pops.children.length > 5) this.el.pops.firstChild.remove();

  }
  showTitle(h1, h2 = '', banner = '') {
    const t = this.el.title;

    t.querySelector('h1').textContent = h1; t.querySelector('h2').textContent = h2;
    t.querySelector('hr').style.display = h2 ? '' : 'none';
    void t.offsetWidth; t.classList.add('show');
  }

  // ---------- Screens ----------
  open(id, opt = {}) {
    if (!this.isOpen) this.ctx.onOpen?.();
    this.stack.push({ id, tab: opt.tab || 0, sel: 0, ...opt });
    this.msg = '';
    this.render();
  }
  back() { this.stack.pop(); this.msg = ''; if (!this.isOpen) this.close(); else this.render(); }
  close() { this.stack.length = 0; this.el.panel.classList.remove('open'); this.ctx.onClose?.(); this.el.prompt.style.display = this.promptTxt ? 'block' : 'none'; }
  toggleInventory() { if (this.isOpen) this.close(); else this.open('inventory'); }

  /** Gibt true zurück, wenn die Eingabe verbraucht wurde (Panel offen) */
  handle(o) {
    if (!this.isOpen) return false;
    const s = this.top, rows = this.rows(s), sel = () => rows[s.sel];
    const move = d => { if (!rows.length) return; let k = s.sel; for (let n = 0; n < rows.length; n++) { k = (k + d + rows.length) % rows.length; if (!rows[k].hdr) break; } s.sel = k; this.ctx.sfx?.('ui'); };
    if (s.sel >= rows.length) s.sel = Math.max(0, rows.length - 1);
    if (rows[s.sel]?.hdr) move(1);
    let changed = false;
    if (o.uiUp) { move(-1); changed = true; }
    if (o.uiDown) { move(1); changed = true; }
    if (o.uiLeft && sel()?.left) { sel().left(); changed = true; }
    if (o.uiRight && sel()?.right) { sel().right(); changed = true; }
    const tabs = this.tabs(s);
    if (tabs && (o.uiTabL || o.uiTabR)) { s.tab = (s.tab + (o.uiTabR ? 1 : -1) + tabs.length) % tabs.length; s.sel = 0; this.msg = ''; changed = true; this.ctx.sfx?.('ui'); }
    if (o.uiConfirm && sel() && !sel().dis && sel().ok) { sel().ok(); this.ctx.sfx?.('uiConfirm'); changed = true; }

  }
  onClick(e) {

    if (tab) { this.top.tab = +tab.dataset.tab; this.top.sel = 0; this.render(); return; }
    if (e.target.closest('[data-close]')) { this.close(); return; }

      const s = this.top, rows = this.rows(s), k = +row.dataset.row;
      if (s.sel === k && rows[k]?.ok && !rows[k].dis) rows[k].ok(); else if (rows[k]?.right && e.offsetX > row.clientWidth * 0.6) rows[k].right(); else if (rows[k]?.left && e.offsetX < 40) rows[k].left();
      s.sel = k;

    }
  }

  tabs(s) { return s.id === 'inventory' ? ['Ausrüstung', 'Inventar', 'Zauberbuch', 'Optionen'] : null; }

  /** Zeilen eines Screens: { ic, sl, lb, vl, c, dis, hdr, ok(), left(), right(), tip:()=>html } */
  rows(s) {
    const p = this.ctx.prog, C = this.ctx, R = [];
    const itemRow = (it, extra = {}) => ({ ic: itemIcon(it), lb: itemName(it), c: RARITIES[it.rarity]?.css, tip: () => this.itemTip(it), ...extra });
    const equipped = uid => uid && (p.equip.weapon === uid || p.equip.relics.includes(uid));
    if (s.id === 'inventory') {
      const tab = this.tabs(s)[s.tab];
      if (tab === 'Ausrüstung') {
        const w = p.get(p.equip.weapon);
        R.push({ hdr: true, lb: 'Bewaffnung' });
        R.push({ sl: 'Waffe', ic: w ? itemIcon(w) : '👊', lb: w ? itemName(w) : 'Fäuste', c: w ? RARITIES[w.rarity].css : null, tip: () => w ? this.itemTip(w) : this.textTip('Fäuste', 'Nichts in den Händen. Schnell, aber schwach.'), ok: () => this.open('choose', { slot: 'weapon' }) });
        for (let k = 0; k < 2; k++) {
          const sp = p.equip.spells[k], S = sp ? spellDef(sp) : null;
          R.push({ sl: 'Zauber ' + (k + 1), ic: S?.icon || '·', lb: S ? S.name : '— leer —', tip: () => S ? this.spellTip(sp) : this.textTip('Zauber-Slot', 'Schriftrollen lernen, dann hier ausrüsten.'), ok: () => this.open('choose', { slot: 'spell' + k }) });
        }

        }
        R.push({ hdr: true, lb: 'Werkzeug' });
        const fl = C.fighter?.flask;
        R.push({ sl: 'Flakon', ic: '🧪', lb: `Glutflakon ${fl ? fl.charges + '/' : ''}${p.flaskMax}`, tip: () => this.textTip('Glutflakon', 'Heilt einen Teil deiner Lebenspunkte. Am Leuchtfeuer aufgefüllt. Glutflakon-Splitter erhöhen die Ladungen.') });
        R.push({ sl: 'Stufe', ic: '🔥', lb: `Stufe ${p.level} · Glut ${p.glut}`, tip: () => this.statsTip() });
      } else if (tab === 'Inventar') {
        const order = ['weapon', 'relic', 'scroll', 'consumable', 'sigil'], names = { weapon: 'Waffen', relic: 'Relikte', scroll: 'Schriftrollen', consumable: 'Verbrauchsgüter', sigil: 'Siegel' };
        for (const kind of order) {
          const list = p.inventory.filter(it => it.kind === kind);
          if (!list.length) continue;
          R.push({ hdr: true, lb: names[kind] });
          for (const it of list) R.push(itemRow(it, {
            vl: equipped(it.uid) ? '<span class="eq">◆ ausgerüstet</span>' : '',
            ok: () => {
              if (it.kind === 'weapon') { p.equipItem('weapon', p.equip.weapon === it.uid ? null : it.uid); C.onEquip?.(); }
              else if (it.kind === 'relic') { const k = p.equip.relics.indexOf(it.uid); if (k >= 0) p.equipItem('relic' + k, null); else p.equipItem('relic' + Math.max(0, p.equip.relics.indexOf(null)), it.uid); C.onEquip?.(); }

      } else if (tab === 'Zauberbuch') {

            ok: () => { const slot = k >= 0 ? k : (p.equip.spells.indexOf(null) >= 0 ? p.equip.spells.indexOf(null) : 0); p.equipItem('spell' + (k >= 0 ? (1 - k) : slot), id); C.onEquip?.(); },
            left: () => { p.equipItem('spell0', id); C.onEquip?.(); }, right: () => { p.equipItem('spell1', id); C.onEquip?.(); } });
        }

          const ch = d => { setOption(k, type === 'bool' ? !v : v + d * step); C.onOptionChange?.(k); };
          R.push({ lb: label, vl: `<span class="arr">◂</span> ${val} <span class="arr">▸</span>`, ok: () => ch(1), left: () => ch(-1), right: () => ch(1),
            tip: () => this.textTip(label, type === 'bool' ? 'Bestätigen oder ◂ ▸ zum Umschalten.' : `◂ ▸ ändern (${min} … ${max}).`) });
        }
      }
    } else if (s.id === 'choose') {

      if (slot.startsWith('spell')) {
        if (C.inCombat?.()) this.msg = 'Zauber lassen sich im Kampf nicht wechseln.';
        for (const id of p.learned) { const S = spellDef(id); R.push({ ic: S.icon || '✨', lb: S.name, dis: C.inCombat?.(), vl: p.equip.spells.includes(id) ? '<span class="eq">◆</span>' : '', tip: () => this.spellTip(id), ok: () => { p.equipItem(slot, id); C.onEquip?.(); this.back(); } }); }
      } else {
        const kind = slot === 'weapon' ? 'weapon' : 'relic';
        for (const it of p.inventory.filter(x => x.kind === kind)) R.push(itemRow(it, { vl: equipped(it.uid) ? '<span class="eq">◆</span>' : '', ok: () => { p.equipItem(slot, it.uid); C.onEquip?.(); this.back(); } }));
      }
    } else if (s.id === 'shrine') {
      R.push({ ic: '🔥', lb: 'Rasten', tip: () => this.textTip('Rasten', 'Volle Heilung, Glutflakon auffüllen, Respawn-Punkt setzen. Alle Feinde (außer Bossen) kehren zurück.'), ok: () => { C.onRest?.(); this.msg = 'Du rastest. Die Glut wärmt dich.'; } });
      R.push({ ic: '⬆️', lb: `Stufe aufsteigen`, vl: `${p.nextCost} Glut`, tip: () => this.statsTip(), ok: () => this.open('levelup', { alloc: {} }) });
      R.push({ ic: '📖', lb: 'Zauber wechseln', tip: () => this.textTip('Zauberbuch', `${p.learned.length} Zauber gelernt.`), ok: () => this.open('inventory', { tab: 2 }) });
      R.push({ ic: '🎒', lb: 'Ausrüstung', tip: () => this.textTip('Ausrüstung', 'Waffe, Zauber und Relikte wechseln.'), ok: () => this.open('inventory', { tab: 0 }) });
      R.push({ ic: '⚒️', lb: 'Schmieden', vl: `🪨 ${p.count('forgeStone')}`, tip: () => this.textTip('Schmieden', 'Waffen mit Schmiedesteinen und Glut verstärken (+1 … +5).'), ok: () => this.open('forge') });
      R.push({ ic: '🚪', lb: 'Verlassen', ok: () => this.close() });
    } else if (s.id === 'levelup') {
      const al = s.alloc, k = Object.values(al).reduce((a, b) => a + b, 0), cost = p.costFor(k), next = p.costFor(k + 1);
      for (const [id, name, desc] of ATTRS) {
        R.push({ sl: name, lb: '', vl: `${p.attrs[id]}${al[id] ? ` <span class="arr">→</span> <b style="color:#8fe08f">${p.attrs[id] + al[id]}</b>` : ''} <span class="arr">◂ ▸</span>`,
          tip: () => this.levelTip(s, desc),
          left: () => { if (al[id] > 0) al[id]--; },
          right: () => { if (next <= p.glut) al[id] = (al[id] || 0) + 1; else this.msg = 'Nicht genug Glut.'; },
          ok: () => { if (next <= p.glut) al[id] = (al[id] || 0) + 1; else this.msg = 'Nicht genug Glut.'; } });
      }
      R.push({ ic: '✔', lb: k ? `Bestätigen (+${k} Stufe${k > 1 ? 'n' : ''}, ${cost} Glut)` : 'Bestätigen', dis: !k, tip: () => this.levelTip(s, ''),
        ok: () => { if (C.onLevelUp?.(s.alloc)) { s.alloc = {}; this.msg = `Stufe ${p.level} erreicht.`; } } });
    } else if (s.id === 'forge') {
      const ws = p.inventory.filter(it => it.kind === 'weapon');
      if (!ws.length) R.push({ lb: 'Keine Waffen zum Schmieden.', dis: true });
      for (const it of ws) {
        const u = it.upgrade || 0, c = forgeCost(u), max = u >= UPGRADE_MAX;
        R.push(itemRow(it, { vl: max ? 'max' : `🪨${c.stones} · ${c.glut}`, dis: max, tip: () => this.forgeTip(it), ok: () => { this.msg = C.onForge?.(it.uid) || ''; } }));
      }
    }
    return R;
  }

  // ---------- Tooltips ----------
  itemTip(it) {
    const st = this.ctx.prog.attrs;
    return itemTooltip(it, st).map(l => `<div class="${l.big ? 'big' : ''} ${l.dim ? 'dim' : ''}" style="${l.c ? 'color:' + (l.big ? INK[it.rarity] : l.c === '#9fd4a0' ? '#1a5a1a' : l.c === '#f0c27a' ? '#7a4a00' : l.c) : ''}">${esc(l.t)}</div>`).join('');

  statsTip() {
    const p = this.ctx.prog, d = p.preview(this.ctx.fighter);

      ATTRS.map(([id, n]) => `<tr><td>${n}</td><td class="n">${p.attrs[id]}</td></tr>`).join('') + '</table><hr><table>' +
      [['Lebenspunkte', d.hp], ['Ausdauer', d.sta], ['Mana', d.mana], ['Phys. Schaden', d.phys + ' %'], ['Magie', d.magic + ' %']].map(([n, v]) => `<tr><td>${n}</td><td class="n">${v}</td></tr>`).join('') + '</table>' +
      (Object.keys(p.mods()).length ? '<hr>' + Object.entries(p.mods()).map(([k, v]) => `<div style="color:#1a5a1a">◆ ${esc(formatMod(k, v))}</div>`).join('') : '');
  }
  levelTip(s, desc) {
    const p = this.ctx.prog, al = s.alloc, k = Object.values(al).reduce((a, b) => a + b, 0);
    const na = { ...p.attrs }; for (const a in al) na[a] += al[a];
    const d0 = p.preview(this.ctx.fighter), d1 = p.preview(this.ctx.fighter, na);
    const row = (n, a, b) => `<tr><td>${n}</td><td class="n">${a}</td><td class="n">${a !== b ? `→ <span class="up">${b}</span>` : ''}</td></tr>`;
    return `<div class="big">Stufe ${p.level}${k ? ` → ${p.level + k}` : ''}</div>` + (desc ? `<div class="dim">${esc(desc)}</div>` : '') +
      `<hr><table>${row('Glut', p.glut, p.glut - p.costFor(k))}${row('Kosten', p.costFor(k), p.costFor(k))}<tr><td colspan=3 class="dim">nächste Stufe: ${p.costFor(k + 1) - p.costFor(k)} Glut</td></tr></table><hr><table>` +
      row('Lebenspunkte', d0.hp, d1.hp) + row('Ausdauer', d0.sta, d1.sta) + row('Mana', d0.mana, d1.mana) + row('Phys. Schaden %', d0.phys, d1.phys) + row('Magie %', d0.magic, d1.magic) + row('Heilung %', d0.heal, d1.heal) + '</table>';

  }

  render() {
    const s = this.top; if (!s) return;
    const P = this.el.panel; P.classList.add('open');
    this.el.prompt.style.display = 'none';
    const rows = this.rows(s);
    if (s.sel >= rows.length) s.sel = Math.max(0, rows.length - 1);
    if (rows[s.sel]?.hdr && rows.length > 1) s.sel = rows.findIndex((r, k) => k >= s.sel && !r.hdr);
    if (s.sel < 0) s.sel = 0;
    const title = { inventory: 'Ausrüstung', choose: 'Auswählen', shrine: 'Leuchtfeuer', levelup: 'Stufe aufsteigen', forge: 'Schmiede' }[s.id];
    const tabs = this.tabs(s), K = this.ctx.keyLabel || (() => '');
    const cur = rows[s.sel];
    P.innerHTML = `<div class="ph"><h3>${title}</h3><span class="gl">◆ ${this.ctx.prog.glut} Glut · Stufe ${this.ctx.prog.level}</span><span data-close style="cursor:pointer;padding:0 6px">✕</span></div>` +
      (tabs ? `<div class="tabs"><span class="tk">${esc(K('tabL'))}</span>${tabs.map((t, k) => `<span data-tab="${k}" class="${k === s.tab ? 'on' : ''}">${t}</span>`).join('')}<span class="tk">${esc(K('tabR'))}</span></div>` : '') +
      `<div class="pb"><div class="list">${rows.map((r, k) => r.hdr ? `<div class="row hdr">${esc(r.lb)}</div>` :
        `<div class="row ${k === s.sel ? 'sel' : ''} ${r.dis ? 'dis' : ''}" data-row="${k}">${r.ic != null ? `<span class="ic">${r.ic}</span>` : ''}${r.sl ? `<span class="sl">${esc(r.sl)}</span>` : ''}<span class="lb" style="${r.c ? 'color:' + r.c : ''}">${esc(r.lb)}</span>${r.vl ? `<span class="vl">${r.vl}</span>` : ''}</div>`).join('')}
        <div class="msg">${esc(this.msg)}</div></div>
        <div class="tip">${cur?.tip ? cur.tip() : this.textTip(title, '')}</div></div>` +
      `<div class="pf"><b>${esc(K('confirm'))}</b> wählen · <b>${esc(K('back'))}</b> zurück · <b>${esc(K('nav'))}</b> navigieren${tabs ? ` · <b>${esc(K('tabL'))}/${esc(K('tabR'))}</b> Reiter` : ''}${s.id === 'levelup' || (tabs && s.tab === 3) ? ' · ◂ ▸ ändern' : ''}</div>`;
    const selEl = P.querySelector('.row.sel'); if (selEl) selEl.scrollIntoView({ block: 'nearest' });
  }
}

function findArenas() {
  const sp = world.spawnPoints?.length ? world.spawnPoints : [new THREE.Vector3()];
  const cx = sp.reduce((s, p) => s + p.x, 0) / sp.length, cz = sp.reduce((s, p) => s + p.z, 0) / sp.length;
  const r = rng(seed * 7 + 11), out = [];
  const trees = world.trees || [];
  for (const strict of [1, 0.6, 0.3, 0]) {
    for (let tries = 0; tries < 1500 && out.length < 3; tries++) {
      const a = r() * Math.PI * 2, d = 60 + r() * 90, x = cx + Math.cos(a) * d, z = cz + Math.sin(a) * d;
      if (Math.hypot(x, z) > (world.radius || 200) - 18) continue;
      const h = world.heightAt(x, z);
      if (h < 2) continue;
      let ok = true;
      for (let k = 0; k < 10 && ok; k++) {
        const b = k / 10 * Math.PI * 2, hh = world.heightAt(x + Math.cos(b) * 10, z + Math.sin(b) * 10);
        if (hh < 1.2 || Math.abs(hh - h) > 2.2 + (1 - strict) * 4) ok = false;
      }
      if (!ok) continue;
      if (strict > 0.5 && trees.filter(t => t.state === 0 && (t.x - x) ** 2 + (t.z - z) ** 2 < 81).length > 2) continue;
      if (out.some(o => Math.hypot(o.x - x, o.z - z) < 85 * strict + 25)) continue;
      out.push(new THREE.Vector3(x, h, z));
    }
  }
  while (out.length < 3) out.push(new THREE.Vector3(cx + 70 * Math.cos(out.length * 2.1), 0, cz + 70 * Math.sin(out.length * 2.1)));
  return out;
}
function buildArenaMarkers(pts) {
  for (const p of pts) {
    const b = new MeshBuilder();
    for (let k = 0; k < 7; k++) {
      const a = k / 7 * Math.PI * 2 + 0.3, x = Math.cos(a) * 14, z = Math.sin(a) * 14;
      const y = world.heightAt(p.x + x, p.z + z) - p.y;
      b.box(0.9, 2.4 + (k % 3) * 0.5, 0.7, 0x8a8f96, { x, y: y + 1.0, z, ry: a, rz: (k % 2 - 0.5) * 0.12 });
      b.box(1.0, 0.25, 0.8, 0x6a7078, { x, y: y + 2.3 + (k % 3) * 0.5, z, ry: a });
      if (k % 2 === 0) b.cone(0.22, 0.4, 0xff9a3a, { x, y: y + 2.65 + (k % 3) * 0.5, z }, 5);
    }
    const m = b.mesh(); m.position.copy(p); scene.add(m);
  }
}

/** Welcher Boss-Typ gehört in welchen Slot: Typen mit gleichem Biom, Siegelträger in den key-Slot */
function typeForSlot(slot) {

  const inB = types.filter(t => (bossInfo(t).biome || 'kueste') === slot.biome);
  if (slot.type && ALL_BOSSES[slot.type]) return slot.type;
  if (slot.key) return inB.find(t => bossInfo(t).key) || null;
  const normal = inB.filter(t => !bossInfo(t).key);

// Mob-Zonen: werden erst in Spielernähe gespawnt (Performance), getötete bleiben weg bis zum Rasten
const zones = (world.mobZones || []).map((z, k) => ({ ...z, k, spawned: false, killed: 0, r: rng(seed * 13 + k * 101) }));
function zoneTypes(z) {
  const ids = Object.keys(ENEMY_TYPES || {});
  const want = z.types || BIOMES.find(b => b.id === z.biome)?.mobs || [];
  const list = want.filter(id => ENEMY_TYPES[id]);
  return list.length ? list : ids.filter(id => (ENEMY_TYPES[id].biome || 'kueste') === z.biome);
}

  for (let k = 0; k < n; k++) {
    const a = z.r() * Math.PI * 2, d = Math.sqrt(z.r()) * (z.radius || 10) * 0.8;
    const pos = new THREE.Vector3(z.pos.x + Math.cos(a) * d, 0, z.pos.z + Math.sin(a) * d); pos.y = world.heightAt(pos.x, pos.z);
    if (world.waterLevel !== undefined && pos.y < world.waterLevel + 0.3) continue;
    spawnFoe('mob', types[Math.floor(z.r() * types.length)], pos, { zone: z, yaw: z.r() * 6.28 });
  }
}
function updateZones(active) {

    let d = 1e9; for (const p of active) d = Math.min(d, Math.hypot(p.pos.x - z.pos.x, p.pos.z - z.pos.z));
    if (!z.spawned && d < Math.min(90, (z.radius || 10) + 75)) spawnZone(z);
    else if (z.spawned && d > (z.radius || 10) + 130) { for (const e of foes.filter(e => e.zone === z && e.deadT < 0)) disposeFoe(e); z.spawned = false; }

const foeDead = e => e.b.actor.hp <= 0 || e.b.actor.alive === false;

/** Tod eines Gegners/Bosses: Glut für alle (Koop), Loot in die Welt, Siegel, Musik-Sting */
function rewardFoe(e) {
  e.rewarded = true; kills++;
  const a = e.b.actor, pos = a.pos.clone();
  let table, glut, ctx = {};
  if (e.kind === 'boss') {
    const I = bossInfo(e.type);
    table = I.loot || 'boss_' + e.type;
    glut = I.glut ?? Math.round((I.hp || a.maxHp || 800) * 1.2);
    ctx = { bossType: e.type, key: !e.summoned && (e.key || I.key), biome: e.biome || I.biome || 'kueste' };
    if (e.slotKey) defeated.add(e.slotKey);
  } else {
    const T = ENEMY_TYPES?.[e.type] || {};
    table = T.loot || 'mob_common';
    glut = T.glut;
    if (e.zone) e.zone.killed++;
  }
  const res = rollLoot(table, ctx);
  glut = glut ?? res.glut;
  for (const it of res.items) loot.drop(it, pos, { scatter: e.kind === 'boss' ? 2.2 : 1.2 });
  const active = players.slice(0, SETTINGS.players);
  for (const p of active) {
    const v = p.prog.addGlut(glut);
    const near = Math.hypot(p.pos.x - pos.x, p.pos.z - pos.z) < 80;
    if (near) { let got = 0; const n = clamp(Math.round(4 + glut / 40), 4, e.kind === 'boss' ? 40 : 14); loot.glut.burst(pos, p, n, () => { if (got++ % 3 === 0) sfx('coin', { vol: 0.4, pitch: 0.9 + Math.random() * 0.3 }); }); }
    p.ui.popup(`+${v} Glut`, '#ffd890', '');
  }
  if (e.kind === 'boss') {
    sting('victory');
    for (const p of active) p.ui.showTitle(e.key || bossInfo(e.type).key ? 'Siegelträger gefällt' : 'Großer Feind gefällt', bossInfo(e.type).name || '', 'banner');
  }
}
function updateFoes(dt, plist, active) {

    if (d < (e.kind === 'boss' ? 160 : 110) || e.deadT >= 0) {

}

let audioOn = false;
function startAudio() {
  if (audioOn) return; audioOn = true;
  try { Audio?.init?.(); applyOptions(); lastMusic = ''; } catch (e) { warnOnce('Audio.init', e); }
}
addEventListener('keydown', startAudio, { once: false });

let lastMusic = '', musicT = 0;
function updateMusic(dt, active) {
  if ((musicT -= dt) > 0) return; musicT = 0.5;
  const p = active[0]; if (!p) return;
  let combatKind = null, intensity = 0.25, bd = 45;
  for (const e of foes) {
    if (foeDead(e) || !e.b.awake) continue;
    for (const q of active) {
      const d = Math.hypot(e.b.actor.pos.x - q.pos.x, e.b.actor.pos.z - q.pos.z);
      if (e.kind === 'boss' && d < bd) { bd = d; combatKind = (e.key || bossInfo(e.type).key) ? 'key' : 'boss'; }
      if (e.kind === 'mob' && d < 25) intensity = Math.max(intensity, 0.65);
    }
  }
  if (combatKind) intensity = 1;
  const biome = p.biomeId || 'kueste';
  const key = `${biome}|${combatKind}|${intensity}`;
  if (key === lastMusic) return;
  lastMusic = key;
  try { Audio?.setMusic?.({ biome, combat: combatKind, intensity }); } catch (e) { warnOnce('Audio.setMusic', e); }
}

// ---------- Biome / Interaktion ----------
const visited = new Set();
let biomeT = 0;
function updateBiomes(dt, active) {
  if ((biomeT -= dt) > 0) return; biomeT = 0.3;
  if (typeof world.biomeAt !== 'function') { for (const p of active) if (!p.biomeId) { p.biomeId = 'kueste'; p.ui.showTitle('Graue Küste', 'Viniland'); } return; }
  for (const p of active) {
    let b = null; try { b = world.biomeAt(p.pos.x, p.pos.z); } catch (e) { warnOnce('world.biomeAt', e); }
    if (!b || b.id === p.biomeId) continue;
    p.biomeId = b.id;
    p.ui.showTitle(b.name, visited.has(b.id) ? '' : (b.placeholder ? 'Unerforschtes Land' : 'Neues Gebiet entdeckt'));
    if (!visited.has(b.id)) { if (visited.size) sting('discovery'); visited.add(b.id); }
  }
}
function interactTarget(p) {
  const d = loot.nearest(p.pos, p.i);
  if (d) return { kind: 'drop', d, text: (d.inst.kind === 'glutrest' ? 'Aufheben: ' : 'Aufheben: ') + loot.label(d) };
  for (const s of shrines) if (Math.hypot(s.pos.x - p.pos.x, s.pos.z - p.pos.z) < 3.2) return { kind: 'shrine', s, text: p.prog.kindled.has(s.id) ? 'Am Leuchtfeuer rasten' : 'Leuchtfeuer entzünden' };
  for (const g of gates()) {
    if (g.open) continue;
    const dx = p.pos.x - g.pos.x, dz = p.pos.z - g.pos.z;
    if (Math.hypot(dx, dz) > (g.width || 8) / 2 + 3) continue;
    const has = players.slice(0, SETTINGS.players).some(q => q.prog.hasSigil(g.fromBiome));
    const need = BIOMES.find(b => b.id === g.fromBiome)?.name || g.fromBiome;
    return { kind: 'gate', g, has, text: has ? 'Siegel einsetzen – Nebeltor öffnen' : `Nebeltor – versiegelt (Siegel: ${need})` };
  }
  return null;
}
function pickUp(p, d) {
  if (d.inst.kind === 'glutrest') {
    p.prog.addGlut(d.glut, { raw: true }); if (p.prog.glutrest === d) p.prog.glutrest = null;
    p.ui.popup(`Glutrest geborgen: ${d.glut}`, '#ffd890'); sfx('coin');
  } else {
    const t = p.prog.addItem(d.inst);
    p.prog.applyTo(p.fighter);
    p.ui.popup(t, RARITIES[d.inst.rarity]?.css);
    sfx('pickup');
    if (d.inst.kind === 'sigil') { sting('discovery'); p.ui.showTitle(itemName(d.inst), 'Ein Nebeltor wird sich öffnen', 'banner'); }
  }
  loot.remove(d);
}
function doInteract(p, t) {
  if (!t) return;
  if (t.kind === 'drop') pickUp(p, t.d);
  else if (t.kind === 'shrine') {
    const s = t.s;
    if (!p.prog.kindled.has(s.id)) {
      p.prog.kindled.add(s.id); sting('discovery'); p.ui.showTitle('Leuchtfeuer entzündet', s.name, 'banner');
      p.prog.respawn = { id: s.id, pos: s.pos.clone().add(new THREE.Vector3(1.6, 0, 1.6)) };
    }
    p.shrine = s;
    restAt(p, s);
    p.ui.open('shrine');
  } else if (t.kind === 'gate') {
    if (!t.has) { sfx('block'); p.ui.popup('Das Siegel fehlt.', '#c08070', ''); return; }
    try { world.setGateOpen?.(t.g.id, true); t.g.open = true; } catch (e) { warnOnce('world.setGateOpen', e); }
    sting('discovery'); sfx('gate');
    for (const q of players.slice(0, SETTINGS.players)) q.ui.showTitle('Nebeltor geöffnet', BIOMES.find(b => b.id === t.g.toBiome)?.name || '', 'banner');
  }
}
function updateRpg(p) {
  const f = p.fighter;
  // Tod → Glutrest am Todesort (alter Rest verfällt)
  if (f.state === 'dead' && p.prevState !== 'dead') {
    p.prog.deaths++;
    if (p.prog.glutrest) { loot.remove(p.prog.glutrest); p.prog.glutrest = null; }
    if (p.prog.glut > 0) {
      const inst = { uid: 'rest' + p.i + Date.now(), kind: 'glutrest', rarity: 'legendary', def: 'glutrest' };
      p.prog.glutrest = loot.drop(inst, p.pos, { scatter: 0, owner: p.i, glut: p.prog.glut });
      p.prog.glut = 0;
    }
    sting('death'); p.ui.showTitle('Du bist gefallen', '', 'banner death');
    if (p.ui.isOpen) p.ui.close();
  }
  if (f.state !== 'dead' && p.prevState === 'dead') { p.prog.refillFlask(f); p.prog.dirty = true; }
  p.prevState = f.state;
  if (p.prog.dirty) p.prog.applyTo(f);
  // Interaktion
  const t = f.state === 'dead' ? null : interactTarget(p);
  p.ui.setPrompt(t && !(OPTIONS.autoPickup && t.kind === 'drop' && t.d.inst.kind !== 'sigil') ? t.text : '');
  if (t && t.kind === 'drop' && (t.d.inst.kind === 'glutrest' || OPTIONS.autoPickup) && Math.hypot(t.d.pos.x - p.pos.x, t.d.pos.z - p.pos.z) < 1.3 && t.d.pop <= 0) pickUp(p, t.d);
  else if (p.intent.interactPressed && !p.ui.isOpen) doInteract(p, t);
  p.ui.update();
}

// ---------- Layout ----------
let W = 1, H = 1;
function views() {
  if (SETTINGS.players === 1) return [{ x: 0, y: 0, w: W, h: H }];
  const vertical = SETTINGS.split === 'vertical' || (SETTINGS.split === 'auto' && W >= H);
  return vertical
    ? [{ x: 0, y: 0, w: Math.floor(W / 2), h: H }, { x: Math.floor(W / 2), y: 0, w: W - Math.floor(W / 2), h: H }]
    : [{ x: 0, y: Math.floor(H / 2), w: W, h: H - Math.floor(H / 2) }, { x: 0, y: 0, w: W, h: Math.floor(H / 2) }];
}
function resize() {
  const s = SETTINGS.pixelScale;
  renderer.setPixelRatio(1);
  W = Math.max(2, Math.floor(innerWidth * s)); H = Math.max(2, Math.floor(innerHeight * s));
  renderer.setSize(W, H, false);
  canvas.style.width = innerWidth + 'px'; canvas.style.height = innerHeight + 'px';
  document.body.classList.toggle('solo', SETTINGS.players === 1);
  const vertical = SETTINGS.split === 'vertical' || (SETTINGS.split === 'auto' && innerWidth >= innerHeight);
  document.body.classList.toggle('hsplit', !vertical);
  const kx = innerWidth / W, ky = innerHeight / H;
  views().forEach((v, k) => {
    const r = ui[k].rect; r.x = v.x * kx; r.w = v.w * kx; r.h = v.h * ky; r.y = (H - v.y - v.h) * ky;
    Object.assign(viewEls[k].style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px', display: '' });
  });
  if (SETTINGS.players === 1) viewEls[1].style.display = 'none';
}
addEventListener('resize', resize);

function separateFromEnemies(active) {
  for (const p of active) {
    const c = p.ctrl;
    for (const a of combat.actors) {
      if (a.team === 'player' || a.alive === false || a.hp <= 0) continue;
      if (c.pos.y > a.pos.y + a.height || c.pos.y + c.height < a.pos.y) continue;
      const dx = c.pos.x - a.pos.x, dz = c.pos.z - a.pos.z, d = Math.hypot(dx, dz), min = c.radius + a.radius * 0.9;
      if (d < min) { const nx = d > 1e-4 ? dx / d : 1, nz = d > 1e-4 ? dz / d : 0; c.pos.x = a.pos.x + nx * min; c.pos.z = a.pos.z + nz * min; }
    }
  }
}
function separatePlayers() {
  if (SETTINGS.players < 2) return;
  const a = players[0].ctrl, b = players[1].ctrl;
  const dx = b.pos.x - a.pos.x, dz = b.pos.z - a.pos.z, d = Math.hypot(dx, dz), min = a.radius + b.radius;
  if (d < min && d > 1e-4 && Math.abs(a.pos.y - b.pos.y) < 1.6) {
    const push = (min - d) / 2, nx = dx / d, nz = dz / d;
    a.pos.x -= nx * push; a.pos.z -= nz * push; b.pos.x += nx * push; b.pos.z += nz * push;

}

// ---------- Demo (?demo): P1 plündert das Wrack, rüstet aus, kämpft, sammelt Glut; P2 zeigt das Inventar ----------
