<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Viniland – Tiere</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
<style>
body{margin:0;overflow:hidden;background:#9cc4e0;font-family:sans-serif}
#ui{position:fixed;top:8px;left:8px;display:flex;gap:6px;z-index:2}
button{font-size:15px;padding:8px 12px;border-radius:8px;border:0;background:#fff8e8;box-shadow:0 2px 0 #b08860}
#err{position:fixed;left:0;right:0;bottom:0;color:#fff;background:#a00c;font:13px monospace;white-space:pre-wrap;padding:6px;display:none;z-index:3}
.lbl{position:fixed;transform:translate(-50%,0);color:#4a3020;font-weight:bold;font-size:14px;text-shadow:0 1px 0 #fff8;pointer-events:none;white-space:nowrap}
</style></head><body>
<div id="ui"><button id="mode">Modus: abwechselnd</button><button id="act">Aktion: –</button></div>
<div id="err"></div>
<script>
window.onerror=(m,s,l,c,e)=>{const d=document.getElementById('err');d.style.display='block';d.textContent+=`${m} @${(s||'').split('/').pop()}:${l}\n${e&&e.stack||''}\n`;};
window.addEventListener('unhandledrejection',e=>window.onerror(String(e.reason),'',0,0,e.reason));
</script>
<script type="module">
import * as THREE from 'three';
import { psxMat } from '../js/psx.js';
import { MeshBuilder } from '../js/kit.js';
import { ANIMAL_TYPES, ANIMAL_INFO, createAnimal } from '../js/animals.js';

const Q = new URLSearchParams(location.search);
const ren = new THREE.WebGLRenderer({ antialias: false });
ren.setPixelRatio(Math.min(devicePixelRatio, 2)); ren.setSize(innerWidth, innerHeight);
ren.shadowMap.enabled = true; document.body.appendChild(ren.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9cc4e0); scene.fog = new THREE.Fog(0x9cc4e0, 14, 30);
scene.add(new THREE.HemisphereLight(0xfff2dd, 0x6a8a4a, 1.6));
const sun = new THREE.DirectionalLight(0xffe6c0, 2.2); sun.position.set(4, 8, 6); sun.castShadow = true;
Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 6, bottom: -6 }); sun.shadow.mapSize.set(1024, 1024);
scene.add(sun);

const gap = 1.1, N = ANIMAL_TYPES.length, W = gap * (N - 1);
const g = new MeshBuilder(); g.box(W + 2.5, 0.2, 3, 0x7cb850, { y: -0.1 }); g.box(W + 2.7, 0.15, 3.2, 0x8a6a44, { y: -0.25 });
scene.add(g.mesh());

const animals = ANIMAL_TYPES.map((t, i) => {
  const a = createAnimal(t, 11 + i * 7);
  a.object3D.position.set(-W / 2 + i * gap, 0, 0);
  a.object3D.rotation.y = Q.has('side') ? Math.PI / 2 : 0.5;
  scene.add(a.object3D);
  const el = document.createElement('div'); el.className = 'lbl'; el.textContent = ANIMAL_INFO[t].name; document.body.appendChild(el);
  a.el = el; return a;
});
window.__animals = animals;
setTimeout(() => { document.getElementById('mode').textContent = 'Modus: ' + modes[mode]; document.getElementById('act').textContent = 'Aktion: ' + (acts[act] || '–'); });

let mode = +(Q.get('mode') || 0); const modes = ['abwechselnd', 'laufen', 'stehen'];
const acts = [null, 'eat', 'sit']; let act = +(Q.get('act') || 0);
document.getElementById('mode').onclick = e => { mode = (mode + 1) % 3; e.target.textContent = 'Modus: ' + modes[mode]; };
document.getElementById('act').onclick = e => { act = (act + 1) % 3; e.target.textContent = 'Aktion: ' + (acts[act] || '–'); };

const cam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 60);
addEventListener('resize', () => { ren.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); });
const v = new THREE.Vector3(); let last = performance.now(), T = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  const ang = Q.has('side') ? 0 : Math.sin(T * 0.15) * 0.45;
  if (Q.has('zoom')) { const zx = -W / 2 + (+Q.get('zoom')) * gap; cam.position.set(zx + 0.3, 0.7, 2.6); cam.lookAt(zx + 0.3, 0.15, 0); }
  else { cam.position.set(Math.sin(ang) * 8, 1.9, Math.cos(ang) * 8); cam.lookAt(0, 0.35, 0); }
  animals.forEach((a, i) => {
    const info = ANIMAL_INFO[a.type];
    const moving = mode === 1 || (mode === 0 && i % 2 === 0);
    a.animate(dt, { speed: moving ? (Math.sin(T * 0.3 + i) > 0.3 ? info.run * 0.7 : info.walk) : 0, grounded: true, turn: 0,
                    action: moving ? null : (acts[act] ?? (i % 4 === 1 ? 'eat' : i % 4 === 3 ? 'sit' : null)) });
    v.set(a.object3D.position.x, -0.15, 0.9).project(cam);
    a.el.style.left = ((v.x + 1) / 2 * innerWidth) + 'px'; a.el.style.top = ((1 - v.y) / 2 * innerHeight) + 'px';
  });
  ren.render(scene, cam);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
let tris = 0; animals.forEach(a => a.object3D.traverse(o => { if (o.isMesh) tris += o.geometry.attributes.position.count / 3; }));
console.log('ANIMALS OK tris/avg', Math.round(tris / N));
</script></body></html>
