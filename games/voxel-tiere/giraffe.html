<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Voxel-Tier: Giraffe</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(#ffe9f3,#dff3ff);font-family:system-ui,sans-serif}
  canvas{display:block;touch-action:none}
  .label{position:absolute;transform:translate(-50%,0);padding:4px 10px;border-radius:12px;background:#fffc;color:#6a5a7a;font-size:14px;font-weight:600;pointer-events:none;white-space:nowrap;box-shadow:0 2px 6px #0001}
  #hint{position:absolute;top:10px;width:100%;text-align:center;color:#8a7a9a;font-size:13px;pointer-events:none}
</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="hint">Ziehen zum Drehen &middot; Tippen zum H&uuml;pfen</div>
<div class="label" id="lab0">Giraffe</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const V = 0.1;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
camera.position.set(2.2, 2.2, 5);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.7, 0);
controls.enableDamping = true; controls.enablePan = false;
controls.minDistance = 3; controls.maxDistance = 9;
controls.maxPolarAngle = Math.PI * 0.48;
scene.add(new THREE.HemisphereLight(0xffffff, 0xd8c8ff, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(3, 6, 4); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024); sun.shadow.radius = 4;
Object.assign(sun.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3 });
scene.add(sun);

// Toon shading with a soft 3-step ramp
const ramp = new THREE.DataTexture(new Uint8Array([120, 120, 120, 255, 200, 200, 200, 255, 255, 255, 255, 255]), 3, 1);
ramp.minFilter = ramp.magFilter = THREE.NearestFilter; ramp.needsUpdate = true;
const boxGeo = new THREE.BoxGeometry(V, V, V);
const mat = new THREE.MeshToonMaterial({ gradientMap: ramp });
function voxels(list) {
  const m = new THREE.InstancedMesh(boxGeo, mat, Math.max(list.length, 1));
  const o = new THREE.Object3D(), c = new THREE.Color();
  list.forEach(([x, y, z, col], i) => {
    o.position.set(x * V, y * V, z * V); o.updateMatrix();
    m.setMatrixAt(i, o.matrix); m.setColorAt(i, c.set(col));
  });
  m.count = list.length;
  m.castShadow = m.receiveShadow = true;
  return m;
}
function fill(out, x0, x1, y0, y1, z0, z1, col, test) {
  for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) for (let z = z0; z <= z1; z++)
    if (!test || test(x, y, z)) out.push([x, y, z, typeof col === 'function' ? col(x, y, z) : col]);
}
const part = (list, px = 0, py = 0, pz = 0) => {
  const g = new THREE.Group(); g.add(voxels(list)); g.position.set(px * V, py * V, pz * V); return g;
};
// Big shiny eyes (2x2 black + white highlight) and blush
function makeEyes(gap, ey, z, blushCol = '#ff9fb8') {
  const eyes = [], blush = [];
  for (const s of [-1, 1]) {
    const cx = s * gap;
    fill(eyes, cx - 1, cx, ey - 1, ey, z, z, '#2a2238');
    eyes.push([cx - 1, ey, z + 0.6, '#ffffff']);
    blush.push([s * (gap + 1), ey - 3, z, blushCol], [s * gap, ey - 3, z, blushCol]);
  }
  const g = new THREE.Group(), em = voxels(eyes); g.add(em);
  g.position.y = ey * V; em.position.y = -ey * V;
  return { eyes: g, blush: voxels(blush) };
}
// Generic chibi quadruped
function quad(o) {
  const root = new THREE.Group(), body = new THREE.Group(); root.add(body);
  const { w, h, l, legH, hw, hh, hd } = o;
  const torso = []; fill(torso, -w, w, 0, h, -l, l, o.bodyCol,
    (x, y, z) => !(Math.abs(x) === w && (y === 0 || y === h) && Math.abs(z) === l));
  if (o.torsoVox) o.torsoVox(torso);
  const torsoG = part(torso, 0, legH, 0); body.add(torsoG);
  const neck = new THREE.Group(); neck.position.set(0, (legH + h) * V, l * V); body.add(neck);
  const hl = []; fill(hl, -hw, hw, 0, hh, -hd, hd, o.headCol,
    (x, y, z) => !(Math.abs(x) === hw && (y === 0 || y === hh) && Math.abs(z) === hd));
  if (o.headVox) o.headVox(hl);
  const headG = part(hl, 0, o.headUp ?? -1, o.headFwd ?? hd); neck.add(headG);
  const f = makeEyes(o.eyeGap ?? 2, o.ey ?? hh - 2, hd + 1); headG.add(f.eyes, f.blush);
  const limbs = [];
  for (const [sx, sz] of [[-1, 1], [1, 1], [-1, -1], [1, -1]]) {
    const lg = []; fill(lg, -1, 0, -legH, -1, -1, 0, o.legCol);
    if (o.legVox) o.legVox(lg, legH);
    const g = part(lg, sx * (w - 1) + (sx > 0 ? 1 : 0), legH, sz * (l - 1) + (sz > 0 ? 1 : 0));
    limbs.push(g); body.add(g);
  }
  const tl = []; if (o.tailVox) o.tailVox(tl);
  const tail = part(tl, 0, legH + h - 1, -l - 1); body.add(tail);
  const a = { root, body, torso: torsoG, neck, head: headG, eyes: f.eyes, limbs, tail, phase: 0, extra: {} };
  if (o.extra) o.extra(a);
  return a;
}
function tileBase(top, side, deco) {
  const t = [];
  fill(t, -9, 9, -2, 0, -7, 7, (x, y, z) => {
    if (y === 0) return top[((x * 7 + z * 13) & 1) ? 0 : ((x + z) % 3 === 0 ? 2 : 1)];
    return y === -1 ? side[0] : side[1];
  }, (x, y, z) => !(Math.abs(x) === 9 && Math.abs(z) === 7));
  if (deco) deco(t);
  const g = voxels(t); g.position.y = -V * 0.5; scene.add(g); return g;
}
tileBase(['#f2dc8e', '#e9cf7c', '#f7e6a6'], ['#d9a96f', '#c48f5a'], t => {
  for (const [x, z] of [[-7, 5], [7, -5], [6, 5], [-8, -4]]) { t.push([x, 1, z, '#9cc56a'], [x, 2, z, '#b4d97a']); }
  t.push([-6, 1, -5, '#c9b39a'], [-5, 1, -5, '#c9b39a'], [-6, 2, -5, '#d8c6af']);
});
const YE = '#f7cf6a', SP = '#c7782f', CR = '#fff1c6';
const spot = (x, y, z) => (((x * 3 + y * 5 + z * 7) % 5 + 5) % 5 === 0 ? SP : YE);
const animal = quad({ w: 3, h: 4, l: 4, legH: 5, hw: 3, hh: 5, hd: 3, eyeGap: 2, ey: 4,
  headUp: 9, headFwd: 2,
  bodyCol: spot, headCol: (x, y, z) => (z >= 2 && y <= 1 ? CR : YE), legCol: (x, y) => (y === -5 ? '#7a5030' : spot(x, y, 0)),
  headVox: hl => { hl.push([-2, 6, -1, SP], [-2, 7, -1, '#9a5a28'], [1, 6, -1, SP], [1, 7, -1, '#9a5a28'], [-4, 4, -1, YE], [4, 4, -1, YE]); },
  tailVox: tl => { for (let i = 0; i < 4; i++) tl.push([0, -i, 0, YE]); tl.push([0, -4, 0, '#7a5030']); },
  extra: a => {
    const n = []; fill(n, -1, 1, -1, 9, -1, 1, (x, y, z) => (z === -1 && x === 0 ? '#a8602a' : spot(x, y, z)));
    a.extra.neckVox = part(n, 0, 0, 1); a.neck.add(a.extra.neckVox);
  } });
animal.phase = 0.9;
function idle(a, s, t) {
  // long neck sway, reaching to nibble leaves
  const r = (t % 9) / 9, nib = r > 0.7 ? Math.sin((r - 0.7) / 0.3 * Math.PI) : 0;
  a.neck.rotation.x = 0.1 + Math.sin(s * 0.45) * 0.06 + nib * 0.15;
  a.neck.rotation.z = Math.sin(s * 0.3) * 0.08;
  a.head.rotation.x = -nib * 0.3; a.head.position.y = (9 + Math.sin(t * 14) * nib * 0.3) * V;
  a.tail.rotation.z = Math.sin(s * 1.7) * 0.5;
}
const tree = []; fill(tree, 0, 0, 1, 12, 0, 0, '#8a5a3a');
fill(tree, -3, 3, 12, 14, -3, 3, (x, y, z) => ((x + z + y) % 3 ? '#8ccf6a' : '#a4dd7c'), (x, y, z) => x * x + z * z <= 10 - (y - 12) * 2);
const treeG = voxels(tree); treeG.position.set(0.6, -V * 0.5, 0.45); scene.add(treeG);
animal.root.position.set(0, V * 0.5, 0);
animal.root.rotation.y = 0.35;
animal.hop = -1; animal.blink = 2 + Math.random() * 2;
scene.add(animal.root);

const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let down = null;
renderer.domElement.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 8) return;
  ptr.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1);
  ray.setFromCamera(ptr, camera);
  if (ray.intersectObject(animal.root, true).length && animal.hop < 0) animal.hop = 0;
});
function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.position.setLength(innerWidth < innerHeight ? 7 : 5.5);
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const label = document.getElementById('lab0');
const tmp = new THREE.Vector3(), clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  const a = animal, s = t * 2.4 + a.phase;
  let y = 0, sq = 1 + Math.sin(s * 2) * 0.025;
  if (a.hop >= 0) {
    a.hop += dt * 2.2;
    const hp = Math.min(a.hop, 1);
    y = Math.sin(hp * Math.PI) * 0.5; sq = 1 + Math.sin(hp * Math.PI) * 0.12;
    a.limbs.forEach((l, k) => { l.rotation.x = Math.sin(hp * Math.PI) * (k < 2 ? -0.5 : 0.5); });
    if (a.hop >= 1) { a.hop = -1; a.limbs.forEach(l => l.rotation.x = 0); }
  }
  a.body.position.y = y + Math.abs(Math.sin(s)) * 0.015;
  a.body.scale.set(1 / Math.sqrt(sq), sq, 1 / Math.sqrt(sq));
  idle(a, s, t, dt);
  a.blink -= dt;
  a.eyes.scale.y = a.blink < 0.12 ? 0.15 : (a.sleepy ?? 1);
  if (a.blink < 0) a.blink = 2 + Math.random() * 3;
  tmp.setFromMatrixPosition(a.root.matrixWorld); tmp.y -= 0.25; tmp.project(camera);
  label.style.left = (tmp.x * 0.5 + 0.5) * innerWidth + 'px';
  label.style.top = (-tmp.y * 0.5 + 0.5) * innerHeight + 'px';
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
