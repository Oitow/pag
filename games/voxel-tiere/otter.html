<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Voxel-Tier: Otter</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(#e3f4ff,#fdf0f7);font-family:system-ui,sans-serif}
  canvas{display:block;touch-action:none}
  .label{position:absolute;transform:translate(-50%,0);padding:4px 10px;border-radius:12px;background:#fffc;color:#5a6a8a;font-size:14px;font-weight:600;pointer-events:none;white-space:nowrap;box-shadow:0 2px 6px #0001}
  #hint{position:absolute;top:10px;width:100%;text-align:center;color:#7a8aa8;font-size:13px;pointer-events:none}
</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="hint">Ziehen zum Drehen &middot; Tippen zum H&uuml;pfen</div>
<div class="label" id="lab">Otter</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const V = 0.1;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
camera.position.set(0, 2.2, 5.5);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.5, 0);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 2.5; controls.maxDistance = 8;
controls.maxPolarAngle = Math.PI * 0.48;

scene.add(new THREE.HemisphereLight(0xffffff, 0xc8d8ff, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(3, 6, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.radius = 4;
Object.assign(sun.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3 });
scene.add(sun);

const boxGeo = new THREE.BoxGeometry(V, V, V);
const mat = new THREE.MeshLambertMaterial();
const glass = new THREE.MeshLambertMaterial({ transparent: true, opacity: 0.72 });

function voxels(list, m0) {
  const m = new THREE.InstancedMesh(boxGeo, m0 || mat, list.length);
  const o = new THREE.Object3D(), c = new THREE.Color();
  list.forEach(([x, y, z, col], i) => {
    o.position.set(x * V, y * V, z * V); o.updateMatrix();
    m.setMatrixAt(i, o.matrix); m.setColorAt(i, c.set(col));
  });
  m.castShadow = m.receiveShadow = true;
  return m;
}
function fill(out, x0, x1, y0, y1, z0, z1, col, test) {
  for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) for (let z = z0; z <= z1; z++)
    if (!test || test(x, y, z)) out.push([x, y, z, typeof col === 'function' ? col(x, y, z) : col]);
}
const part = (list, px = 0, py = 0, pz = 0, m0) => {
  const g = new THREE.Group(); g.add(voxels(list, m0)); g.position.set(px * V, py * V, pz * V); return g;
};
function makeEyes(gap, ey, z) {
  const eyes = [], blush = [];
  for (const s of [-1, 1]) {
    const cx = s * gap;
    fill(eyes, cx - 1, cx, ey - 1, ey, z, z, '#2a2238');
    eyes.push([cx - 1, ey, z + 0.6, '#ffffff']);
    blush.push([s * (gap + 1), ey - 3, z, '#ff9fb8'], [s * (gap + 1) - s, ey - 3, z, '#ff9fb8']);
  }
  const g = new THREE.Group(), em = voxels(eyes); g.add(em);
  g.position.y = ey * V; em.position.y = -ey * V;
  return { eyes: g, blush: voxels(blush) };
}
const ell = (x, y, z, cx, cy, cz, rx, ry, rz) => ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 + ((z - cz) / rz) ** 2 <= 1;

// ---------- Tile ----------
function makeTile(kind) {
  const t = [], deco = [];
  const water = (x, y, z) => y === 0 ? ['#8fd3f4', '#a6def7', '#9ad8f5'][(x * 7 + z * 13 & 3) % 3] : y === -1 ? '#6fbfe8' : '#5aa9d6';
  const sand = (x, y, z) => y === 0 ? ['#f6dfa6', '#efd598', '#f9e7b8'][(x * 5 + z * 11 & 3) % 3] : y === -1 ? '#e2c084' : '#d1ab70';
  fill(t, -10, 10, -2, 0, -7, 7, kind === 'sand' ? sand : water);
  if (kind === 'ice') {
    fill(t, -7, 7, 1, 1, -5, 5, (x, y, z) => ((x + z) % 4 === 0 ? '#dff0fb' : '#f4fbff'), (x, y, z) => ell(x, 0, z, 0, 0, 0, 7.5, 1, 5.5));
    deco.push([8, 1, 5, '#f4fbff'], [8, 2, 5, '#e6f4fc'], [-9, 1, -5, '#f4fbff']);
  }
  if (kind === 'sand') {
    deco.push([-8, 1, 5, '#ffb3c8'], [-7, 1, 5, '#ffc7d6'], [8, 1, -5, '#fff1d0'], [7, 1, 4, '#c9b6ff'], [-6, 1, -5, '#ffffff']);
    fill(deco, 6, 9, 0.2, 0.2, -2, 1, '#9ad8f5');
  }
  if (kind === 'reef') {
    for (const [x, z, h, c] of [[-7, -4, 5, '#7fd6a0'], [-6, -5, 3, '#95e3b2'], [7, -4, 4, '#7fd6a0'], [8, 3, 3, '#ffa8c0'], [-8, 4, 2, '#ffd27a']])
      for (let y = 1; y <= h; y++) deco.push([x + (y % 2), y, z, c]);
  }
  const g = new THREE.Group(); g.add(voxels(t)); if (deco.length) g.add(voxels(deco));
  g.position.y = -V * 0.5; scene.add(g); return g;
}

makeTile('water');
function makeAnimal() {
  const root = new THREE.Group(), body = new THREE.Group(); root.add(body);
  const Br = '#a5714e', Bd = '#8a5a3c', Cr = '#f0d4ae';
  const b = []; fill(b, -3, 3, 0, 6, -2, 2, (x, y, z) => (z === 2 && Math.abs(x) <= 1 ? Cr : Br), (x, y, z) => !(Math.abs(x) === 3 && Math.abs(z) === 2));
  body.add(part(b));
  const h = []; fill(h, -3, 3, 0, 5, -2, 2, Br, (x, y, z) => !(Math.abs(x) === 3 && (y === 0 || y === 5)));
  fill(h, -2, 2, 0, 2, 3, 3, Cr); h.push([0, 2, 4, '#3a2a2a'], [-1, 2, 4, Cr], [1, 2, 4, Cr]);
  for (const s of [-1, 1]) h.push([s * 3, 5, 0, Bd], [s * 3, 6, 0, Bd], [s * 3, 1, 4, '#ffffff'], [s * 4, 1, 4, '#ffffff']);
  const head = part(h, 0, 7, 0); body.add(head);
  const f = makeEyes(2, 4, 3); head.add(f.eyes, f.blush);
  const limbs = [];
  for (const s of [-1, 1]) {
    const l = []; fill(l, 0, 0, -2, 0, 0, 0, Bd); l.push([0, -2, 1, Bd]);
    const g = part(l, s * 2, 5, 3); limbs.push(g); body.add(g);
  }
  const sh = []; fill(sh, -1, 1, 0, 1, 0, 0, (x, y) => ((x + y) % 2 ? '#ffd0dc' : '#ffe4ec')); sh.push([0, 2, 0, '#ffd0dc']);
  const shell = part(sh, 0, 2, 4); body.add(shell);
  const tl = []; for (let i = 0; i < 6; i++) tl.push([0, 0, -i, Bd]);
  const tail = part(tl, 0, 1, -3); body.add(tail);
  return { root, body, head, eyes: f.eyes, baseY: -2,
    idle(t, s) {
      body.position.y += Math.sin(t * 1.4) * 0.04;
      body.rotation.z = Math.sin(t * 1.4) * 0.06;
      const rub = Math.sin(t * 9) * (Math.sin(t * 0.7) > 0 ? 1 : 0.15);
      limbs[0].position.x = (-2 + rub * 0.5) * V; limbs[1].position.x = (2 - rub * 0.5) * V;
      shell.rotation.z = rub * 0.15;
      head.rotation.z = Math.sin(t * 0.9) * 0.12; head.rotation.x = -0.1;
      tail.rotation.y = Math.sin(t * 2) * 0.4;
    } };
}

const a = makeAnimal();
a.root.position.set(0, a.baseY * V, 0);
a.root.rotation.y = 0.35;
a.hop = -1; a.blink = 2 + Math.random() * 2;
scene.add(a.root);

const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let down = null;
renderer.domElement.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 8) return;
  ptr.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1);
  ray.setFromCamera(ptr, camera);
  if (ray.intersectObject(a.root, true).length && a.hop < 0) a.hop = 0;
});
function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.position.setLength(innerWidth < innerHeight ? 6.2 : 4.8);
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const label = document.getElementById('lab');
const tmp = new THREE.Vector3(), clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime, s = t * 2.4;
  let y = 0, sq = 1 + Math.sin(s * 2) * 0.03;
  if (a.hop >= 0) {
    a.hop += dt * 2.2;
    const h = Math.min(a.hop, 1);
    y = Math.sin(h * Math.PI) * 0.6; sq = 1 + Math.sin(h * Math.PI) * 0.12;
    if (a.hop >= 1) a.hop = -1;
  }
  a.body.position.y = y + Math.abs(Math.sin(s)) * 0.02;
  a.body.scale.set(1 / Math.sqrt(sq), sq, 1 / Math.sqrt(sq));
  a.idle(t, s, dt);
  a.blink -= dt;
  a.eyes.scale.y = a.blink < 0.12 ? 0.15 : 1;
  if (a.blink < 0) a.blink = 2 + Math.random() * 3;
  tmp.setFromMatrixPosition(a.root.matrixWorld); tmp.y -= 0.25; tmp.project(camera);
  label.style.left = (tmp.x * 0.5 + 0.5) * innerWidth + 'px';
  label.style.top = (-tmp.y * 0.5 + 0.5) * innerHeight + 'px';
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
