<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Voxel-Tier: Gorilla</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(#dcf5dc,#e6f6ff);font-family:system-ui,sans-serif}
  canvas{display:block;touch-action:none}
  .label{position:absolute;transform:translate(-50%,0);padding:4px 10px;border-radius:12px;background:#fffc;color:#6a5a7a;font-size:15px;font-weight:600;pointer-events:none;white-space:nowrap;box-shadow:0 2px 6px #0001}
  #hint{position:absolute;top:10px;width:100%;text-align:center;color:#8a7a9a;font-size:13px;pointer-events:none}
</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="hint">Ziehen zum Drehen · Tippen zum Hüpfen</div>
<div class="label" id="lab">Gorilla</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const V = 0.1;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
camera.position.set(0, 2.0, 5);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.55, 0);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 2.5; controls.maxDistance = 8;
controls.maxPolarAngle = Math.PI * 0.48;

scene.add(new THREE.HemisphereLight(0xffffff, 0xd8c8ff, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(3, 6, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.radius = 4;
Object.assign(sun.shadow.camera, { left: -2.5, right: 2.5, top: 2.5, bottom: -2.5 });
scene.add(sun);

const boxGeo = new THREE.BoxGeometry(V, V, V);
// Toon shading with a soft 3-step gradient
const grad = new THREE.DataTexture(new Uint8Array([140, 200, 255]), 3, 1, THREE.RedFormat);
grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
const mat = new THREE.MeshToonMaterial({ gradientMap: grad });

function voxels(list) {
  const m = new THREE.InstancedMesh(boxGeo, mat, Math.max(list.length, 1));
  const o = new THREE.Object3D(), c = new THREE.Color();
  list.forEach(([x, y, z, col], i) => {
    o.position.set(x * V, y * V, z * V); o.updateMatrix();
    m.setMatrixAt(i, o.matrix); m.setColorAt(i, c.set(col));
  });
  m.count = list.length;
  m.castShadow = m.receiveShadow = true;
  return m;
}
function fill(out, x0, x1, y0, y1, z0, z1, col, test) {
  for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) for (let z = z0; z <= z1; z++)
    if (!test || test(x, y, z)) out.push([x, y, z, typeof col === 'function' ? col(x, y, z) : col]);
}
const part = (list, px = 0, py = 0, pz = 0) => {
  const g = new THREE.Group(); g.add(voxels(list)); g.position.set(px * V, py * V, pz * V); return g;
};
// Big shiny eyes (2x3 black with white sparkle) + blush, pivoting at eye height for blinking
function makeEyes(gap, ey, z, blushCol = '#ff9fb8', eyeCol = '#2a2238') {
  const eyes = [], blush = [];
  for (const s of [-1, 1]) {
    const cx = s * gap;
    fill(eyes, cx - 1, cx, ey - 1, ey + 1, z, z, eyeCol);
    eyes.push([cx - 1, ey + 1, z + 0.6, '#ffffff']);
    eyes.push([cx, ey - 1, z + 0.6, '#ffffff']);
    blush.push([s * (gap + 1), ey - 3, z, blushCol], [s * (gap + 1) - s, ey - 3, z, blushCol]);
  }
  const g = new THREE.Group(), em = voxels(eyes);
  g.add(em); g.position.y = ey * V; em.position.y = -ey * V;
  return { eyes: g, blush: voxels(blush) };
}
const ell = (cx, cy, cz, rx, ry, rz) => (x, y, z) =>
  ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 + ((z - cz) / rz) ** 2 <= 1;
const noise = (x, y, z) => ((x * 73856093) ^ (y * 19349663) ^ (z * 83492791)) >>> 0;


function legSet(body, pos, h, col, foot, w = 2) {
  return pos.map(([x, z]) => { const l = []; fill(l, 0, w - 1, -h, -1, 0, w - 1, (xx, y) => (foot && y === -h ? foot : col)); const g = part(l, x, h, z); body.add(g); return g; });
}
const R = (n) => Math.round(n);

const TILE = { r: 9, top: ["#7fcf6e","#6fc060","#8cdc7a"], side: ["#c9a07a","#b08560"], deco: [
  [-7,1,4,'#3f9a4a'],[-7,2,4,'#3f9a4a'],[-6,2,4,'#4fb05a'],[-8,2,4,'#4fb05a'],[-7,3,4,'#ff5a6a'],
  [6,1,-5,'#ffd84a'],[7,1,-5,'#ffd84a'],[6,1,-6,'#e8c03a'],[7,1,4,'#ff8fc0'],[-4,1,-7,'#4fb05a'],[-4,2,-7,'#3f9a4a']] };
function makeAnimal() {
  const root = new THREE.Group(), body = new THREE.Group(); root.add(body);
  const B = '#2a2a30', Sk = '#4b4552', Sv = '#a9a9b3';
  const torso = []; fill(torso, -5, 5, 0, 8, -4, 3, (x, y, z) => (z >= 2 && Math.abs(x) <= 2 && y >= 3 && y <= 6 ? Sk : z <= -2 && y >= 3 ? Sv : B), ell(0, 4, 0, 5.4, 4.6, 4.2));
  body.add(part(torso, 0, 2, 0));
  const limbs = [];
  for (const sx of [-1, 1]) {
    const l = []; fill(l, -1, 1, 0, 2, -1, 2, B); fill(l, -1, 1, 0, 0, 3, 3, Sk); const lg = part(l, sx * 3, 0, -1); body.add(lg); limbs.push(lg);
    const ar = []; fill(ar, -1, 1, -9, 0, -1, 1, (x, y) => (y <= -8 ? Sk : B)); const ag = part(ar, sx * 6, 10, 1); body.add(ag); limbs.push(ag);
  }
  const hd = []; fill(hd, -3, 3, 0, 5, -2, 3, (x, y, z) => (z === 3 && Math.abs(x) <= 2 && y <= 4 ? Sk : B), (x, y, z) => !(Math.abs(x) === 3 && y === 5));
  fill(hd, -1, 1, 6, 6, -2, 1, B); fill(hd, -3, 2, 5, 5, 4, 4, B);
  fill(hd, -2, 2, 0, 1, 4, 4, '#5a5260'); hd.push([-1, 1, 5, '#16161a'], [1, 1, 5, '#16161a']);
  const headG = part(hd, 0, 10, 1); body.add(headG);
  const f = makeEyes(2, 3, 4, '#c98a9a', '#1a1210'); headG.add(f.eyes, f.blush);
  const ears = [part([[0, 0, 0, Sk]], -4, 3, 0), part([[0, 0, 0, Sk]], 4, 3, 0)]; ears.forEach(e => headG.add(e));
  return { root, body, head: headG, eyes: f.eyes, limbs, tail: null, ears, sc: 0.85 };
}
// Calm sway, then a proud chest-beat every few seconds
function idle(a, s, t, hopping) {
  const c = t % 6, beat = c < 1.4 ? Math.sin(c / 1.4 * Math.PI) : 0;
  const arms = [a.limbs[1], a.limbs[3]];
  arms.forEach((ar, k) => {
    const d = k ? 1 : -1;
    ar.rotation.x = -beat * (1.6 + Math.sin(t * 24 + k * Math.PI) * 0.25);
    ar.rotation.z = -d * beat * 0.6 + d * 0.05;
  });
  a.head.rotation.x = -beat * 0.25;
  a.head.rotation.y = beat ? 0 : Math.sin(t * 0.5) * 0.3;
  a.body.rotation.z = Math.sin(s * 0.4) * 0.03;
}

// ---------- Tile ----------
const tileV = [];
fill(tileV, -TILE.r, TILE.r, -2, 0, -TILE.r, TILE.r, (x, y, z) => {
  if (y === 0) return TILE.top[noise(x, 1, z) % TILE.top.length];
  return y === -1 ? TILE.side[0] : TILE.side[1];
}, (x, y, z) => x * x + z * z <= TILE.r * TILE.r + 2);
TILE.deco.forEach(d => tileV.push(d));
const ground = voxels(tileV); ground.position.y = -V * 0.5; scene.add(ground);

const a = makeAnimal();
a.root.position.set(0, V * 0.5, 0);
a.root.rotation.y = 0.3; a.root.scale.setScalar(a.sc || 1);
a.hop = -1; a.blink = 2 + Math.random() * 2;
scene.add(a.root);

// ---------- Interaction ----------
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let down = null;
renderer.domElement.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 8) return;
  ptr.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1);
  ray.setFromCamera(ptr, camera);
  if (ray.intersectObject(a.root, true).length && a.hop < 0) a.hop = 0;
});

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.position.setLength(innerWidth < innerHeight ? 6 : 4.6);
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const label = document.getElementById('lab');
const tmp = new THREE.Vector3(), clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  const s = t * 2.4;
  let y = 0, sq = 1 + Math.sin(s * 2) * 0.03;
  if (a.hop >= 0) {
    a.hop += dt * 2.2;
    const h = Math.min(a.hop, 1);
    y = Math.sin(h * Math.PI) * 0.6; sq = 1 + Math.sin(h * Math.PI) * 0.12;
    if (a.hop >= 1) a.hop = -1;
  }
  a.body.position.y = y + Math.abs(Math.sin(s)) * 0.02;
  a.body.scale.set(1 / Math.sqrt(sq), sq, 1 / Math.sqrt(sq));
  a.blink -= dt;
  a.eyes.scale.y = a.blink < 0.12 ? 0.15 : 1;
  if (a.blink < 0) a.blink = 2 + Math.random() * 3;
  idle(a, s, t, a.hop >= 0);
  tmp.setFromMatrixPosition(a.root.matrixWorld); tmp.y -= 0.3; tmp.project(camera);
  label.style.left = (tmp.x * 0.5 + 0.5) * innerWidth + 'px';
  label.style.top = (-tmp.y * 0.5 + 0.5) * innerHeight + 'px';
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
