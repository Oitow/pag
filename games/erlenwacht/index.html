<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Erlenwacht – die vereinte Welt</title>
<meta name="description" content="Erlenwacht-Sandbox: eine große Welt aus dem PAG-Baukasten – Küste, Dämmerwald, Siedlung, Hochland – mit Figur, Zaubern und Gegnern als ansteckbare Module.">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
<style>
  :root { --panel: rgba(14,18,22,.8); --text: #eef1f4; --dim: #a6b0ba; --akzent: #e0b56a; --rand: rgba(255,255,255,.12); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b2226; color: var(--text); font: 14px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .panel { background: var(--panel); border: 1px solid var(--rand); border-radius: 10px; backdrop-filter: blur(4px); }
  #oben { position: fixed; top: max(8px, env(safe-area-inset-top)); left: 8px; display: flex; gap: 6px; align-items: center; padding: 4px 6px; z-index: 4; }
  #oben a { color: var(--dim); text-decoration: none; padding: 0 4px; }
  button, select { font: inherit; color: var(--text); background: #2a3340; border: 1px solid var(--rand); border-radius: 8px; padding: 6px 10px; min-height: 40px; min-width: 40px; cursor: pointer; }
  #info { position: fixed; left: 8px; top: calc(max(8px, env(safe-area-inset-top)) + 54px); padding: 5px 8px; font-size: 12px; color: var(--dim); pointer-events: none; z-index: 4; max-width: 70vw; }
  #info b { color: var(--text); }
  #menue { position: fixed; top: 60px; right: 8px; padding: 10px; z-index: 6; max-height: 75vh; overflow: auto; width: min(300px, 92vw); }
  #menue[hidden], #lade[hidden], #fehler[hidden] { display: none; }
  #menue h3 { margin: 4px 0 6px; font-size: 14px; color: var(--akzent); }
  #menue label { display: flex; gap: 8px; align-items: center; padding: 5px 0; }
  #menue input { width: 20px; height: 20px; }
  #orte { display: flex; flex-wrap: wrap; gap: 4px; }
  #orte button { min-height: 34px; padding: 4px 8px; font-size: 13px; }
  #lade { position: fixed; inset: 0; display: grid; place-items: center; background: #11161a; font-size: 1.1rem; z-index: 8; text-align: center; }
  #lade small { display: block; color: var(--dim); margin-top: 6px; }
  #fehler { position: fixed; left: 8px; right: 8px; bottom: 120px; padding: 10px; background: #5a1f1f; border-radius: 8px; white-space: pre-wrap; font: 12px monospace; z-index: 9; max-height: 40vh; overflow: auto; pointer-events: auto; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="oben" class="panel">
  <a id="back" href="../../">← Spiele</a>
  <button id="menueKnopf" title="Module, Orte, Optionen">☰</button>
</div>
<div id="info" class="panel">…</div>
<div id="menue" class="panel" hidden>
  <h3>Orte</h3><div id="orte"></div>
  <h3>Module</h3><div id="modulListe"></div>
  <button id="neuLaden" style="margin-top:6px;width:100%">Mit dieser Auswahl neu laden</button>
</div>
<div id="lade"><div>Erlenwacht wird gebaut …<small id="ladeText">Module starten</small></div></div>
<pre id="fehler" hidden></pre>
<script type="module" src="js/main.js"></script>
</body>
</html>
