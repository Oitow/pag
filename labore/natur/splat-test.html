<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Splat-Test – Gauß-Wolke</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b3540; color: #eef1f4; font: 13px/1.35 system-ui, sans-serif; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #info { position: fixed; left: 8px; bottom: 8px; padding: 3px 8px; background: rgba(18,22,28,.6); border-radius: 8px; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">Splat-Test</div>
<script type="module">
// Sicht-Prüfung für engine/render/gauss-wolke.js: Splat-Kugel im Mesh-Ring (Verdeckung vorn/hinten), weiche Blobs, Farbvergleich Mesh ↔ Splat.
// ?n=30000 Splats auf der Kugel · ?nebel=0.02 · ?still (Kamera steht)
import * as THREE from 'three';
import { createGaussWolke } from '../../engine/render/gauss-wolke.js';
import { createSplatDaten, saatAufNetz } from '../../engine/render/gauss-saat.js';
import { rng } from '../../engine/core/rng.js';

const url = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const szene = new THREE.Scene();
const nebelFarbe = new THREE.Color(0.34, 0.42, 0.5), nebelDichte = +(url.get('nebel') ?? 0.012);
szene.background = nebelFarbe;
szene.fog = new THREE.FogExp2(nebelFarbe, nebelDichte);
const kamera = new THREE.PerspectiveCamera(50, 1, 0.1, 500);
szene.add(new THREE.HemisphereLight(0xcfe0ff, 0x3a3020, 1.2));
const sonne = new THREE.DirectionalLight(0xffe2b8, 2.2);
sonne.position.set(-4, 6, 3);
szene.add(sonne);

// Meshes: Boden, Ring um die Splat-Kugel (geht vorn UND hinten vorbei), Stab mitten durch
const boden = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: 0x4a5a48, roughness: 1 }));
boden.rotation.x = -Math.PI / 2; boden.position.y = -1.6;
const ring = new THREE.Mesh(new THREE.TorusGeometry(1.75, 0.3, 16, 64), new THREE.MeshStandardMaterial({ color: 0xc8742a, roughness: 0.7 }));
ring.rotation.x = Math.PI / 2.3;
const stab = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 4.4, 12), new THREE.MeshStandardMaterial({ color: 0xd8d8d8 }));
stab.rotation.z = 0.5;
// Farbvergleich: unbeleuchteter Würfel und ein dichter Splat in GENAU derselben linearen Farbe
const probe = [0.2, 0.5, 0.25];
const wuerfel = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), new THREE.MeshBasicMaterial({ color: new THREE.Color().setRGB(...probe) }));
wuerfel.position.set(3.4, -1.2, 0);
szene.add(boden, ring, stab, wuerfel);

/** Einfache Netz-Kugel { position, normal, index } – ohne THREE. */
function netzKugel(radius, ringe = 24, segmente = 36) {
  const position = [], normal = [], index = [];
  for (let i = 0; i <= ringe; i++) for (let j = 0; j <= segmente; j++) {
    const a = i / ringe * Math.PI, b = j / segmente * Math.PI * 2;
    const x = Math.sin(a) * Math.cos(b), y = Math.cos(a), z = Math.sin(a) * Math.sin(b);
    normal.push(x, y, z); position.push(x * radius, y * radius, z * radius);
  }
  for (let i = 0; i < ringe; i++) for (let j = 0; j < segmente; j++) {
    const p = i * (segmente + 1) + j, q = p + segmente + 1;
    index.push(p, p + 1, q, p + 1, q + 1, q);
  }
  return { position: new Float32Array(position), normal: new Float32Array(normal), index: new Uint32Array(index) };
}

const wolke = createGaussWolke({ max: 60000 });
szene.add(wolke.mesh);
const saat = createSplatDaten();
const n = +(url.get('n') ?? 30000);
saatAufNetz(saat, netzKugel(1.2), { anzahl: n, seed: 7, groesse: [0.02, 0.05], flach: 0.2, abheben: 0.01, deck: 0.85, wind: 0,
  farbe: (x, y, z, nx, ny, nz, zufall) => {                             // Moos: oben hell, unten dunkel, Streifen als Sortier-Probe
    const streifen = Math.sin(x * 9) * Math.sin(z * 9) > 0 ? 1 : 0.55, h = 0.35 + 0.65 * Math.max(0, ny * 0.5 + 0.5);
    return [(0.10 + 0.10 * zufall) * h * streifen, (0.32 + 0.18 * zufall) * h * streifen, 0.07 * h * streifen];
  } });
const r = rng(3);
for (let i = 0; i < 40; i++) {                                           // große weiche Laub-Blobs, wiegen im Wind
  const w = r() * Math.PI * 2, d = 2.6 + r() * 2.2, s = 0.25 + r() * 0.35;
  saat.plus(Math.cos(w) * d, 0.6 + r() * 1.8, Math.sin(w) * d, s, s * 0.6, s, 0, 0, 0, 1, 0.5 + 0.3 * r(), 0.42 + 0.2 * r(), 0.12, 0.35, 1);
}
saat.plus(3.4, -0.2, 0, 0.22, 0.22, 0.22, 0, 0, 0, 1, probe[0], probe[1], probe[2], 1, 0);   // Vergleichs-Splat über dem Würfel
wolke.fuege(saat.fertig());
wolke.setze({ nebelFarbe, nebelDichte, licht: [1, 1, 1], wind: 1 });

function groesse() {
  renderer.setSize(innerWidth, innerHeight, false);
  kamera.aspect = innerWidth / innerHeight;
  kamera.updateProjectionMatrix();
}
addEventListener('resize', groesse);
groesse();
const info = document.getElementById('info'), start = performance.now();
renderer.setAnimationLoop(() => {
  const zeit = (performance.now() - start) / 1000, winkel = url.has('still') ? 0.6 : 0.6 + zeit * 0.15;
  kamera.position.set(Math.sin(winkel) * 7.5, 1.6, Math.cos(winkel) * 7.5);
  kamera.lookAt(0.6, -0.1, 0);
  wolke.update(kamera, zeit, canvas.width, canvas.height);
  renderer.render(szene, kamera);
  info.textContent = `Splat-Test · ${wolke.anzahl} Splats · ${renderer.info.render.calls} Draw-Calls`;
});
window.splatTest = { wolke, szene, kamera, renderer };
</script>
</body>
</html>
