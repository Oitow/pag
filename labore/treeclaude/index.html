<style>

<script type="module">
/* =====================================================================================
   TREE LAB – prozedurale, spieltaugliche Bäume (Three.js 0.170.0, WebGL2)
   Aufbau dieser Datei (bewusst getrennt, damit man Teile ins Spiel übernehmen kann):
     1. KERN        – Zufall/Rauschen, Arten, Skelett (Asthierarchie), Alter, Geometrie   (kein DOM)
     2. LOOK        – prozedurale Texturen + Materialien (Wind, Durchscheinen, LOD-Dither)
     3. WALD        – Varianten-Bibliothek, Platzierung, Instancing, LOD, Impostor-Atlas
     4. API         – window.TreeLab (createTree, createForest, update, dispose)
     5. DEMO        – Szene, Kamera, Bedienfeld, Messanzeige, Messfahrt
   API-Kurzbeispiel (siehe auch README.md im Ordner):
     const tree = TreeLab.createTree({ species:'oak', seed:7, age:0.8 }, { style:'natural' });
     scene.add(tree.object);
     const forest = TreeLab.createForest({ renderer, scene, count:2000, tree:{ species:'pine', seed:3 } });
     await forest.ready;
     // pro Frame:  TreeLab.update(dt, camera, sunDir); forest.update(camera);
     // aufräumen:  tree.dispose(); forest.dispose();
   ===================================================================================== */
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================== 1. KERN ============================== */
const V3 = THREE.Vector3, UP = new V3(0, 1, 0), XA = new V3(1, 0, 0), D = Math.PI / 180;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function rngFrom(seed) { let a = (seed >>> 0) || 1; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function hash2(a, b) { let h = (Math.imul(a | 0, 0x27d4eb2d) ^ Math.imul((b | 0) + 0x165667b1, 0x85ebca6b)) >>> 0; h ^= h >>> 15; h = Math.imul(h, 0x2c1b3c6d) >>> 0; h ^= h >>> 12; h = Math.imul(h, 0x297a2d39) >>> 0; h ^= h >>> 15; return h >>> 0; }
const lat = (i, j, k, s) => hash2(hash2(hash2(i, j), k), s) / 4294967296;
const sm = t => t * t * (3 - 2 * t);
function vnoise3(x, y, z, s = 0) {
  const i = Math.floor(x), j = Math.floor(y), k = Math.floor(z), fx = sm(x - i), fy = sm(y - j), fz = sm(z - k), L = (a, b, t) => a + (b - a) * t;
  return L(L(L(lat(i, j, k, s), lat(i + 1, j, k, s), fx), L(lat(i, j + 1, k, s), lat(i + 1, j + 1, k, s), fx), fy),
           L(L(lat(i, j, k + 1, s), lat(i + 1, j, k + 1, s), fx), L(lat(i, j + 1, k + 1, s), lat(i + 1, j + 1, k + 1, s), fx), fy), fz);
}
const fbm2 = (x, z, s, o = 3) => { let v = 0, a = 0.5, n = 0; for (let i = 0; i < o; i++) { v += a * vnoise3(x, 0.5, z, s + i * 13); n += a; a *= 0.5; x *= 2.03; z *= 2.03; } return v / n; };
// kachelbares 2D-Rauschen für Texturen (Periode px × py Gitterzellen)
function pn2(x, y, px, py, s) {
  const i = Math.floor(x), j = Math.floor(y), fx = sm(x - i), fy = sm(y - j), m = (a, p) => ((a % p) + p) % p;
  const a = lat(m(i, px), m(j, py), 0, s), b = lat(m(i + 1, px), m(j, py), 0, s), c = lat(m(i, px), m(j + 1, py), 0, s), d = lat(m(i + 1, px), m(j + 1, py), 0, s);
  return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
}
function pfbm(u, v, fx, fy, oct, s) { let sum = 0, amp = 0.5, n = 0; for (let o = 0; o < oct; o++) { sum += amp * pn2(u * fx, v * fy, fx, fy, s + o * 17); n += amp; amp *= 0.5; fx *= 2; fy *= 2; } return sum / n; }
function basis(d) { const a = Math.abs(d.y) < 0.9 ? UP : XA; const u = new V3().crossVectors(d, a).normalize(); return [u, new V3().crossVectors(d, u)]; }
function rotOut(d, phi, ang) { const [u, v] = basis(d); const p = u.multiplyScalar(Math.cos(phi)).addScaledVector(v, Math.sin(phi)); return d.clone().multiplyScalar(Math.cos(ang)).addScaledVector(p, Math.sin(ang)).normalize(); }

/* Arten. Längen in Metern, Mensch = 1,8 m.
   lv[ebene]: seg = Segmentlänge, wander = Richtungsrauschen, kink = Knick-Chance, trop = Licht/Schwerkraft (+ nach oben), rad = Ringsegmente
   grow = Wachstumsdauer je Ebene (Anteil am Leben), tipR/K/pipe = Röhrenmodell (Leonardo-Regel) für die Dicke */
const SPECIES = {
  oak: {
    label: 'Eiche', H: 17, years: 180, tipR: 0.0042, K: 5.2, pipe: 2.0, flare: 0.95, lobes: 7, trunkTaper: 0.3, maxLevel: 3, prune: 0,
    lv: [{ seg: 0.3, wander: 0.035, kink: 0, trop: 0.02, rad: 18 }, { seg: 0.5, wander: 0.16, kink: 0.3, kinkAmt: 0.5, trop: 0.028, rad: 11 },
         { seg: 0.32, wander: 0.24, kink: 0.22, kinkAmt: 0.35, trop: -0.012, rad: 6 }, { seg: 0.2, wander: 0.3, kink: 0, trop: 0.05, rad: 3 }],
    grow: [0.22, 0.36, 0.28, 0.16], delay: [0, 0.01, 0.015, 0.015], wind: [0.006, 0.05, 0.09, 0.07],
    leafMin: 2, leafAlong: false, spray: 0.1, card: 0.78, cardUp: 0.25, droop: 0, gap: 0.34, gapScale: 0.42, fold: 0.14, asym: 0.3,
    trunk: (r, H) => H * (0.28 + 0.1 * r()),
    spawn(b, r, H, S, out) {
      if (b.level === 0) {
        const nSide = 1 + Math.floor(r() * 2.6);
        for (let i = 0; i < nSide; i++) out.push({ t: 0.55 + 0.35 * r(), phi: r() * 6.283, ang: (64 + 16 * r()) * D, len: H * (0.46 + 0.16 * r()), kind: 'limb' });
        const nL = 3 + (r() < 0.55 ? 1 : 0) + (r() < 0.2 ? 1 : 0), ph0 = r() * 6.283;
        for (let i = 0; i < nL; i++) out.push({ t: 1, phi: ph0 + i * 6.283 / nL + (r() - 0.5) * 0.7, ang: (30 + 28 * r()) * D, len: H * (0.5 + 0.15 * r()), kind: 'leader' });
      } else if (b.level === 1) {
        const n = Math.round((8 + 5 * r()) * S.dens * (b.len / (0.55 * H)));
        for (let i = 0; i < n; i++) { const t = 0.12 + 0.88 * (i + 0.3 + 0.4 * r()) / n; out.push({ t, phi: i * 2.4 + r(), ang: (40 + 30 * r()) * D, len: b.len * (0.4 + 0.15 * r()) * (1 - 0.45 * t) }); }
      } else if (b.level === 2) {
        const n = Math.round((6 + 5 * r()) * S.dens * Math.min(1.6, b.len / 2.2));
        for (let i = 0; i < n; i++) { const t = 0.18 + 0.82 * (i + 0.3 + 0.4 * r()) / n; out.push({ t, phi: i * 2.4 + r(), ang: (38 + 26 * r()) * D, len: Math.min(1.8, 0.5 + b.len * 0.32 * (1 - 0.3 * t)) * (0.8 + 0.4 * r()) }); }
      }
    }
  },
  birch: {
    label: 'Birke', H: 16, years: 80, tipR: 0.0032, K: 4.2, pipe: 2.0, flare: 0.35, lobes: 4, trunkTaper: 0.6, maxLevel: 3, prune: 0.33,
    lv: [{ seg: 0.4, wander: 0.02, kink: 0, trop: 0.012, rad: 12 }, { seg: 0.4, wander: 0.1, kink: 0.1, kinkAmt: 0.25, trop: -0.035, rad: 7 },
         { seg: 0.28, wander: 0.14, kink: 0, trop: -0.09, rad: 4 }, { seg: 0.18, wander: 0.12, kink: 0, trop: -0.22, rad: 3 }],
    grow: [0.36, 0.3, 0.22, 0.14], delay: [0, 0.01, 0.01, 0.01], wind: [0.012, 0.08, 0.13, 0.07],
    leafMin: 2, leafAlong: false, spray: 0.09, card: 0.55, cardUp: -0.1, droop: 0.55, gap: 0.3, gapScale: 0.5, fold: 0.08, asym: 0.12,
    trunk: (r, H) => H * 0.97,
    spawn(b, r, H, S, out) {
      if (b.level === 0) {
        const n = Math.round(24 * S.dens);
        for (let i = 0; i < n; i++) { const t = 0.26 + 0.71 * (i + 0.5 * r()) / n; const prof = Math.pow(Math.sin(Math.PI * Math.min(1, Math.max(0.02, (t - 0.2) / 0.86))), 0.8) + 0.08; out.push({ t, phi: i * 2.4 + 0.3 * r(), ang: (32 + 18 * r()) * D, len: H * 0.3 * prof * (0.8 + 0.4 * r()), kind: 'limb' }); }
      } else if (b.level === 1) {
        const n = Math.round((5 + 3 * r()) * S.dens * Math.min(1.5, b.len / 3));
        for (let i = 0; i < n; i++) { const t = 0.22 + 0.78 * (i + 0.4 * r()) / n; out.push({ t, phi: i * 2.4 + r(), ang: (30 + 25 * r()) * D, len: b.len * (0.4 + 0.15 * r()) * (1 - 0.45 * t) }); }
      } else if (b.level === 2) {
        const n = Math.round((3 + 3 * r()) * S.dens);
        for (let i = 0; i < n; i++) { const t = 0.3 + 0.7 * (i + 0.4 * r()) / n; out.push({ t, phi: i * 2.4 + r(), ang: (20 + 20 * r()) * D, len: 0.45 + 0.5 * r() }); }
      }
    }
  },
  pine: {
    label: 'Kiefer', H: 20, years: 120, tipR: 0.0045, K: 4.6, pipe: 2.0, flare: 0.5, lobes: 5, trunkTaper: 0.8, maxLevel: 2, prune: 0.3,
    lv: [{ seg: 0.4, wander: 0.012, kink: 0, trop: 0.01, rad: 12 }, { seg: 0.35, wander: 0.06, kink: 0.08, kinkAmt: 0.2, trop: 0.004, rad: 6 },
         { seg: 0.25, wander: 0.1, kink: 0, trop: 0.035, rad: 3 }],
    grow: [0.62, 0.3, 0.18], delay: [0, 0.01, 0.01], wind: [0.009, 0.05, 0.07, 0.03],
    leafMin: 1, leafAlong: true, spray: 0.09, card: 0.85, cardUp: 0.1, droop: 0, gap: 0.25, gapScale: 0.6, fold: 0.05, asym: 0.05,
    trunk: (r, H) => H,
    spawn(b, r, H, S, out) {
      if (b.level === 0) {
        let h = 1.0 + 0.4 * r();
        while (h < b.len * 0.97) {
          const t = h / b.len, n = Math.max(3, Math.round((4 + 2 * r()) * Math.min(1.3, S.dens))), ph = r() * 6.283;
          const L = (0.5 + H * 0.33 * Math.pow(1 - t, 0.9)) * (0.85 + 0.3 * r()), up = t > 0.85 ? (t - 0.85) * 160 : 0;
          for (let i = 0; i < n; i++) out.push({ t, phi: ph + i * 6.283 / n + (r() - 0.5) * 0.5, ang: (78 + 18 * r() - up) * D, len: L * (0.85 + 0.3 * r()), kind: 'whorl' });
          h += 0.55 + 0.3 * r();
        }
      } else if (b.level === 1) {
        const n = Math.round(b.len / 0.26 * S.dens);
        for (let i = 0; i < n; i++) { const t = 0.15 + 0.85 * (i + 0.4 * r()) / Math.max(1, n); out.push({ t, phi: (i % 2 ? 0 : Math.PI) + (r() - 0.5) * 0.5, ang: (40 + 20 * r()) * D, len: (0.2 + b.len * 0.3 * (1 - 0.65 * t)) * (0.8 + 0.4 * r()) }); }
      }
    }
  }
};
/* Stile ändern Geometrie, Laub, Shading und Textur – nie das Skelett (gleicher Seed = gleicher Baum in jedem Stil). */
const STYLES = {
  natural:   { label: 'Naturalistisch', rad: 1, ringStride: 1, card: 1, cardN: 1, fold: 1, girth: 1, quad: false, L3: true },
  painterly: { label: 'Malerisch', rad: 0.8, ringStride: 1, card: 1.6, cardN: 0.42, fold: 1.6, girth: 1.15, quad: false, L3: true },
  ps2:       { label: 'PS2 Low-Poly', rad: 0.42, ringStride: 2, card: 2.3, cardN: 0.18, fold: 0, girth: 1.1, quad: true, L3: false }
};
const DEFAULT_TREE = { species: 'oak', seed: 1337, age: 1, height: null, girth: 1, spread: 1, dens: 1, foliage: 1 };

function sampleCurve(b, s) {
  const n = b.pts.length - 1; s = clamp(s, 0, b.len); const fi = Math.min(n - 1e-6, s / b.seg), i = Math.floor(fi), f = fi - i;
  const p = b.pts[i].clone().lerp(b.pts[i + 1], f);
  const d = b.tans[i + 1].clone().lerp(b.tans[Math.min(n, i + 2)], f).normalize();
  return { p, d };
}

/** Skelett erzeugen – unabhängig vom Alter. Jeder Ast hat einen eigenen Seed (aus dem Elternast) und eine Geburtszeit. */
function generateSkeleton(spKey, S) {
  const sp = SPECIES[spKey], H = S.height || sp.H, branches = [];
  const bias = new V3(1, 0, 0.25).normalize();         // Lichtseite (Lichtung) → leicht asymmetrische Krone
  const root = { level: 0, seed: hash2(S.seed, 991), start: new V3(0, -0.35, 0), dir: new V3(0, 1, 0), len: sp.trunk(rngFrom(hash2(S.seed, 5)), H) + 0.35, parent: null, t: 0, birth: 0, kind: 'trunk' };
  const q = [root];
  for (let qi = 0; qi < q.length; qi++) {
    const b = q[qi]; b.id = branches.length; branches.push(b);
    const r = rngFrom(b.seed), L = sp.lv[b.level];
    const nSeg = Math.max(2, Math.ceil(b.len / L.seg)), seg = b.len / nSeg;
    const p = b.start.clone(), d = b.dir.clone(), pts = [p.clone()], tans = [d.clone()];
    for (let i = 0; i < nSeg; i++) {
      const w = L.wander; d.x += (r() - 0.5) * 2 * w; d.y += (r() - 0.5) * w; d.z += (r() - 0.5) * 2 * w;
      if (L.kink && r() < L.kink) { d.x += (r() - 0.5) * 2 * L.kinkAmt; d.z += (r() - 0.5) * 2 * L.kinkAmt; d.y += (r() - 0.5) * L.kinkAmt; }
      d.y += L.trop * (b.level >= 2 ? 1 + i / nSeg : 1);
      d.normalize(); p.addScaledVector(d, seg); pts.push(p.clone()); tans.push(d.clone());
    }
    b.pts = pts; b.tans = tans; b.seg = seg; b.cum = pts.map((_, i) => i * seg);
    b.phase = r() * 6.283; b.grow = sp.grow[b.level]; b.children = []; b.deadR = sp.tipR * (2 + r() * 1.5);
    if (b.level < sp.maxLevel) {
      const specs = []; sp.spawn(b, r, H, S, specs);
      specs.forEach((c, i) => {
        const at = sampleCurve(b, c.t * b.len), dir = rotOut(at.d, c.phi, c.ang);
        const hd = new V3(dir.x, 0, dir.z), hl = hd.length(); let len = c.len;
        if (b.level + 1 <= 2 && hl > 0.01) { hd.divideScalar(hl); len *= 1 + sp.asym * hd.dot(bias); len *= 1 + (S.spread - 1) * hl; }
        const ch = { level: b.level + 1, seed: hash2(b.seed, i + 1), start: at.p.clone(), dir, len: Math.max(0.08, len), parent: b, t: c.t, kind: c.kind || '',
                     birth: b.birth + b.grow * c.t + sp.delay[b.level + 1] };
        b.children.push(ch); q.push(ch);
      });
    }
  }
  let maxEnd = 0; for (const b of branches) maxEnd = Math.max(maxEnd, b.birth + b.grow);
  const k = 0.985 / maxEnd; for (const b of branches) { b.birth *= k; b.grow *= k; }
  return { sp, spKey, S, branches, H };
}

/** Alter anwenden: welche Äste existieren, wie lang sind sie, wie dick (Röhrenmodell). Bestehende Äste behalten Form + Seed. */
function resolveAge(sk, A) {
  const { sp, branches } = sk, trunk = branches[0]; sk.A = A;
  for (const b of branches) {
    const p = b.parent;
    b.ex = A > b.birth && (!p || (p.ex && !p.dead)); b.dead = false;
    if (!b.ex) { b.cl = 0; continue; }
    b.f = Math.min(1, (A - b.birth) / b.grow); b.cl = Math.max(0.03, b.len * b.f);
    if (b.level === 1 && sp.prune) {   // untere Äste sterben ab (Kiefer/Birke putzen sich selbst)
      const pr = trunk.cl * sp.prune * sstep(0.3, 1, A);
      if (b.start.y < pr) { b.dead = true; b.cl = Math.min(b.cl, 0.25 + 0.35 * ((b.seed % 1000) / 1000)); }
    }
  }

}

// ---- Kamera / Steuerung ----
const orbit = new OrbitControls(camera, canvas); orbit.enableDamping = true; orbit.minDistance = 0.4; orbit.maxDistance = 140; orbit.maxPolarAngle = Math.PI * 0.53;
const specCam = { pos: new V3(21, 3.2, 18), tgt: new V3(0, 8, 0) };
const walk = { x: 0, z: 6, yaw: 0, pitch: 0.06, keys: new Set(), joy: { x: 0, y: 0 } };
function setView(v) {

  view = v; document.getElementById('vSpec').classList.toggle('on', v === 'specimen'); document.getElementById('vWald').classList.toggle('on', v === 'forest');
  const spec = v === 'specimen'; orbit.enabled = spec; groundFlat.visible = grass.visible = spec; groundForest.visible = !spec; if (hero) hero.object.visible = spec; person.visible = spec && W.person;
  scene.fog.near = spec ? 80 : 40; scene.fog.far = spec ? 600 : 235;
  document.getElementById('joy').style.display = !spec && isTouch ? 'block' : 'none';
  if (spec) { camera.position.copy(specCam.pos); orbit.target.copy(specCam.tgt); orbit.update(); }

addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; walk.keys.add(e.code); });

let look = null;
canvas.addEventListener('pointerdown', e => { if (view !== 'forest' || benchState) return; look = { id: e.pointerId, x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); });

canvas.addEventListener('pointerup', () => look = null); canvas.addEventListener('pointercancel', () => look = null);
{ const j = document.getElementById('joy'), k = document.getElementById('knob'); let id = null;
  const mv = e => { const r = j.getBoundingClientRect(); let x = (e.clientX - r.left - 60) / 50, y = (e.clientY - r.top - 60) / 50; const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; } walk.joy.x = x; walk.joy.y = y; k.style.left = 38 + x * 40 + 'px'; k.style.top = 38 + y * 40 + 'px'; };
  j.addEventListener('pointerdown', e => { id = e.pointerId; j.setPointerCapture(id); mv(e); e.stopPropagation(); });
  j.addEventListener('pointermove', e => { if (e.pointerId === id) mv(e); });

  if (K.has('KeyQ')) walk.yaw += dt * 1.6; if (K.has('KeyE')) walk.yaw -= dt * 1.6;

}

// ---- Messung ----
const ft = [], FT_N = 240; let frames = 0, lastStats = 0;
const medP = (arr, p) => { const a = [...arr].sort((x, y) => x - y); return a.length ? a[Math.min(a.length - 1, Math.floor(p * (a.length - 1) + 0.5))] : 0; };
let benchState = null; const benchResults = [];
const gpuName = (() => { try { const gl = renderer.getContext(), ext = gl.getExtension('WEBGL_debug_renderer_info'); return ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER); } catch { return '?'; } })();
function benchPath(t, cam) {   // feste 20-s-Route quer durch den Wald (gleiche Stelle bei gleichem Seed)
  const x = -70 + 140 * t, z = 18 * Math.sin(t * Math.PI * 3), dz = 18 * Math.PI * 3 * Math.cos(t * Math.PI * 3) / 140;
  walk.x = x; walk.z = z; walk.yaw = Math.atan2(-1, -dz) + 0.55 * Math.sin(t * Math.PI * 4); walk.pitch = 0.05 + 0.12 * Math.sin(t * Math.PI * 2);

}
function startBench() {

  if (view !== 'forest') setView('forest'); else applyPlacement();
  document.getElementById('panel').classList.add('zu');
}
function benchStep(dt) {
  const b = benchState;

  b.t += dt;
  const total = 2 + 20, t = b.phase === 'warm' ? b.t / total : (2 + b.t) / total;
  benchPath(Math.min(1, t), camera);

  else if (b.phase === 'run' && b.t >= 20) finishBench();

    fps: n / (sum / 1000), med: medP(b.rec, 0.5), p95: medP(b.rec, 0.95), draws: Math.round(avg(b.calls)), tris: avg(b.tris), aufl: `${renderer.domElement.width}×${renderer.domElement.height}`,
    schatten: G.shadow, frames: n };

}

// ---- Bedienfeld ----
const $ = s => document.querySelector(s);
function h(tag, attrs = {}, ...kids) { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (k.startsWith('on')) e[k] = v; else e.setAttribute(k, v); } e.append(...kids); return e; }
const refreshers = [];
function section(title, open, id) { const d = h('details', id ? { id } : {}); if (open) d.open = true; d.append(h('summary', {}, title)); $('#panel').append(d); return d; }
function slider(sec, label, get, set, min, max, step, fmt = v => v) {
  const val = h('b'), inp = h('input', { type: 'range', min, max, step }); const row = h('label', { class: 'row' }, h('span', {}, label), val, inp);
  const ref = () => { inp.value = get(); val.textContent = fmt(+get()); }; ref(); inp.oninput = () => { set(+inp.value); val.textContent = fmt(+inp.value); }; sec.append(row); refreshers.push(ref); return inp;
}
function buttons(sec, items, get, set) { const box = h('div', { class: 'btns' }); const bs = items.map(([k, l]) => { const b = h('button', { onclick: () => { set(k); upd(); } }, l); box.append(b); return [k, b]; });
  const upd = () => bs.forEach(([k, b]) => b.classList.toggle('on', get() === k)); upd(); refreshers.push(upd); sec.append(box); }
function check(sec, label, get, set) { const i = h('input', { type: 'checkbox' }); i.checked = get(); i.onchange = () => set(i.checked); sec.append(h('label', { class: 'chk' }, i, label)); refreshers.push(() => i.checked = get()); }
const timers = {}; const later = (k, ms, fn) => { clearTimeout(timers[k]); timers[k] = setTimeout(fn, ms); };
const treeChanged = () => { later('hero', 140, rebuildHero); later('forest', 800, startForestBuild); };
function buildPanel() {
  const s1 = section('🌳 Baum', true);
  buttons(s1, Object.entries(SPECIES).map(([k, v]) => [k, v.label]), () => T.species, k => { T.species = k; T.height = SPECIES[k].H; refreshers.forEach(f => f()); treeChanged(); });
  const seedIn = h('input', { type: 'number', value: T.seed }); seedIn.onchange = () => { T.seed = (+seedIn.value) >>> 0; treeChanged(); };
  refreshers.push(() => seedIn.value = T.seed);
  s1.append(h('div', { class: 'btns' }, h('span', { style: 'align-self:center' }, 'Seed'), seedIn, h('button', { onclick: () => { T.seed = Math.floor(Math.random() * 99999); seedIn.value = T.seed; treeChanged(); } }, '🎲 Neuer Seed')));
  slider(s1, 'Alter', () => T.age, v => { T.age = v; treeChanged(); }, 0.05, 1, 0.01, v => `≈ ${Math.round(v * SPECIES[T.species].years)} Jahre`);
  slider(s1, 'Höhe (ausgewachsen)', () => T.height, v => { T.height = v; treeChanged(); }, 6, 32, 0.5, v => v.toFixed(1) + ' m');
  slider(s1, 'Stammdicke', () => T.girth, v => { T.girth = v; treeChanged(); }, 0.5, 1.8, 0.01, v => '×' + v.toFixed(2));
  slider(s1, 'Kronenbreite', () => T.spread, v => { T.spread = v; treeChanged(); }, 0.6, 1.5, 0.01, v => '×' + v.toFixed(2));
  slider(s1, 'Astdichte', () => T.dens, v => { T.dens = v; treeChanged(); }, 0.4, 1.6, 0.01, v => '×' + v.toFixed(2));
  slider(s1, 'Laubdichte', () => T.foliage, v => { T.foliage = v; treeChanged(); }, 0.2, 1.6, 0.01, v => '×' + v.toFixed(2));
  s1.append(h('div', { class: 'btns' }, h('button', { onclick: copySettings }, '📋 Einstellungen kopieren')));
  const s2 = section('🎨 Stil', true);
  buttons(s2, Object.entries(STYLES).map(([k, v]) => [k, v.label]), () => W.style, k => { W.style = k; later('hero', 10, rebuildHero); later('forest', 300, startForestBuild); });

  const s3 = section('☀ Licht & Wind', false);
  slider(s3, 'Sonne Richtung', () => W.sunAz, v => { W.sunAz = v; updateSun(); later('bake', 400, () => forest && forest.bake()); }, 0, 360, 1, v => v + '°');
  slider(s3, 'Sonne Höhe', () => W.sunEl, v => { W.sunEl = v; updateSun(); later('bake', 400, () => forest && forest.bake()); }, 4, 85, 1, v => v + '°');

  s4.append(h('div', { class: 'btns' }, h('span', { style: 'align-self:center' }, 'Wald-Seed'), fsIn, h('button', { onclick: () => { W.forestSeed = Math.floor(Math.random() * 9999); fsIn.value = W.forestSeed; if (view === 'forest') applyPlacement(); } }, '🎲')));

  s5.append(h('label', { class: 'row' }, h('span', {}, 'Schatten-Qualität'), sel));
  slider(s5, 'Schatten-Distanz (Wald)', () => G.shadowDist, v => { G.shadowDist = v; custom(); }, 15, 120, 1, v => v + ' m');

}
function renderBench() {

    benchResults.slice(0, 8).map(r => `<tr><td>${r.zeit} ${r.stil.slice(0, 4)}</td><td>${r.dichte}</td><td>${r.preset} ×${r.skala}</td><td>${r.fps.toFixed(1)}</td><td>${r.med.toFixed(1)}</td><td>${r.p95.toFixed(1)}</td><td>${r.draws}</td><td>${(r.tris / 1e6).toFixed(2)} M</td><td>${r.aufl}</td></tr>`).join('') + '</table>';
}
function toastText(title, text) { const t = $('#toast'); t.innerHTML = ''; const ta = h('textarea'); ta.value = text; t.append(h('div', {}, title), ta, h('div', {}, h('button', { onclick: () => t.style.display = 'none' }, 'Schließen'))); t.style.display = 'block'; ta.select(); }
async function copyText(title, text) { try { await navigator.clipboard.writeText(text); const t = $('#toast'); t.textContent = '✓ ' + title + ' kopiert'; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 1600); } catch { toastText(title + ' (bitte manuell kopieren):', text); } }

function copyBench() { copyText('Messergebnisse', `Tree Lab Messfahrt · ${navigator.userAgent}\nGPU: ${gpuName} · DPR ${devicePixelRatio} · Fenster ${innerWidth}×${innerHeight}\n` + benchResults.map(r => JSON.stringify(r)).join('\n')); }

$('#bPanel').onclick = () => $('#panel').classList.toggle('zu');
$('#bStats').onclick = () => { $('#stats').style.display = $('#stats').style.display === 'none' ? 'block' : 'none'; $('#bStats').classList.toggle('on'); };
$('#vSpec').onclick = () => setView('specimen'); $('#vWald').onclick = () => setView('forest');

// ---- Hauptschleife ----
let last = performance.now(), adaptT = 0;

      `Draws ${inf.calls}  Dreiecke ${(inf.triangles / 1e6).toFixed(2)} M\n` +
      `Auflösung ${renderer.domElement.width}×${renderer.domElement.height} (×${renderScale.toFixed(2)}${G.adaptive ? ' adaptiv' : ''})\n` +
      (view === 'forest' ? `Bäume ${fs.placed} platziert · ${fs.visible} sichtbar\n  nah ${fs.l0} · mittel ${fs.l1} · fern ${fs.bb}\n` : `Exemplar ${hero ? hero.info.branches : 0} Äste · ${hero ? hero.info.cards : 0} Laubkarten · ${hero ? (hero.info.tris / 1000).toFixed(0) : 0}k Dr.\n`) +
      `Erzeugung: Baum ${heroMs.toFixed(0)} ms · Wald ${(forestMs / 1000).toFixed(2)} s · Platz ${placeMs.toFixed(0)} ms`;

}

// ---- Start ----

camera.position.copy(specCam.pos); orbit.target.copy(specCam.tgt); orbit.update();
const ort = Q.get('ort');
if (ort === 'rinde') { camera.position.set(1.4, 1.1, 0.9); orbit.target.set(0, 1.0, 0); }
if (ort === 'unten') { camera.position.set(2.6, 1.4, 1.6); orbit.target.set(-0.5, 10, 0.4); }
if (ort === 'nah') { camera.position.set(9, 6, 8); orbit.target.set(0, 8, 0); }
if (ort === 'weit') { camera.position.set(40, 6, 34); orbit.target.set(0, 7, 0); }
orbit.update();
setView(view === 'forest' ? 'forest' : 'specimen');
if (!isTouch && !Q.has('test')) $('#panel').classList.remove('zu');
startForestBuild();
if (Q.get('bench') === '1') startBench();
requestAnimationFrame(frame);
window.TL_DEMO = { T, W, G, camera, orbit, walk, setView, rebuildHero, startForestBuild, applyPlacement, startBench, get forest() { return forest; }, get hero() { return hero; }, benchResults };
</script>
