<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Gigant-Welt Testlab</title>
<style>
/* VOICE: technisches Testlab, ruhig  IDEA: Messinstrument über einer Landschaft
   PICTURE: die Welt selbst, Vollbild  COLOUR: Waldgrün-Glas, warmes Akzentlicht
   TYPE: System-UI + Monospace für Messwerte  LAYOUT: Stats links oben, Buttons rechts, Steuerung unten */
html,body{margin:0;height:100%;overflow:hidden;background:#0b1410;touch-action:none;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#e9f1e4}
canvas{display:block}
#hud{position:fixed;left:8px;top:8px;font:11px/1.4 ui-monospace,Menlo,Consolas,monospace;background:rgba(8,14,10,.62);padding:7px 9px;border-radius:10px;pointer-events:none;white-space:pre;z-index:5;max-width:62vw;overflow:hidden}
#btns{position:fixed;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:6}
.b{background:rgba(8,14,10,.62);color:#eef5ea;border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:10px 12px;font-size:13px;min-width:96px;min-height:40px;text-align:center;user-select:none;-webkit-user-select:none;cursor:pointer}
.b.on{background:rgba(74,122,56,.82);border-color:rgba(200,255,170,.35)}
#panel{position:fixed;right:116px;top:8px;width:210px;background:rgba(8,14,10,.8);border-radius:12px;padding:10px 12px;display:none;z-index:6;font-size:13px}
#panel label{display:block;margin:6px 0 2px}
#panel input[type=range]{width:100%}
#joy{position:fixed;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.06);display:none;z-index:4;pointer-events:none;transform:translate(-50%,-50%)}
#knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px;border-radius:50%;background:rgba(255,255,255,.35)}
#updown{position:fixed;right:98px;bottom:150px;display:none;flex-direction:column;gap:12px;z-index:6}
#updown .b{min-width:64px;min-height:56px;font-size:20px}
#tools{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);width:min(96vw,470px);background:rgba(8,14,10,.68);border-radius:14px;padding:7px;z-index:6;display:flex;flex-direction:column;gap:6px;font-size:13px}
#tools .row{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.t{flex:1 1 0;min-height:38px;display:flex;align-items:center;justify-content:center;gap:5px;border-radius:9px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);user-select:none;-webkit-user-select:none;cursor:pointer;padding:0 6px;white-space:nowrap}
.t.on{background:rgba(74,122,56,.85);border-color:rgba(200,255,170,.4)}
.t i{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.4)}
#tools input[type=range]{flex:1}
#cross{position:fixed;left:50%;top:50%;width:14px;height:14px;margin:-7px;border:2px solid rgba(255,255,255,.75);border-radius:50%;pointer-events:none;z-index:4;box-shadow:0 0 3px rgba(0,0,0,.6)}
#bAct{position:fixed;right:12px;bottom:150px;width:74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;z-index:6;padding:0;min-width:0}
#bAct.on{background:rgba(160,80,50,.85)}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:#0b1410;z-index:20;font-size:16px}
#bar{width:220px;height:6px;border-radius:3px;background:#1d2b22;overflow:hidden}#bar i{display:block;height:100%;width:0;background:#9fd27a}
#err{color:#ff9a8a;font-size:13px;max-width:80vw;text-align:center}
</style>
</head>
<body>
<div id="load"><div>Generiere Gigant-Welt…</div><div id="bar"><i></i></div><div id="lt" style="font-size:12px;opacity:.7"></div><div id="err"></div></div>
<div id="hud"></div>
<div id="btns">
  <div class="b" id="bFly">Flug: AUS</div>
  <div class="b" id="bQ">Qualität</div>
  <div class="b on" id="bSh">Schatten: AN</div>
  <div class="b" id="bView">Aussicht ↑</div>
  <div class="b" id="bDemo">Hobbit-Demo</div>
  <div class="b on" id="bBuild">Bau-Leiste</div>
  <div class="b" id="bSet">⚙ Optionen</div>
</div>
<div id="panel">
  <label>Sonnenstand <span id="sunV"></span></label><input id="sSun" type="range" min="3" max="75" value="24">
  <label>Sonnenrichtung</label><input id="sAz" type="range" min="0" max="360" value="210">
  <label>Flug-Tempo <span id="spV"></span></label><input id="sSp" type="range" min="10" max="800" value="80">
  <label><input id="cAuto" type="checkbox" checked> Auto-Auflösung</label>

</div>
<div id="joy"><div id="knob"></div></div>
<div id="updown"><div class="b" id="bUp">▲</div><div class="b" id="bDn">▼</div></div>

<div class="b" id="bAct">Bauen</div>
<div id="tools">
  <div class="row"><div class="t on" data-m="0">Graben</div><div class="t" data-m="1">Auftragen</div><div class="t" data-m="2">Ebnen</div><div class="t" data-m="3">Fällen</div><div class="t" id="tShape">Kugel</div></div>
  <div class="row" id="mats"></div>
  <div class="row"><span>Größe</span><input id="sSize" type="range" min="0.6" max="4" step="0.1" value="1.6"><span id="sizeV" style="width:42px;text-align:right">1.6 m</span></div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

window.addEventListener('error', e => { const el = document.getElementById('err'); if (el) el.textContent = 'Fehler: ' + e.message; });

const isTouch = matchMedia('(pointer:coarse)').matches || ('ontouchstart' in window);
const $ = id => document.getElementById(id);

import { COS, SIN, gn, fbm, ridged, ss, heightAt, forestRaw, forestAt, rngFrom, cellSeed, GLSL_NOISE, FRAG_COMMON } from './js/rauschen.js';
/* ================= QUALITÄT ================= */
const DPR = window.devicePixelRatio || 1;
const PRESETS = {
  low:  { name: 'Niedrig', VR: 40, N: 64,  pr: 0.75, R0: 180, R1: 800,  R2: 2600, GR: 38, BR: 150, gDen: .45, shadow: 0 },
  med:  { name: 'Mittel',  VR: 56, N: 96,  pr: 1.0,  R0: 260, R1: 1200, R2: 4000, GR: 55, BR: 220, gDen: .75, shadow: 1024 },
  high: { name: 'Hoch',    VR: 80, N: 128, pr: 1.5,  R0: 380, R1: 1800, R2: 6000, GR: 80, BR: 300, gDen: 1.0, shadow: 2048 },
};
let qKey = isTouch ? 'med' : 'high';
let Q = PRESETS[qKey];
let maxPR = Math.min(DPR, Q.pr), curPR = maxPR;
let shadowsOn = Q.shadow > 0;
const LEVELS = 10, BASE = 1;

/* ================= RENDERER / SZENE ================= */
const renderer = new THREE.WebGLRenderer({ antialias: !isTouch, powerPreference: 'high-performance' });
renderer.setPixelRatio(curPR);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = shadowsOn;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
renderer.debug.onShaderError = (gl, prog, vs, fs) => {
  const d = document.createElement('div'); d.style.cssText = 'position:fixed;left:8px;right:8px;bottom:140px;max-height:40vh;overflow:auto;background:#300;color:#fcc;font:11px monospace;padding:8px;z-index:30;white-space:pre-wrap';
  d.textContent = 'Shader-Fehler:\n' + (gl.getShaderInfoLog(vs) || '') + (gl.getShaderInfoLog(fs) || '') + (gl.getProgramInfoLog(prog) || ''); document.body.appendChild(d);
};
window.addEventListener('error', e => { if ($('load').style.display === 'none') { const d = document.createElement('div'); d.style.cssText = 'position:fixed;left:8px;top:200px;background:#300;color:#fcc;font:11px monospace;padding:6px;z-index:30'; d.textContent = 'Fehler: ' + e.message; document.body.appendChild(d); } });

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(68, innerWidth / innerHeight, 0.4, 60000);
camera.rotation.order = 'YXZ';
camera.layers.set(0);
scene.fog = new THREE.FogExp2(0x9fb8c8, 0.00009);
// Höhennebel + Luftperspektive: Fog-Chunks global ersetzen (Welt-Höhe aus View-Matrix, auch für Instanzen)
THREE.ShaderChunk.fog_pars_vertex = '#ifdef USE_FOG\nvarying float vFogDepth;varying float vFogH;\n#endif';
THREE.ShaderChunk.fog_vertex = '#ifdef USE_FOG\nvFogDepth=-mvPosition.z;vFogH=cameraPosition.y+dot(vec3(viewMatrix[0][1],viewMatrix[1][1],viewMatrix[2][1]),mvPosition.xyz);\n#endif';
THREE.ShaderChunk.fog_pars_fragment = '#ifdef USE_FOG\nuniform vec3 fogColor;varying float vFogDepth;varying float vFogH;uniform float fogDensity;\n#endif';
THREE.ShaderChunk.fog_fragment = `#ifdef USE_FOG
float fdn=fogDensity*(.55+.9*exp(-max(vFogH,0.)/320.));
float fogFactor=1.-exp(-fdn*fdn*vFogDepth*vFogDepth);
vec3 fogC=mix(fogColor,fogColor*vec3(.78,.9,1.15)+vec3(0.,.01,.04),fogFactor*.65);
gl_FragColor.rgb=mix(gl_FragColor.rgb,fogC,fogFactor);
#endif`;

const hemi = new THREE.HemisphereLight(0xbcd8ff, 0x46553a, 1.0);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d8, 3.0);
sun.castShadow = shadowsOn;
const SH = 115;
Object.assign(sun.shadow.camera, { left: -SH, right: SH, top: SH, bottom: -SH, near: 1, far: 1600 });
sun.shadow.mapSize.set(Q.shadow || 1024, Q.shadow || 1024);
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.4;
sun.shadow.camera.layers.enable(1);
scene.add(sun, sun.target);

const U = { uCam: { value: new THREE.Vector3() }, uTime: { value: 0 }, uTreeR: { value: Q.R2 }, uGR: { value: Q.GR } };

/* ================= HIMMEL ================= */
const skyU = { uSun: { value: new THREE.Vector3(0, 1, 0) }, uZen: { value: new THREE.Color() }, uHor: { value: new THREE.Color() }, uSunCol: { value: new THREE.Color() } };
const sky = new THREE.Mesh(new THREE.SphereGeometry(2000, 32, 16), new THREE.ShaderMaterial({
  uniforms: skyU, side: THREE.BackSide, depthWrite: false, depthTest: false, fog: false,
  vertexShader: `varying vec3 vD;void main(){vD=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader: `uniform vec3 uSun,uZen,uHor,uSunCol;varying vec3 vD;
  void main(){vec3 d=normalize(vD);float y=max(d.y,0.);vec3 c=mix(uHor,uZen,pow(y,.45));
  if(d.y<0.)c=uHor*mix(1.,.8,min(1.,-d.y*3.));
  float s=max(dot(d,uSun),0.);c+=uSunCol*(pow(s,6.)*.18+pow(s,80.)*.7)+uSunCol*smoothstep(.9995,.9998,s)*12.;
  gl_FragColor=vec4(c,1.);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
  }`
}));
sky.renderOrder = -10; sky.frustumCulled = false;
scene.add(sky);

const sunDir = new THREE.Vector3();
function setSun(elDeg, azDeg) {
  const el = elDeg * Math.PI / 180, az = azDeg * Math.PI / 180;
  sunDir.set(Math.cos(el) * Math.sin(az), Math.sin(el), Math.cos(el) * Math.cos(az)).normalize();
  skyU.uSun.value.copy(sunDir);
  const t = ss(2, 40, elDeg);
  const lerp3 = (a, b) => a.map((v, i) => v + (b[i] - v) * t);
  const sc = lerp3([1.0, .55, .32], [1.0, .95, .86]);
  sun.color.setRGB(sc[0], sc[1], sc[2], THREE.SRGBColorSpace);
  sun.intensity = 3.2 * ss(-1, 8, elDeg);
  skyU.uSunCol.value.copy(sun.color);
  const hor = lerp3([.86, .64, .50], [.66, .77, .87]);
  const zen = lerp3([.28, .36, .58], [.24, .44, .78]);
  skyU.uHor.value.setRGB(hor[0], hor[1], hor[2], THREE.SRGBColorSpace);
  skyU.uZen.value.setRGB(zen[0], zen[1], zen[2], THREE.SRGBColorSpace);
  scene.fog.color.copy(skyU.uHor.value);
  const hs = lerp3([.75, .62, .58], [.74, .85, 1.0]);
  hemi.color.setRGB(hs[0], hs[1], hs[2], THREE.SRGBColorSpace);
  hemi.intensity = .55 + .55 * t;
  $('sunV').textContent = elDeg + '°';
}

/* ================= TERRAIN: GPU-Clipmap mit 10 LOD-Ringen ================= */
let levels = [];
function makeTerrainMat(lv) {
  const m = new THREE.MeshLambertMaterial();
  m.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, lv.u, U);
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', `#include <common>
uniform vec2 uCenter;uniform float uSpacing;uniform float uHalf;varying vec3 vW;varying vec3 vNw;varying float vF;
${GLSL_NOISE}`)
      .replace('#include <beginnormal_vertex>', `
vec2 lp=position.xz;
float gx=floor(lp.x/uSpacing+.5),gz=floor(lp.y/uSpacing+.5);
float dd=max(abs(lp.x),abs(lp.y));
float morph=smoothstep(uHalf*.62,uHalf*.94,dd);
lp.x-=(gx-2.*floor(gx*.5))*uSpacing*morph;
lp.y-=(gz-2.*floor(gz*.5))*uSpacing*morph;
vec2 wp=lp+uCenter;
float tSp=uSpacing*(1.+morph);
float tH=terrH(wp,tSp);
float tHx=terrH(wp+vec2(tSp,0.),tSp),tHz=terrH(wp+vec2(0.,tSp),tSp);
vec3 objectNormal=normalize(vec3(tH-tHx,tSp,tH-tHz));
vec3 tPos=vec3(lp.x,tH,lp.y);
vW=vec3(wp.x,tH,wp.y);vNw=objectNormal;vF=forestG(wp,tH,tSp);`)
      .replace('#include <begin_vertex>', 'vec3 transformed=tPos;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
uniform vec2 uInner;uniform float uInnerHalf;uniform sampler2D uMask;uniform vec2 uMaskO;varying vec3 vW;varying vec3 vNw;varying float vF;
${FRAG_COMMON}
float mk(vec2 w){vec2 c=(w-uMaskO)/16.;if(c.x<0.||c.y<0.||c.x>=32.||c.y>=32.)return 0.;return texelFetch(uMask,ivec2(c),0).r;}`)
      .replace('vec4 diffuseColor = vec4( diffuse, opacity );', `
if(uInnerHalf>0.){vec2 q=abs(vW.xz-uInner);if(max(q.x,q.y)<uInnerHalf)discard;}
if(mk(vW.xz)>.5&&mk(vW.xz+vec2(.6,0.))>.5&&mk(vW.xz-vec2(.6,0.))>.5&&mk(vW.xz+vec2(0.,.6))>.5&&mk(vW.xz-vec2(0.,.6))>.5)discard;
vec3 n=normalize(vNw);float tDist=length(vW.xz-uCam.xz);
vec4 diffuseColor=vec4(pow(terrCol(vW,n,vF,tDist),vec3(2.2)),1.);`);
  };
  m.customProgramCacheKey = () => 'terrain-v4';
  return m;
}
function buildTerrain(N) {
  for (const l of levels) { scene.remove(l.mesh); l.mesh.geometry.dispose(); l.mesh.material.dispose(); }
  levels = [];
  for (let L = 0; L < LEVELS; L++) {
    const s = BASE * Math.pow(2, L), half = N * s / 2;
    const pos = new Float32Array((N + 1) * (N + 1) * 3), nor = new Float32Array(pos.length);
    for (let j = 0, k = 0; j <= N; j++) for (let i = 0; i <= N; i++, k += 3) { pos[k] = (i - N / 2) * s; pos[k + 2] = (j - N / 2) * s; nor[k + 1] = 1; }
    const idx = [], hh = L > 0 ? half / 2 - 2 * s : -1;
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      const x0 = (i - N / 2) * s, z0 = (j - N / 2) * s;
      if (L > 0 && x0 >= -hh && x0 + s <= hh && z0 >= -hh && z0 + s <= hh) continue;
      const a = j * (N + 1) + i, b = a + N + 1, c = a + 1, d = b + 1;
      idx.push(a, b, c, c, b, d);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
    g.setIndex(idx);
    const lv = { L, s, half, cx: 0, cz: 0, u: { uCenter: { value: new THREE.Vector2() }, uSpacing: { value: s }, uHalf: { value: half }, uInner: { value: new THREE.Vector2() }, uInnerHalf: { value: 0 } } };
    const mesh = new THREE.Mesh(g, makeTerrainMat(lv));
    mesh.frustumCulled = false; mesh.receiveShadow = true;
    lv.mesh = mesh; levels.push(lv); scene.add(mesh);
  }
}
function updateTerrain(cx, cz) {
  for (const lv of levels) {
    const st = 2 * lv.s;
    lv.cx = Math.floor(cx / st) * st; lv.cz = Math.floor(cz / st) * st;
    lv.mesh.position.set(lv.cx, 0, lv.cz);
    lv.u.uCenter.value.set(lv.cx, lv.cz);
  }
  for (let i = 1; i < levels.length; i++) {
    const inn = levels[i - 1];
    levels[i].u.uInner.value.set(inn.cx, inn.cz);
    levels[i].u.uInnerHalf.value = inn.half - inn.s * .5;
  }
}

/* ================= WASSER ================= */
const water = new THREE.Mesh(new THREE.PlaneGeometry(120000, 120000).rotateX(-Math.PI / 2),
  new THREE.MeshPhongMaterial({ color: 0x1b4552, specular: 0x9ab8c0, shininess: 140, transparent: true, opacity: .86 }));
water.material.onBeforeCompile = sh => {
  Object.assign(sh.uniforms, U);
  sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vWw;').replace('#include <begin_vertex>', '#include <begin_vertex>\nvWw=(modelMatrix*vec4(transformed,1.)).xyz;');
  sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec3 vWw;uniform float uTime;\n' + FRAG_COMMON)
    .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
{vec2 p=vWw.xz;float t=uTime;float amp=.55*(1.-smoothstep(250.,2200.,length(p-uCam.xz)));
vec2 q1=p*.23+vec2(t*.35,t*.21),q2=p*.9+vec2(-t*.6,t*.5);
float a=vn(q1)*.7+vn(q2)*.3;
float dx=vn(q1+vec2(.06,0.))*.7+vn(q2+vec2(.06,0.))*.3-a,dz=vn(q1+vec2(0.,.06))*.7+vn(q2+vec2(0.,.06))*.3-a;
vec3 nw=normalize(vec3(-dx*amp*9.,1.,-dz*amp*9.));
normal=normalize((viewMatrix*vec4(nw,0.)).xyz);}`);
};
water.material.customProgramCacheKey = () => 'water-v2';
water.frustumCulled = false;
scene.add(water);

/* ================= VOXEL-NAHZONE (Surface Nets, editierbar) ================= */
/* VOXEL CORE START */
const VS = 0.5, CS = 32, CW = 16, PAD = 2, P = CS + 5, P2 = P * P, P3 = P * P * P;
const vkey = (x, z) => (x + 60000) * 120000 + (z + 60000);
const ckey = (x, y, z) => vkey(x, z) * 1024 + (y + 512);
const OPS = [], opIndex = new Map(), colOpsY = new Map();
const chunks = new Map(), cols = new Map(), colCache = new Map();
const PAL = { 2: [.40, .29, .18], 3: [.50, .48, .45], 4: [.80, .72, .52], 5: [.66, .42, .28], 6: [.52, .34, .19], 7: [.32, .45, .14] };
const DIRT = PAL[2];

function colData(cx, cz) {
  const k = vkey(cx, cz); let c = colCache.get(k); if (c) return c;
  const h = new Float32Array(P2), sl = new Float32Array(P2), ox = cx * CW, oz = cz * CW; let mn = 1e9, mx = -1e9;
  for (let k2 = 0; k2 < P; k2++) for (let i = 0; i < P; i++) { const v = heightAt(ox + (i - PAD) * VS, oz + (k2 - PAD) * VS); h[i + P * k2] = v; if (v < mn) mn = v; if (v > mx) mx = v; }
  for (let k2 = 0; k2 < P; k2++) for (let i = 0; i < P; i++) {
    const i0 = Math.max(0, i - 1), i1 = Math.min(P - 1, i + 1), k0 = Math.max(0, k2 - 1), k1 = Math.min(P - 1, k2 + 1);
    sl[i + P * k2] = Math.hypot((h[i1 + P * k2] - h[i0 + P * k2]) / ((i1 - i0) * VS), (h[i + P * k1] - h[i + P * k0]) / ((k1 - k0) * VS));
  }
  c = { h, sl, mn, mx }; colCache.set(k, c); return c;
}
function applyOp(ch, op) {
  const { t, x, y, z, r, mat, shape } = op, d = ch.d, m = ch.m;
  const ex = r + 1, ey = t === 2 ? r * 1.3 + 1 : r + 1;
  const i0 = Math.max(0, Math.floor((x - ex - ch.ox) / VS) + PAD), i1 = Math.min(P - 1, Math.ceil((x + ex - ch.ox) / VS) + PAD);
  const j0 = Math.max(0, Math.floor((y - ey - ch.oy) / VS) + PAD), j1 = Math.min(P - 1, Math.ceil((y + ey - ch.oy) / VS) + PAD);

        if (forestRaw(tx, tz) > .7 && th > 3 && th < 260) return { x, z, yaw: Math.atan2(-Math.cos(b), -Math.sin(b)) };

    }
  }
  return { x: 0, z: 0, yaw: 0 };
}

const el = renderer.domElement;
el.addEventListener('pointerdown', e => {
  el.setPointerCapture(e.pointerId);

    const j = $('joy'); j.style.display = 'block'; j.style.left = e.clientX + 'px'; j.style.top = e.clientY + 'px'; $('knob').style.transform = '';
  } else if (look.id === null) { look.id = e.pointerId; look.lx = e.clientX; look.ly = e.clientY; }
});

  }
});
const endP = e => { if (e.pointerId === joy.id) { joy.id = null; joy.x = joy.y = 0; $('joy').style.display = 'none'; } if (e.pointerId === look.id) look.id = null; };
el.addEventListener('pointerup', endP); el.addEventListener('pointercancel', endP);
addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'KeyF') toggleFly(); if (e.code === 'Space' && !fly && grounded) vy = 7.5; });
addEventListener('keyup', e => { keys[e.code] = false; });

function toggleFly() { fly = !fly; vy = 0; $('bFly').textContent = 'Flug: ' + (fly ? 'AN' : 'AUS'); $('bFly').classList.toggle('on', fly); $('updown').style.display = fly && isTouch ? 'flex' : 'none'; }
$('bFly').onclick = toggleFly;
$('bView').onclick = () => { if (!fly) toggleFly(); pos.y = Math.max(pos.y, heightAt(pos.x, pos.z) + 420); pitch = -.22; };
$('bSet').onclick = () => { const p = $('panel'); p.style.display = p.style.display === 'block' ? 'none' : 'block'; };
const hold = (id, v) => { const b = $(id); b.onpointerdown = e => { e.preventDefault(); upIn = v; }; b.onpointerup = b.onpointerleave = b.onpointercancel = () => { upIn = 0; }; };
hold('bUp', 1); hold('bDn', -1);
$('sSun').oninput = $('sAz').oninput = () => setSun(+$('sSun').value, +$('sAz').value);
$('sSp').oninput = () => { flySpeed = +$('sSp').value; $('spV').textContent = flySpeed + ' m/s'; };
$('cPol').onchange = () => { pollen.visible = $('cPol').checked; };

function setShadows(on) {
  shadowsOn = on; renderer.shadowMap.enabled = on; sun.castShadow = on;
  for (const m of [treeMat, bushMat, rockMat, grassMat, water.material]) m.needsUpdate = true;
  for (const l of levels) l.mesh.material.needsUpdate = true;
  $('bSh').textContent = 'Schatten: ' + (on ? 'AN' : 'AUS'); $('bSh').classList.toggle('on', on);
}
$('bSh').onclick = () => setShadows(!shadowsOn);
function applyQuality(k) {
  qKey = k; Q = PRESETS[k];
  maxPR = Math.min(DPR, Q.pr); curPR = maxPR; renderer.setPixelRatio(curPR);
  U.uTreeR.value = Q.R2; U.uGR.value = Q.GR;
  buildTerrain(Q.N);
  if (Q.shadow) { sun.shadow.mapSize.set(Q.shadow, Q.shadow); if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; } }
  setShadows(Q.shadow > 0);
  grassL.cache.clear();
  for (const L of layers) L.reset();
  vReset();
  $('bQ').textContent = 'Qualität: ' + Q.name;
  forceRebuild = true;
}
const QORDER = ['low', 'med', 'high'];
$('bQ').onclick = () => applyQuality(QORDER[(QORDER.indexOf(qKey) + 1) % 3]);
const HINT = isTouch ? 'Links Joystick (ganz raus = Sprint) · rechts umsehen · „Bauen“ halten' : 'WASD · Maus ziehen · Shift · Space · F Flug · Rechtsklick/E bauen · R Modus · T Form · 1–6 Material · Rad Größe';

function collide() {
  const cx = Math.floor(pos.x / 128), cz = Math.floor(pos.z / 128);
  for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
    const c = treeL.cache.get(key(cx + i, cz + j)); if (!c) continue;
    for (const t of c.trees) {
      const dx = pos.x - t.x, dz = pos.z - t.z, d = Math.hypot(dx, dz), rr = t.H * (t.sp ? .028 : .032) * t.wf * 1.45 + .5;
      if (d < rr && d > 1e-3) { pos.x = t.x + dx / d * rr; pos.z = t.z + dz / d * rr; }
    }
  }
}

function move(dt) {
  let mx = joy.x, mz = -joy.y;
  if (keys.KeyW || keys.ArrowUp) mz += 1; if (keys.KeyS || keys.ArrowDown) mz -= 1;
  if (keys.KeyD || keys.ArrowRight) mx += 1; if (keys.KeyA || keys.ArrowLeft) mx -= 1;
  const ml = Math.hypot(mx, mz); if (ml > 1) { mx /= ml; mz /= ml; }
  const sprint = keys.ShiftLeft || keys.ShiftRight || Math.hypot(joy.x, joy.y) > .93;
  const fx = -Math.sin(yaw), fz = -Math.cos(yaw), rx = Math.cos(yaw), rz = -Math.sin(yaw);
  if (fly) {
    const sp = flySpeed * (sprint ? 3 : 1), cp = Math.cos(pitch);
    pos.x += (fx * cp * mz + rx * mx) * sp * dt; pos.z += (fz * cp * mz + rz * mx) * sp * dt;
    pos.y += (Math.sin(pitch) * mz + upIn + (keys.Space ? 1 : 0) - (keys.KeyC ? 1 : 0)) * sp * dt;
    const g = Math.max(heightAt(pos.x, pos.z), 0) + 1.7; if (pos.y < g) pos.y = g;
  } else {
    const sp = sprint ? 19 : 5.5, EYE = 1.65;
    let foot = pos.y - EYE;
    const free = (x, z) => dens(x, foot + .7, z) <= 0 && dens(x, foot + 1.55, z) <= 0;
    const nx = pos.x + (fx * mz + rx * mx) * sp * dt, nz = pos.z + (fz * mz + rz * mx) * sp * dt;
    if (free(nx, pos.z)) pos.x = nx;
    if (free(pos.x, nz)) pos.z = nz;
    collide();
    vy -= 22 * dt; foot += vy * dt;
    if (vy > 0 && dens(pos.x, foot + 1.8, pos.z) > 0) vy = 0;
    if (dens(pos.x, foot, pos.z) > 0) {
      let k = 0; while (k < 30 && dens(pos.x, foot + .04, pos.z) > 0) { foot += .04; k++; }
      vy = 0; grounded = true;
    } else grounded = dens(pos.x, foot - .1, pos.z) > 0;
    if (foot < -.25 && dens(pos.x, foot, pos.z) <= 0) { foot = -.25; vy = Math.max(0, vy); grounded = true; }
    pos.y = foot + EYE;
  }
}

function placeShadowCam() {
  const c = camera.position, d = sunDir;
  const right = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), d).normalize();
  const up = new THREE.Vector3().crossVectors(d, right).normalize();
  const tex = 2 * SH / sun.shadow.mapSize.x;
  const a = Math.round(c.dot(right) / tex) * tex, b = Math.round(c.dot(up) / tex) * tex, w = c.dot(d);
  const ctr = right.multiplyScalar(a).add(up.multiplyScalar(b)).add(d.clone().multiplyScalar(w));
  sun.target.position.copy(ctr); sun.position.copy(ctr).addScaledVector(d, 800);
}

/* ================= BAUEN ================= */
const MATS = [[2, 'Erde'], [7, 'Gras'], [3, 'Stein'], [4, 'Sand'], [5, 'Lehm'], [6, 'Holz']];
let bMode = 0, bShape = 0, bMat = 2, bSize = 1.6, acting = false, lastAct = 0, buildOn = true;
$('mats').innerHTML = MATS.map(([id, n]) => `<div class="t${id === bMat ? ' on' : ''}" data-mat="${id}"><i style="background:rgb(${PAL[id].map(v => v * 255 | 0)})"></i>${n}</div>`).join('');
$('mats').onclick = e => { const t = e.target.closest('[data-mat]'); if (!t) return; bMat = +t.dataset.mat; for (const c of $('mats').children) c.classList.toggle('on', c === t); };
for (const t of document.querySelectorAll('[data-m]')) t.onclick = () => setMode(+t.dataset.m);
function setMode(m) { bMode = m; for (const t of document.querySelectorAll('[data-m]')) t.classList.toggle('on', +t.dataset.m === m); preview.material.color.set([0xff6050, 0x70ff70, 0xffd040, 0xff9030][m]); }
$('tShape').onclick = () => { bShape ^= 1; $('tShape').textContent = bShape ? 'Würfel' : 'Kugel'; preview.geometry = bShape ? boxG : sphG; };
$('sSize').oninput = () => { bSize = +$('sSize').value; $('sizeV').textContent = bSize.toFixed(1) + ' m'; };
const act = $('bAct');
act.onpointerdown = e => { e.preventDefault(); acting = true; act.classList.add('on'); };
act.onpointerup = act.onpointerleave = act.onpointercancel = () => { acting = false; act.classList.remove('on'); };
$('bBuild').onclick = () => { buildOn = !buildOn; for (const id of ['tools', 'cross', 'bAct']) $(id).style.display = buildOn ? '' : 'none'; $('bBuild').classList.toggle('on', buildOn); preview.visible = false; };
el.addEventListener('contextmenu', e => e.preventDefault());
el.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse' && e.button === 2) { acting = true; if (look.id === e.pointerId) look.id = null; } });
el.addEventListener('pointerup', e => { if (e.pointerType === 'mouse' && e.button === 2) acting = false; });
el.addEventListener('wheel', e => { bSize = Math.max(.6, Math.min(4, bSize - Math.sign(e.deltaY) * .2)); $('sSize').value = bSize; $('sSize').oninput(); }, { passive: true });
addEventListener('keydown', e => {
  if (e.code === 'KeyE') acting = true;
  if (e.code === 'KeyR') setMode((bMode + 1) % 4);
  if (e.code === 'KeyT') $('tShape').onclick();
  const n = +e.key; if (n >= 1 && n <= MATS.length) $('mats').children[n - 1].click();
});
addEventListener('keyup', e => { if (e.code === 'KeyE') acting = false; });
const sphG = new THREE.IcosahedronGeometry(1, 2), boxG = new THREE.BoxGeometry(2, 2, 2);
const preview = new THREE.Mesh(sphG, new THREE.MeshBasicMaterial({ color: 0xff6050, wireframe: true, transparent: true, opacity: .55, depthWrite: false, fog: false }));
preview.visible = false; preview.renderOrder = 5; scene.add(preview);
const camDir = new THREE.Vector3();
function findTree(o, dir, maxD) {
  const cx = Math.floor(o.x / 128), cz = Math.floor(o.z / 128), cand = [];
  for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) { const c = treeL.cache.get(key(cx + i, cz + j)); if (c) for (const t of c.trees) if (Math.hypot(t.x - o.x, t.z - o.z) < maxD + 3) cand.push(t); }
  const gh = raycast(o, dir, maxD), lim = gh ? gh.t + 1.5 : maxD;
  for (let d = .5; d < lim; d += .4) {
    const px = o.x + dir.x * d, py = o.y + dir.y * d, pz = o.z + dir.z * d;
    for (const t of cand) {
      const rr = t.H * (t.sp ? .028 : .032) * t.wf * 1.1 + .6;
      if (py > t.y - 1 && py < t.y + t.H && Math.hypot(px - t.x, pz - t.z) < rr) return { x: t.x, y: Math.max(py, t.y), z: t.z, tree: t };
    }
  }
  return null;
}
function fellTree(t) {
  const cell = treeL.cache.get(key(Math.floor(t.x / 128), Math.floor(t.z / 128)));
  if (cell) { const i = cell.trees.indexOf(t); if (i >= 0) cell.trees.splice(i, 1); }
  felled.add(fkey(t.x, t.z)); treeL.dirty = true; forceRebuild = true; scheduleSave();
}
function aimTarget() {
  camDir.set(0, 0, -1).applyQuaternion(camera.quaternion);
  if (bMode === 3) return findTree(camera.position, camDir, 40);
  const hit = raycast(camera.position, camDir, 30); if (!hit) return null;
  const r = bSize, c = { x: hit.x, y: hit.y, z: hit.z };
  if (bMode === 0) { c.x += camDir.x * r * .4; c.y += camDir.y * r * .4; c.z += camDir.z * r * .4; }
  if (bMode === 1) { c.x -= camDir.x * r * .45; c.y -= camDir.y * r * .45; c.z -= camDir.z * r * .45; }
  if (bShape) { c.x = Math.round(c.x / VS) * VS; c.y = Math.round(c.y / VS) * VS; c.z = Math.round(c.z / VS) * VS; }
  return c;
}
function doAction(c) {
  if (bMode === 3) { if (c.tree) fellTree(c.tree); return; }
  if (bMode === 1 && !fly) { const dx = c.x - pos.x, dz = c.z - pos.z, dy = c.y - (pos.y - .8); if (Math.hypot(dx, dy * .6, dz) < bSize + .6) return; }
  applyEdits([{ t: bMode, x: c.x, y: c.y, z: c.z, r: bSize, mat: bMat, shape: bMode === 2 ? 0 : bShape }]);
}
/* Speichern/Laden (localStorage) */
const SAVE_KEY = 'gigantwelt-labor-v1';
let saveT = 0;
const rd = v => Math.round(v * 100) / 100;
function scheduleSave() { if (!saveT) saveT = setTimeout(saveWorld, 1500); }
function saveWorld() {
  saveT = 0;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ ops: OPS.map(o => ({ t: o.t, x: rd(o.x), y: rd(o.y), z: rd(o.z), r: rd(o.r), mat: o.mat, shape: o.shape })), felled: [...felled] })); } catch (e) { }
}
function loadWorld() {
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (!d) return;
    if (Array.isArray(d.felled)) for (const k of d.felled) if (typeof k === 'string') felled.add(k);
    if (Array.isArray(d.ops) && d.ops.length) applyEdits(d.ops.filter(o => o && isFinite(o.x + o.y + o.z + o.r)));
  } catch (e) { }
}
$('bNew').onclick = () => { try { localStorage.removeItem(SAVE_KEY); } catch (e) { } location.reload(); };
$('bDemo').onclick = () => {
  const fx = -Math.sin(yaw), fz = -Math.cos(yaw), cx = pos.x + fx * 20, cz = pos.z + fz * 20, gy = heightAt(cx, cz), ops = [];
  ops.push({ t: 1, x: cx, y: gy - 4, z: cz, r: 10, mat: 7, shape: 0 });
  ops.push({ t: 0, x: cx, y: gy + 1.7, z: cz, r: 3.4, mat: 2, shape: 0 });
  for (let t = 11; t >= 2.5; t -= .7) ops.push({ t: 0, x: cx - fx * t, y: gy + 1.25, z: cz - fz * t, r: 1.25, mat: 2, shape: 0 });
  ops.push({ t: 1, x: cx, y: gy - 3, z: cz, r: 3, mat: 6, shape: 1 });
  ops.push({ t: 0, x: cx + fz * 2.6, y: gy + 2.6, z: cz - fx * 2.6, r: .7, mat: 2, shape: 0 });
  for (let t = 2.6; t <= 9; t += .6) ops.push({ t: 0, x: cx + fz * t, y: gy + 2.6, z: cz - fx * t, r: .55, mat: 2, shape: 0 });
  applyEdits(ops);
};

/* ================= LOOP ================= */
let last = performance.now(), forceRebuild = true, lastRB = { x: 1e9, z: 1e9, yaw: 0, t: 0 }, lastGR = { x: 1e9, z: 1e9, yaw: 0 };
let fpsAcc = 0, fpsN = 0, fps = 60, hudT = 0, resT = 0, evT = 0, msAvg = 16;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  U.uTime.value = now / 1000;
  move(dt);
  camera.position.copy(pos); camera.rotation.set(pitch, yaw, 0);
  U.uCam.value.copy(pos);
  updateTerrain(pos.x, pos.z);
  sky.position.copy(pos);
  water.position.set(Math.round(pos.x / 100) * 100, 0, Math.round(pos.z / 100) * 100);
  if (shadowsOn) placeShadowCam();

  voxPump(isTouch ? 5 : 9, pos);
  updateMask(Math.floor(pos.x / CW), Math.floor(pos.z / CW));
  pump(isTouch ? 3 : 6, pos);
  updView();
  if (buildOn) {
    const tg = aimTarget();
    preview.visible = !!tg;
    if (tg) { preview.position.set(tg.x, tg.y, tg.z); const r = bMode === 2 ? bSize : bSize; preview.scale.set(bMode === 3 ? 1.5 : r, bMode === 2 ? .15 : bMode === 3 ? 1.5 : r, bMode === 3 ? 1.5 : r); if (acting && now - lastAct > 140) { doAction(tg); lastAct = now; } }
  }
  const yawD = Math.abs(Math.atan2(Math.sin(yaw - lastRB.yaw), Math.cos(yaw - lastRB.yaw)));
  if (forceRebuild || ((Math.hypot(pos.x - lastRB.x, pos.z - lastRB.z) > 18 || yawD > .12 || treeL.dirty || bushL.dirty) && now - lastRB.t > 90)) {
    rebuildTrees(); rebuildBushes();
    treeL.dirty = bushL.dirty = false; lastRB = { x: pos.x, z: pos.z, yaw, t: now };
  }
  const gyawD = Math.abs(Math.atan2(Math.sin(yaw - lastGR.yaw), Math.cos(yaw - lastGR.yaw)));
  if (forceRebuild || Math.hypot(pos.x - lastGR.x, pos.z - lastGR.z) > 3 || gyawD > .1 || grassL.dirty) {
    rebuildGrass(); grassL.dirty = false; lastGR = { x: pos.x, z: pos.z, yaw };
  }
  forceRebuild = false;

  if (pollen.visible) {
    for (let i = 0; i < PN; i++) {
      const o = i * 3;
      for (let a = 0; a < 3; a++) {
        pp[o + a] += (pv[o + a] + Math.sin(now * .0004 + i + a) * .15) * dt;
        const c = [pos.x, pos.y, pos.z][a], hw = a === 1 ? 15 : 30;
        if (pp[o + a] < c - hw) pp[o + a] += 2 * hw; else if (pp[o + a] > c + hw) pp[o + a] -= 2 * hw;
      }
    }
    pg.attributes.position.needsUpdate = true;
  }

  renderer.render(scene, camera);

  const ms = now - (frame.prev || now); frame.prev = now; msAvg += (ms - msAvg) * .05;
  fpsAcc += ms; fpsN++;
  if (now - resT > 1500) {
    fps = fpsN ? 1000 / (fpsAcc / fpsN) : 60; fpsAcc = fpsN = 0; resT = now;
    if ($('cAuto').checked) {
      if (fps < 42 && curPR > .5) { curPR = Math.max(.5, curPR - .1); renderer.setPixelRatio(curPR); }
      else if (fps > 57 && curPR < maxPR) { curPR = Math.min(maxPR, curPR + .05); renderer.setPixelRatio(curPR); }
    }
  }
  if (now - evT > 3000) { evict(); voxEvict(pos); evT = now; }
  if (now - hudT > 400) {
    hudT = now;
    const inf = renderer.info.render, gh = heightAt(pos.x, pos.z);
    const k = n => n >= 1000 ? (n / 1000).toFixed(1) + 'k' : '' + n;
    const cells = layers.reduce((a, L) => a + L.cache.size, 0);
    vstat.chunks = 0; vstat.tris = 0; for (const ch of chunks.values()) if (ch.mesh) { vstat.chunks++; vstat.tris += ch.tris; }
    $('hud').textContent =
      `FPS ${fps.toFixed(0).padStart(3)}  ${msAvg.toFixed(1)} ms  Res ${curPR.toFixed(2)}x\n` +
      `Draws ${inf.calls}  Dreiecke ${(inf.triangles / 1e6).toFixed(2)} M\n` +
      `Terrain ${LEVELS} Ringe · Sicht ~${(Q.N * Math.pow(2, LEVELS - 1) / 2000).toFixed(0)} km\n` +
      `Bäume L0 ${k(stats.t[0])} · L1 ${k(stats.t[1])} · L2 ${k(stats.t[2])}\n` +
      `Büsche ${k(stats.b)} · Steine ${k(stats.r)} · Gras ${k(stats.g)}\n` +
      `Zellen ${cells} (+${pending()} offen)\n` +
      `Voxel ${vstat.chunks} Chunks · ${k(vstat.tris)} Dr. · Mesh ${vstat.ms.toFixed(1)} ms · Edits ${OPS.length}\n` +
      `Pos ${pos.x.toFixed(0)} / ${pos.z.toFixed(0)}  Höhe ${pos.y.toFixed(0)} m (${(pos.y - Math.max(gh, 0)).toFixed(1)} ü.G.)\n` + HINT;
  }
}

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); forceRebuild = true; });

/* ================= START ================= */
(async () => {
  const sp = findSpawn();
  pos.set(sp.x, heightAt(sp.x, sp.z) + 1.7, sp.z); yaw = sp.yaw;
  setSun(24, 210);
  $('spV').textContent = flySpeed + ' m/s';
  applyQuality(qKey);
  camera.position.copy(pos);
  loadWorld();
  // Nahbereich vorab erzeugen
  const nearR = Q.R1;
  const origR2 = treeL.radiusFn; treeL.radiusFn = () => nearR; treeL.reset();
  let done = false, steps = 0;
  while (!done) {
    done = voxPump(30, pos) && pump(30, pos); steps++;
    const tot = layers.reduce((a, L) => a + L.offs.length, 0) + vOffs.length, p = pending() + (vOffs.length - vPtr);
    $('bar').firstChild.style.width = (100 * (1 - p / tot)).toFixed(0) + '%';
    $('lt').textContent = `${tot - p} / ${tot} Zellen`;
    await new Promise(r => setTimeout(r, 0));
  }
  treeL.radiusFn = origR2; treeL.reset();
  forceRebuild = true;
  $('load').style.display = 'none';
  requestAnimationFrame(t => { last = t; frame(t); });
})();
