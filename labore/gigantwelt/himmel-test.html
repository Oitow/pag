<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Himmel-Test (Gigant-Welt)</title>
<style>
/* VOICE: ruhiges Messinstrument  IDEA: Himmel zum Anschauen  PICTURE: Vollbild-Himmel  COLOUR: dunkles Glas
   TYPE: Monospace für Werte  LAYOUT: FPS links oben, Uhrzeit-Schieber unten */
html,body{margin:0;height:100%;overflow:hidden;background:#000;touch-action:none;font-family:system-ui,sans-serif;color:#eef}
canvas{display:block}
#fps{position:fixed;left:8px;top:8px;font:12px ui-monospace,Menlo,monospace;background:rgba(0,0,0,.5);padding:5px 8px;border-radius:8px;pointer-events:none}
#bar{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:min(94vw,460px);background:rgba(0,0,0,.55);border-radius:12px;padding:8px 12px;font-size:13px}
#bar input{width:100%;margin-top:4px}
</style>
</head>
<body>
<div id="fps"></div>
<div id="bar"><span id="uhr"></span> Uhr <input id="z" type="range" min="0" max="24" step="0.05" value="12"></div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';
import { createAtmosphaere } from './js/atmosphaere.js';

const Q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(68, innerWidth / innerHeight, 0.4, 60000);
camera.rotation.order = 'YXZ';
camera.position.set(0, +(Q.get('hoehe') || 6), 0);

const hemi = new THREE.HemisphereLight(0xbcd8ff, 0x46553a, 1);
const sonne = new THREE.DirectionalLight(0xffffff, 3);
scene.add(hemi, sonne, sonne.target);
const atm = createAtmosphaere({ scene, renderer, sonne, hemi });

/* Boden: 60 km, leichte Farbvariation */
const N = 96, ground = new THREE.PlaneGeometry(60000, 60000, N, N);
ground.rotateX(-Math.PI / 2);
{ const p = ground.attributes.position, col = new Float32Array(p.count * 3), c = new THREE.Color();
  for (let i = 0; i < p.count; i++) { const x = p.getX(i), z = p.getZ(i);
    const v = .5 + .5 * Math.sin(x * .0007) * Math.sin(z * .0009 + 1.3), f = .5 + .5 * Math.sin(x * .012 + z * .007);
    c.setRGB(.13 + .07 * v, .26 + .1 * v + .02 * f, .07 + .03 * v); col.set([c.r, c.g, c.b], i * 3); }
  ground.setAttribute('color', new THREE.BufferAttribute(col, 3)); }
scene.add(new THREE.Mesh(ground, new THREE.MeshLambertMaterial({ vertexColors: true })));

/* Ferne Kegelberge bis 20 km (deterministisch) */
const berg = new THREE.MeshLambertMaterial({ color: 0x6d675f });
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
for (let i = 0; i < 36; i++) {
  const a = rnd() * Math.PI * 2, d = 2500 + rnd() * 17500, h = 700 + rnd() * 2300, r = h * (1.1 + rnd() * .8);
  const m = new THREE.Mesh(new THREE.ConeGeometry(r, h, 7, 1), berg);
  m.position.set(Math.sin(a) * d, h / 2, Math.cos(a) * d); m.rotation.y = rnd() * 6; scene.add(m);
}
/* Lambert-Würfel in der Nähe (2 m) und Turm für Höhennebel/Maßstab */
const wuerfel = new THREE.MeshLambertMaterial({ color: 0xc9b99a });
[[8, 1, -12], [-6, 1, -20], [14, 1, -40], [-20, 1, -80], [30, 1, -200], [-60, 1, -600]].forEach(([x, y, z], i) => {
  const s = i < 3 ? 2 : 2 + i * 6; const m = new THREE.Mesh(new THREE.BoxGeometry(s, s, s), wuerfel);
  m.position.set(x, s / 2, z); scene.add(m);
});
const turm = new THREE.Mesh(new THREE.BoxGeometry(30, 160, 30), wuerfel); turm.position.set(120, 80, -900); scene.add(turm);

/* Kamera: Blickrichtung ?blick=<Kompassgrad> (0 = +z/Süden-Konvention wie Sonnen-Azimut), Ziehen dreht */
let yaw = (+(Q.get('blick') ?? 200)) * R_(), pitch = (+(Q.get('nick') ?? 6)) * R_();
function R_() { return Math.PI / 180; }
let drag = null;
addEventListener('pointerdown', e => { if (e.target === renderer.domElement) drag = [e.clientX, e.clientY]; });
addEventListener('pointerup', () => drag = null);
addEventListener('pointermove', e => { if (!drag) return; yaw -= (e.clientX - drag[0]) * .005; pitch = Math.max(-1.2, Math.min(1.4, pitch + (e.clientY - drag[1]) * .005)); drag = [e.clientX, e.clientY]; });
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

const z = document.getElementById('z'), uhr = document.getElementById('uhr');
function zeit(h) { atm.setZeit(h); uhr.textContent = Math.floor(h) + ':' + String(Math.round((h % 1) * 60)).padStart(2, '0'); }
z.value = Q.get('zeit') ?? 12; zeit(+z.value); z.oninput = () => zeit(+z.value);

const fps = document.getElementById('fps'); let n = 0, t0 = performance.now(), last = t0;
renderer.setAnimationLoop(() => {
  const now = performance.now(), dt = Math.min(.1, (now - last) / 1000); last = now;
  camera.rotation.set(pitch, Math.PI + yaw, 0);
  sonne.position.copy(camera.position).addScaledVector(atm.sonnenRichtung, 300); sonne.target.position.copy(camera.position);
  atm.update(dt, camera.position);
  renderer.render(scene, camera);
  n++; if (now - t0 > 500) { fps.textContent = Math.round(n * 1000 / (now - t0)) + ' FPS'; n = 0; t0 = now; }
});
</script>
</body>
</html>
